Changes:
- Dependency on snapshot-controller module made optional: VolumeSnapshotClass is created
    only if the snapshot.storage.k8s.io group CRD is present, the rest of the functionality
    works without it
- Correction: only the credentials of the active image source remain in the deckhouse-registry
    secret
- Correction: LINSTOR no longer requests a list of all cluster CRDs when determining
    the database version
- Correction: LINSTOR ignores unknown object properties when working with Kubernetes
    API
- Correction: installing DRBD on nodes reinstalls the package if the sources are
    outdated and more strictly checks the version of the loaded module
- Re-issuance of certificates has been switched to a manual procedure described in
  the FAQ; manualcertrenewal-trigger trigger hook removed
- Updating base images, container-base and lib-helm to 1.72.12
- Fixed vulnerabilities found when scanning module images
- Internal changes in module assembly

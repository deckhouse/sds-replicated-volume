Изменения:
  - Зависимость от модуля snapshot-controller стала необязательной: VolumeSnapshotClass создается только при наличии CRD группы snapshot.storage.k8s.io, остальная функциональность работает без него
  - Исправление: в секрете deckhouse-registry остаются учетные данные только активного источника образов
  - Исправление: LINSTOR больше не запрашивает список всех CRD кластера при определении версии базы данных
  - Исправление: LINSTOR игнорирует неизвестные свойства объектов при работе с Kubernetes API
  - Исправление: установка DRBD на узлах переустанавливает пакет при устаревших исходниках и строже проверяет версию загруженного модуля
  - Перевыпуск сертификатов переведен на ручную процедуру, описанную в FAQ; хук-триггер manualcertrenewal-trigger удален
  - Обновление базовых образов, container-base и lib-helm до 1.72.12
  - Устранены уязвимости, найденные при сканировании образов модуля
  - Внутренние изменения в сборке модуля

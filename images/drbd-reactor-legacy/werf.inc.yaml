---
# build legacy drbd-utils .rpm packages for the LINSTOR control plane
image: {{ $.ImageName }}-utils-artifact
from: {{ index $.Images "builder/golang-alt" }}
final: false

git:
  - url: {{ $.Root.SOURCE_REPO }}/LINBIT/drbd-utils
    add: /
    to: /drbd-utils
    tag: v{{ include "get_oss_version_by_id" (list "DRBD_UTILS_LEGACY" $.Root) }}
    stageDependencies:
      setup:
        - "**/*"

  - url: {{ $.Root.SOURCE_REPO }}/LINBIT/thin-send-recv
    add: /
    to: /thin-send-recv
    tag: v{{ include "get_oss_version_by_id" (list "THIN_SEND_RECV" $.Root) }}
    stageDependencies:
      setup:
        - "**/*"

shell:
  beforeInstall:
    - export DEBIAN_FRONTEND=noninteractive
    - |
      # base-images v3.0.x bakes a corrupt RPM database into builder/golang-alt;
      # without this rebuild every apt-get transaction fails. Drop once fixed upstream.
      rpm --rebuilddb
      apt-get update \
      && apt-get -y install {{ $.Root.BUILD_PACKAGES }} flex clitest xsltproc locales libxml2 po4a bash-completion docbook-xsl udev asciidoctor libkeyutils-devel \
      && apt-get -y install ca-certificates \
      && update-ca-trust
    - {{ $.Root.ALT_CLEANUP_CMD }}
  install:
    {{- $ctx := dict }}
    {{- include "utils:prepare-rpm-build" $ctx | nindent 2 }}
  beforeSetup:
    - sed -i -e 's/# en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' /etc/locale.gen && locale-gen
    - export LANG=en_US.UTF-8 LANGUAGE=en_US:en LC_ALL=en_US.UTF-8
  setup:
    # clone drbd-utils git repo
    {{- $ctx := dict }}
    {{- $_ := set $ctx "repo" (printf "%s/LINBIT/drbd-utils" $.Root.SOURCE_REPO) }}
    {{- $_ := set $ctx "branch" (printf "v%s" (include "get_oss_version_by_id" (list "DRBD_UTILS_LEGACY" $.Root))) }}
    {{- $_ := set $ctx "folder" "/drbd-utils" }}
    {{- include "utils:checkout-git" $ctx | nindent 2 }}

    - install /dev/null /usr/local/bin/lbvers.py
    - ./autogen.sh && ./configure --without-manual && ./configure --enable-spec --without-manual
    - |
      # Restore the 9.30 compatibility macros. Use lazy definitions so ALT RPM
      # expands the feature name when the macro is called, not when it is defined.
      sed -i '1i\
      %if !%{defined bcond_without}\
      %define bcond_without() %{expand:%%{!?_without_%{1}:%%global with_%{1} 1}}\
      %define bcond_with() %{expand:%%{?_with_%{1}:%%global with_%{1} 1}}\
      %define with() %{expand:%%{?with_%{1}:1}%%{!?with_%{1}:0}}\
      %define without() %{expand:%%{?with_%{1}:0}%%{!?with_%{1}:1}}\
      %endif' drbd.spec

      # Only drbd-utils is shipped. Do not add weak dependencies on the companion RPMs.
      # Avoid upstream rich/weak dependency syntax on older ALT RPM versions.
      sed -i \
        -e 's/^%global richdeps .*/%global richdeps 0/' \
        -e '/^Recommends:/d' \
        drbd.spec

      # The optional TNF fencing helper would add Python module dependencies to
      # the standalone legacy RPM, which LINSTOR installs directly with rpm.
      sed -i \
        -e '/\/tnf-drbd-fence\.py[co]\?$/d' \
        -e '/^make .*install/a rm -f %{buildroot}%{_prefix}/lib/drbd/tnf-drbd-fence.py' \
        drbd.spec

      # Since 9.36, the spec always packages systemd files. Use the same RPM
      # paths for configure and %files, even when systemd.pc is unavailable.
      # Use systemd scriptlet macros only when ALT's build environment provides them.
      sed -i \
        -e 's/--with-initscripttype=systemd/--with-systemdunitdir=%{_unitdir} --with-systemdpresetdir=%{_presetdir} --with-initscripttype=systemd/' \
        -e 's/^%systemd_\([a-z]*\) \(.*\)$/%{?systemd_\1:%systemd_\1 \2}/' \
        drbd.spec
    # substitute ubuntu packages with ALTLinux's ones
    - sed -i -e 's/keyutils-libs-devel/libkeyutils-devel/g' drbd.spec
    # fix upstream_version/rpm_version: configure.ac has base version (e.g. 9.30.0),
    # but we build with the version from oss.yaml.
    - |
      FULL_VERSION="{{ include "get_oss_version_by_id" (list "DRBD_UTILS_LEGACY" $.Root) }}"
      RPM_VERSION=$(echo "$FULL_VERSION" | sed -e 's/-rc/~rc/' -e 's/-alpha/~alpha/' -e 's/-flant/~flant/')
      sed -i \
        -e "s/^%global upstream_version .*/%global upstream_version ${FULL_VERSION}/" \
        -e "s/^%global rpm_version .*/%global rpm_version ${RPM_VERSION}/" \
        drbd.spec

    # make .rpm package
    {{- $ctx := dict }}
    {{- $_ := set $ctx "name" "drbd-utils" }}
    {{- $_ := set $ctx "version" (include "get_oss_version_by_id" (list "DRBD_UTILS_LEGACY" $.Root)) }}
    {{- $_ := set $ctx "spec" "drbd.spec" }}
    {{- $_ := set $ctx "arch" "x86_64" }}
    {{- $_ := set $ctx "rpmbuild_args" "--without=manual" }}
    {{- include "utils:build-rpm-pkg" $ctx | nindent 2 }}

    # clone thin-send-recv git repo
    {{- $ctx := dict }}
    {{- $_ := set $ctx "repo" (printf "%s/LINBIT/thin-send-recv" $.Root.SOURCE_REPO) }}
    {{- $_ := set $ctx "branch" (printf "v%s" (include "get_oss_version_by_id" (list "THIN_SEND_RECV" $.Root))) }}
    {{- $_ := set $ctx "folder" "/thin-send-recv" }}
    {{- include "utils:checkout-git" $ctx | nindent 2 }}

    # make .rpm package
    {{- $ctx := dict }}
    {{- $_ := set $ctx "name" "thin-send-recv" }}
    {{- $_ := set $ctx "version" (include "get_oss_version_by_id" (list "THIN_SEND_RECV" $.Root)) }}
    {{- $_ := set $ctx "spec" "thin_send_recv.spec" }}
    {{- $_ := set $ctx "arch" "x86_64" }}
    {{- include "utils:build-rpm-pkg" $ctx | nindent 2 }}

    - ls -la /
    # drbd-utils-9.30.0-1.x86_64.rpm
    # thin-send-recv-1.1.3-1.x86_64.rpm

---
# build drbd-reactor .rpm packages
image: {{ $.ImageName }}-reactor-artifact
from: {{ index $.Images "builder/golang-alt" }}
final: false

git:
  - url: {{ $.Root.SOURCE_REPO }}/LINBIT/drbd-reactor
    add: /
    to: /drbd-reactor
    tag: v{{ include "get_oss_version_by_id" (list "DRBD_REACTOR" $.Root) }}
    stageDependencies:
      setup:
        - "**/*"

  - add: /images/{{ $.ImageName }}/patches
    to: /patches
shell:
  beforeInstall:
    - export DEBIAN_FRONTEND=noninteractive
    - |
      # base-images v3.0.x bakes a corrupt RPM database into builder/golang-alt;
      # without this rebuild every apt-get transaction fails. Drop once fixed upstream.
      rpm --rebuilddb
      apt-get update \
      && apt-get -y install {{ $.Root.BUILD_PACKAGES }} rust-cargo bash-completion \
      && apt-get -y install ca-certificates \
      && update-ca-trust
    - {{ $.Root.ALT_CLEANUP_CMD }}
    - |
      cargo install cargo-sbom \
      && cargo sbom -V \
      && mv ~/.cargo/bin/cargo-sbom /usr/local/bin/ \
      && rm -rf ~/.cargo
  install:
    {{- $ctx := dict }}
    {{- include "utils:prepare-rpm-build" $ctx | nindent 2 }}
  setup:
    {{- $ctx := dict }}
    {{- $_ := set $ctx "repo" (printf "%s/LINBIT/drbd-reactor" $.Root.SOURCE_REPO) }}
    {{- $_ := set $ctx "branch" (printf "v%s" (include "get_oss_version_by_id" (list "DRBD_REACTOR" $.Root))) }}
    {{- $_ := set $ctx "folder" "/drbd-reactor" }}
    {{- include "utils:checkout-git" $ctx | nindent 2 }}
    # apply git patches to upstream's code
    - git apply /patches/*.patch && git commit -am "Auto-commit patched files"
    - git tag -f v{{ include "get_oss_version_by_id" (list "DRBD_REACTOR" $.Root) }}

    - install /dev/null /usr/local/bin/lbvers.py

    # make .rpm package
    {{- $ctx := dict }}
    {{- $_ := set $ctx "name" "drbd-reactor" }}
    {{- $_ := set $ctx "version" (include "get_oss_version_by_id" (list "DRBD_REACTOR" $.Root)) }}
    {{- $_ := set $ctx "spec" "drbd-reactor.spec" }}
    {{- $_ := set $ctx "arch" "x86_64" }}
    {{- include "utils:build-rpm-pkg" $ctx | nindent 2 }}

    - ls -la /
    # drbd-reactor-1.8.0-1.x86_64.rpm

---
# main almost distroless image
image: {{ $.ImageName }}
from: {{ index $.Images "builder/golang-alt" }}
import:
  - image: {{ $.ImageName }}-utils-artifact
    add: /
    to: /packages
    includePaths:
      # - python-linstor-*.rpm
      - drbd-utils-*.rpm
      - thin-send-recv-*.rpm
    before: setup

  - image: {{ $.ImageName }}-reactor-artifact
    add: /
    to: /packages
    includePaths:
      - drbd-reactor-*.rpm
    before: setup

shell:
  install:
    {{- include "alt packages upgrade" $ | nindent 4 }}
    - apt-get -y install libkeyutils kmod sysklogd
    - {{ $.Root.SVACE_CLEANUP_CMD }}
    - {{ $.Root.ALT_CLEANUP_CMD }}
    # Remove build-only static analysis tooling inherited from the builder base.
    - {{ $.Root.SVACE_CLEANUP_CMD }}
  setup:
    - ls -la /packages
    - |
      for f in /packages/*.rpm; do
        echo "Install ${f}"
        rpm -ihv --nodeps --noscripts $f
      done
    - sed -i 's/usage-count yes;/usage-count no;/' /etc/drbd.d/global_common.conf

imageSpec:
  config:
    entrypoint: ["/usr/sbin/drbd-reactor"]
---
{{- include "vex mitigation" (list $ $.ImageName) }}

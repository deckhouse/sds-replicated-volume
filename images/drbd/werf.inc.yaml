---
image: {{ $.ImageName }}-artifact
from: {{ index $.Images "builder/golang-alt" }}
final: false
git:
  - add: /images/{{ $.ImageName }}/scripts
    to: /scripts
    stageDependencies:
      beforeSetup:
        - "**/*"

secrets:
{{ include "secret for private go modules" . }}

shell:
  beforeInstall:
    - export DEBIAN_FRONTEND=noninteractive
    - |
      # base-images v3.0.x bakes a corrupt RPM database into builder/golang-alt;
      # without this rebuild every apt-get transaction fails. Drop once fixed upstream.
      rpm --rebuilddb
      apt-get update \
      && apt-get -y install {{ $.Root.BUILD_PACKAGES }} \
      && apt-get -y install ca-certificates \
      && update-ca-trust
    - {{ $.Root.ALT_CLEANUP_CMD }}
    - git config --global user.email "builder@deckhouse.io"
    - git config --global user.name "deckhouse"
  install:
    {{- $ctx := dict }}
    {{- include "utils:prepare-rpm-build" $ctx | nindent 2 }}
  beforeSetup:
    - mv /scripts/* /
    - chmod +x /install
    - chmod +x /uninstall
  setup:
    {{- include "utils:fox-fork-git-config" . | nindent 2 }}
    - git clone --depth 1 --branch drbd-{{ include "get_oss_version_by_id" (list "DRBD" $.Root) }} https://github.com/deckhouse/3p-drbd.git /drbd
    - cd /drbd
    # drbd-headers comes from the gitlink of this tag; the insteadOf rule above sends
    # the fetch to the fork instead of the github URL recorded in .gitmodules.
    - git submodule update --init --recursive
    - sed -e "s/\<curl\>/d8-curl -k/g" -i /drbd/drbd/drbd-kernel-compat/gen_compat_patch.sh
    - git commit -am 'd8-curl'
      # tarball required by spaas image
    - make tarball
      # disable use of local spatch (see /drbd/drbd/drbd-kernel-compat/gen_compat_patch.sh)
    - rm -rf .git
---
image: {{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}

import:
  - image: {{ $.ImageName }}-artifact
    add: /
    to: /
    includePaths:
      - drbd
      - install
      - uninstall
    before: setup

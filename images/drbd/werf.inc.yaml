---
image: {{ $.ImageName }}-artifact
from: {{ index $.Images "builder/golang-alt" }}
final: false
git:
  - add: /images/{{ $.ImageName }}/scripts
    to: /scripts
    stageDependencies:
      beforeSetup:
        - "**/*"
shell:
  beforeInstall:
    - export DEBIAN_FRONTEND=noninteractive
    - |
      apt-get update \
      && apt-get -y install {{ $.Root.BUILD_PACKAGES }} \
      && apt-get -y install ca-certificates \
      && update-ca-trust
    - {{ $.Root.ALT_CLEANUP_CMD }}
    - git config --global user.email "builder@deckhouse.io"
    - git config --global user.name "deckhouse"
  install:
    {{- $ctx := dict }}
    {{- include "utils:prepare-rpm-build" $ctx | nindent 2 }}
  beforeSetup:
    - mv /scripts/* /
    - chmod +x /install
    - chmod +x /uninstall
  setup:
    # Pinned by commit rather than by a drbd-<version> tag: the admin-lock
    # feature this version carries has not been tagged in 3p-drbd yet. The
    # commit still has to build a source tree whose REL_VERSION equals the DRBD
    # version in oss.yaml, because the tarball name below and the runtime
    # version check in templates/linstor-node/daemonset.yaml both derive from it.
    - git init /drbd
    - cd /drbd
    - git remote add origin {{ $.Root.SOURCE_REPO }}/deckhouse/3p-drbd.git
    - git fetch --depth 1 origin {{ $.Root.DRBD_COMMIT }}
    - git checkout --detach FETCH_HEAD
    - git submodule update --init --recursive
    - sed -e "s/\<curl\>/d8-curl -k/g" -i /drbd/drbd/drbd-kernel-compat/gen_compat_patch.sh
    - git commit -am 'd8-curl'
      # tarball required by spaas image
    - make tarball
      # disable use of local spatch (see /drbd/drbd/drbd-kernel-compat/gen_compat_patch.sh)
    - rm -rf .git
---
image: {{ $.ImageName }}
from: {{ index $.Images "builder/distroless" }}

import:
  - image: {{ $.ImageName }}-artifact
    add: /
    to: /
    includePaths:
      - drbd
      - install
      - uninstall
    before: setup
docker:
  LABEL:
    distro: all
    version: all
    drbd: {{ include "get_oss_version_by_id" (list "DRBD" $.Root) }}

---
image: {{ $.ImageName }}-golang-artifact
from: {{ index $.Images "builder/golang" }}
final: false
git:
  - url: https://github.com/piraeusdatastore/linstor-scheduler-extender
    add: /
    to: /usr/local/go/{{ $.ImageName }}
    tag: v{{ include "get_oss_version_by_id" (list "LINSTOR_SCHEDULER_EXTENDER" $.Root) }}
    stageDependencies:
      setup:
        - "**/*"

  - url: https://github.com/libopenstorage/stork
    add: /
    to: /usr/local/go/stork
    tag: v{{ include "get_oss_version_by_id" (list "LINSTOR_SCHEDULER_STORK" $.Root) }}
    stageDependencies:
      beforeSetup:
        - "**/*"
      setup:
        - "**/*"

  - add: /images/{{ $.ImageName }}/patches
    to: /patches
    stageDependencies:
      beforeSetup:
        - "**/*"
      setup:
        - "**/*"

mount:
  - fromPath: ~/go-pkg-cache
    to: /go/pkg

secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}

shell:
  beforeSetup:
    - pm install git
    - cd /usr/local/go/stork
    - '[ -d "/patches/stork/new-files" ] && cp -frp /patches/stork/new-files/* /usr/local/go/stork/'
    - git apply /patches/stork/*.patch

  setup:
    - cd /usr/local/go/{{ $.ImageName }}
    - git apply /patches/*.patch
    - go mod edit -replace=github.com/libopenstorage/stork=/usr/local/go/stork
    - cd cmd/linstor-scheduler-extender
    # -mod=mod instead of `go mod tidy`: tidy also resolves the test dependencies of
    # the modules we import, and google.golang.org/grpc tests pull go-logr/funcr, which
    # does not exist in the go-logr/logr v0.3.0 the extender pins for stork. The build
    # itself does not need those packages, so let the build update go.mod/go.sum.
    - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 GOFLAGS=-mod=mod GOPROXY=$(cat /run/secrets/GOPROXY) go build -ldflags="-s -w -X github.com/piraeusdatastore/linstor-scheduler-extender/pkg/consts.Version=v{{ include "get_oss_version_by_id" (list "LINSTOR_SCHEDULER_EXTENDER" $.Root) }}"
    - mv {{ $.ImageName }} /
    - chmod +x /{{ $.ImageName }}
---
image: {{ $.ImageName }}
from: {{ index $.Images "builder/scratch" }}

import:
  - image: {{ $.ImageName }}-golang-artifact
    add: /{{ $.ImageName }}
    to: /{{ $.ImageName }}
    before: setup

docker:
  ENTRYPOINT: ["/{{ $.ImageName }}"]
  LABEL:
    distro: all
    version: all
    linstor-scheduler-extender: {{ include "get_oss_version_by_id" (list "LINSTOR_SCHEDULER_EXTENDER" $.Root) }}
---
{{- include "vex mitigation" (list $ $.ImageName) }}
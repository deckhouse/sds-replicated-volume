---
image: {{ $.ImageName }}-src-artifact
from: {{ index $.Images "builder/golang-alt" }}
final: false

git:
  - add: /
    to: /src
    includePaths:
      - api
      - lib/go
      - images/{{ $.ImageName }}
    stageDependencies:
      install:
        - '**/*'
    excludePaths:
      - images/{{ $.ImageName }}/werf.yaml

shell:
  install:
    - echo "src artifact"

---
image: {{ $.ImageName }}-golang-artifact
from: {{ index $.Images "builder/golang" }}
final: false

import:
  - image: {{ $.ImageName }}-src-artifact
    add: /src
    to: /src
    before: install

mount:
  - fromPath: ~/go-pkg-cache
    to: /go/pkg
  - from: tmp_dir
    to: /run/go-private-auth

secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
{{ include "secret for private go modules" . }}

shell:
  setup:
    {{- include "auth for private go modules" . | nindent 4 }}
    - cd /src/images/{{ $.ImageName }}/cmd
    - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
    - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o /{{ $.ImageName }}
    # Absolute mode: see the note in .werf/defines/golang.tmpl — `chmod +x` is masked by
    # the umask in effect and can leave the binary executable by root only.
    - chmod 0755 /{{ $.ImageName }}

---
image: {{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}
# An import is keyed on file content, not on mode: without this the pre-fix stage stays cached.
fromCacheVersion: "1"

import:
  - image: {{ $.ImageName }}-golang-artifact
    add: /{{ $.ImageName }}
    to: /{{ $.ImageName }}
    before: setup

imageSpec:
  config:
    entrypoint: ["/{{ $.ImageName }}"]
    user: deckhouse:deckhouse

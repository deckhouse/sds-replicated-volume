---
image: metadata-backup
from: {{ index $.Images "builder/golang-alt" }}
git:
  - add: /images/metadata-backup/backup.py
    to: /backup.py
    stageDependencies:
      setup:
        - "**/*"
shell:
  beforeInstall:
    {{- include "alt packages upgrade" $ | nindent 4 }}
    - DEBIAN_FRONTEND=noninteractive apt-get install -y wget unzip git python3 python3-module-pip jq curl gettext-base util-linux vim-console
    - pip3 install kubernetes==30.1.0 urllib3==2.7.0
    - {{ $.Root.SVACE_CLEANUP_CMD }}
    - {{ $.Root.ALT_CLEANUP_CMD }}
  setup:
    - chmod 755 /backup.py
---
image: {{ $.ImageName }}-src-artifact
from: {{ index $.Images "builder/golang-alt" }}
final: false

git:
  - add: /
    to: /src
    includePaths:
      - api
      - images/{{ $.ImageName }}
      - lib/go
    stageDependencies:
      install:
        - '**/*'
    excludePaths:
      - images/{{ $.ImageName }}/werf.yaml

shell:
  install:
    - echo "src artifact"

---
image: {{ $.ImageName }}-golang-artifact
from: {{ index $.Images "builder/golang" }}
final: false

import:
  - image: {{ $.ImageName }}-src-artifact
    add: /src
    to: /src
    before: install

mount:
  - fromPath: ~/go-pkg-cache
    to: /go/pkg
  - from: tmp_dir
    to: /run/go-private-auth

secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
{{ include "secret for private go modules" . }}

shell:
  setup:
    {{- include "auth for private go modules" . | nindent 4 }}
    - cd /src/images/{{ $.ImageName }}/cmd
    - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
    - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o /{{ $.ImageName }}
    # Absolute mode: see the note in .werf/defines/golang.tmpl -- `chmod +x` is masked by
    # the umask in effect and can leave the binary executable by root only.
    - chmod 0755 /{{ $.ImageName }}

---
image: {{ $.ImageName }}-distroless-artifact
from: {{ index $.Images "builder/golang-alt" }}
final: false
shell:
  beforeInstall:
    # base-images v3.0.x bakes a corrupt RPM database into builder/golang-alt:
    # every apt-get transaction ends with "E: Error while running transaction"
    # (db4 error(-30986) DB_PAGE_NOTFOUND) until the database is rebuilt. The
    # defect is the image's, so drop this once container-base ships a sound one.
    - rpm --rebuilddb
    - apt-get update
    - apt-get install -y {{ $.Root.ALT_BASE_PACKAGES }}
    - rm -rf /var/lib/apt/lists/* /var/cache/apt/* && mkdir -p /var/lib/apt/lists/partial /var/cache/apt/archives/partial
  install:
    - mkdir -p /relocate/bin /relocate/sbin /relocate/etc /relocate/var/lib/ssl /relocate/usr/bin /relocate/usr/sbin /relocate/usr/share
    - cp -pr /tmp /relocate
    - cp -pr /etc/passwd /etc/group /etc/hostname /etc/hosts /etc/shadow /etc/protocols /etc/services /etc/nsswitch.conf /etc/netconfig /relocate/etc
    - cp -pr /usr/share/ca-certificates /relocate/usr/share
    - cp -pr /usr/share/zoneinfo /relocate/usr/share
    - cp -pr /var/lib/ssl/cert.pem /relocate/var/lib/ssl
    - cp -pr /var/lib/ssl/certs /relocate/var/lib/ssl
    - echo "deckhouse:x:64535:64535:deckhouse:/:/sbin/nologin" >> /relocate/etc/passwd
    - echo "deckhouse:x:64535:" >> /relocate/etc/group
    - echo "deckhouse:!::0:::::" >> /relocate/etc/shadow

---
image: {{ $.ImageName }}-distroless
from: scratch
final: false
import:
  - image: {{ $.ImageName }}-distroless-artifact
    add: /relocate
    to: /
    before: setup

---
image: {{ $.ImageName }}
from: {{ index $.Images "base/distroless" }}

import:
  - image: {{ $.ImageName }}-golang-artifact
    add: /{{ $.ImageName }}
    to: /{{ $.ImageName }}
    before: setup

imageSpec:
  config:
    entrypoint: ["/{{ $.ImageName }}"]
    user: deckhouse:deckhouse

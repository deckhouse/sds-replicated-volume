version: "2"
linters:
  default: none
  enable:
    - copyloopvar
    - dogsled
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - sloglint
    - staticcheck
    - unconvert
    - unparam
    - whitespace
  settings:
    sloglint:
      # sloglint matches a call site by the full name of its callee, and its list
      # holds only log/slog functions and (*log/slog.Logger) methods. Info, Debug
      # and Warn are promoted from the *slog.Logger that sds-common-lib's
      # logger.Logger embeds, so they resolve to (*log/slog.Logger).Info and are
      # checked. Error and Fatal are not: pkg/log declares them on its own
      # *log.Logger to attach a stack trace, and Trace is a method of
      # logger.Logger. Neither sloglint nor govet's slog analyser sees those three.
      #
      # So everything below covers Info, Debug, Warn and With, and nothing else.
      # Error -- the one place logger.Err(err) is actually used -- is on the
      # honour system: sloglint can take extra callees through custom-funcs, but
      # golangci-lint v2.9.0 does not expose that key ("golangci-lint config
      # verify" rejects it), so there is no configuration that closes the gap.
      #
      # no-mixed-args is on by default and stated here so that a later edit cannot
      # drop it without saying so. It allows a pure-attribute call such as
      # log.Error(msg, logger.Err(err)) and a pure
      # key-value call such as log.Info(msg, "name", n), but rejects mixing the two
      # in one call -- which is how a format-string argument ends up as a key.
      # kv-only is deliberately NOT set, because it would outlaw logger.Err(err).
      #
      # static-msg and no-raw-keys are left off: converting the remaining Sprintf
      # messages is a separate change.
      no-mixed-args: true
      forbidden-keys:
        # Reserved by the handler; shadowing them silently drops the real value.
        - level
        - msg
        - source
        - stacktrace
        - time
    errcheck:
      exclude-functions:
        - fmt:.*,[rR]ead|[wW]rite|[cC]lose
        - io:Copy
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)\.go$
        text: ST1005.*
      - path: (.+)\.go$
        text: should not use dot imports
      - path: (.+)\.go$
        text: don't use an underscore in package name
      - path: (.+)\.go$
        text: 'exported: .*'
      # The old controller intentionally uses deprecated API fields/types
      # (StoragePool, RSPPhase*) that it owns. Suppress SA1019 there.
      - linters: [staticcheck]
        path: images/oldcontroller/
        text: "SA1019:"
      # Test files may use deprecated API fields (StoragePool, Replication)
      # to verify backward compatibility with the old API surface.
      - linters: [staticcheck]
        path: images/controller/.*_test\.go
        text: "SA1019:"
      # The linstor-migrator suite attaches to a cluster through
      # storage-e2e/pkg/cluster, which is deprecated in favour of pkg/e2e
      # (e2e.Connect) with the lifecycle driven by cmd/bootstrap-cluster. That
      # migration is an ecosystem-wide one -- eleven storage modules and
      # storage-e2e itself still import the package, and it is explicitly kept for
      # existing suites -- so it is not this repository's to make on its own.
      # Until the suite is moved, keep the deprecation from holding go_linter red,
      # where it hides every other finding.
      - linters: [staticcheck]
        path: e2e/linstor-migrator/
        text: "SA1019:"
      # We want to keep our naming of packages
      - path: (.+)\.go$
        text: 'var-naming: .*'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/deckhouse)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

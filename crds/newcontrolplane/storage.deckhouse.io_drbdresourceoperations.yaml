---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  labels:
    module: sds-replicated-volume
  name: drbdresourceoperations.storage.deckhouse.io
spec:
  group: storage.deckhouse.io
  names:
    kind: DRBDResourceOperation
    listKind: DRBDResourceOperationList
    plural: drbdresourceoperations
    shortNames:
    - drbdrop
    singular: drbdresourceoperation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .spec.drbdResourceName
      name: Resource
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Manages operations on a DRBD resource on a particular cluster node. The resource is created to
          run a maintenance operation on a DRBD resource; the agent on the given node performs the operation
          and reports the result in the status.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              createNewUUID:
                description: Parameters for CreateNewUUID operation. Immutable once
                  set.
                properties:
                  clearBitmap:
                    default: false
                    description: Clear the bitmap when creating the new UUID (the
                      volume is considered fully synchronized).
                    type: boolean
                  forceResync:
                    default: false
                    description: |-
                      Force a resynchronization after creating the new UUID.

                      > Note that 'clearBitmap' and 'forceResync' are mutually exclusive.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: createNewUUID is immutable
                  rule: self == oldSelf
                - message: clearBitmap and forceResync are mutually exclusive
                  rule: '!(self.clearBitmap && self.forceResync)'
              drbdResourceName:
                description: |-
                  Name of the DRBD resource the operation is performed on.

                  > Important: this field is immutable and cannot be changed after the resource is created.
                maxLength: 253
                minLength: 1
                pattern: ^[0-9A-Za-z.+_-]*$
                type: string
                x-kubernetes-validations:
                - message: drbdResourceName is immutable
                  rule: self == oldSelf
              nodeName:
                description: |-
                  NodeName scopes the operation to a single agent node: only the agent
                  running on this node will reconcile the operation.
                maxLength: 253
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: nodeName is immutable
                  rule: self == oldSelf
              type:
                description: DRBDResourceOperationType represents the type of operation
                  to perform on a DRBD resource.
                enum:
                - CreateNewUUID
                - ForcePrimary
                - Invalidate
                - Outdate
                - Verify
                - CreateSnapshot
                type: string
                x-kubernetes-validations:
                - message: type is immutable
                  rule: self == oldSelf
            required:
            - drbdResourceName
            - nodeName
            - type
            type: object
          status:
            properties:
              completedAt:
                description: Time the operation completed.
                format: date-time
                type: string
              message:
                description: Additional human-readable message about the current state
                  of the operation.
                maxLength: 1024
                type: string
              phase:
                description: DRBDOperationPhase represents the phase of a DRBD operation.
                type: string
              startedAt:
                description: Time the operation started.
                format: date-time
                type: string
            type: object
        required:
        - metadata
        - spec
        type: object
    selectableFields:
    - jsonPath: .spec.nodeName
    - jsonPath: .spec.drbdResourceName
    - jsonPath: .status.phase
    served: true
    storage: true
    subresources:

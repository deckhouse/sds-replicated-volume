spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Интерфейс для управления Storage Pool в бэкенде LINSTOR.
          properties:
            apiVersion:
              description: |-
                APIVersion определяет версионную схему этого представления объекта.

                Серверы должны преобразовывать распознанные схемы в последнее внутреннее значение и могут отклонять нераспознанные значения. Более подробно: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources.
            kind:
              description: |-
                Kind — это строковое значение, представляющее REST-ресурс, который описывает этот объект.

                Серверы могут определять его на основе конечной точки, к которой клиент отправляет запросы.
                Не может быть изменено. Записывается в CamelCase.
                Подробнее: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            spec:
              description: |
                Определяет желаемые правила для Storage Pool в LINSTOR.
              properties:
                eligibleNodesPolicy:
                  description: |
                    Политики управления списком eligible nodes.

                    Всегда присутствует со значениями по умолчанию.
                  properties:
                    notReadyGracePeriod:
                      description: |
                        Сколько ждать перед исключением not-ready узла из списка eligible nodes.
                type:
                  description: |
                    Определяет тип Volume'ов.

                    Может быть:
                    - LVM (для классических LVM-томов)
                    - LVMThin (для Thin-томов)
                lvmVolumeGroups:
                  description: |
                    Список LVMVolumeGroup-ресурсов, Volume Group'ы/Thin-pool'ы которых будут использованы для создания Storage-pool'ов в бэкенде LINSTOR.

                    > **Внимание.** Каждый LVMVolumeGroup-ресурс обязан иметь тот же тип (Thin/Thick), что указан в поле 'Spec.Type' текущего ресурса.
                  items:
                    properties:
                      name:
                        description: |
                          Имя ресурса LVMVolumeGroup.
                      thinPoolName:
                        description: |
                          Имя выбранного Thin-pool в рамках указанного LVMVolumeGroup.

                          Обязательное поле если вы создаёте ReplicatedStoragePool с типом LVMThin.
                nodeLabelSelector:
                  description: |
                    Селектор узлов, eligible для участия в storage pool.

                    Только узлы, соответствующие селектору, могут хранить данные.
                    Если не указан, кандидатами считаются все узлы с подходящими LVMVolumeGroup.
                  properties:
                    matchExpressions:
                      description: |
                        Список требований label selector.

                        Требования объединяются через AND.
                      items:
                        description: |
                          Требование label selector: ключ, оператор и значения.
                        properties:
                          key:
                            description: |
                              Ключ лейбла, к которому применяется селектор.
                          operator:
                            description: |
                              Отношение ключа к набору значений.

                              Допустимые операторы: In, NotIn, Exists и DoesNotExist.
                          values:
                            description: |
                              Массив строковых значений.

                              Для операторов In и NotIn массив должен быть непустым.
                              Для Exists и DoesNotExist массив должен быть пустым.
                              При strategic merge patch массив заменяется целиком.
                    matchLabels:
                      description: |
                        Карта пар {key,value}.

                        Одна пара в matchLabels эквивалентна элементу matchExpressions с operator=In и единственным значением.
                        Требования объединяются через AND.
                systemNetworkNames:
                  description: |
                    Имена сетей, используемые для трафика репликации DRBD.

                    Необходимо указать хотя бы одно имя сети. Длина каждого имени — не более 64 символов.
                zones:
                  description: |
                    Список зон, в которых должны размещаться тома данного Storage Pool.
            status:
              description: |
                Текущая информация о состоянии Storage Pool в LINSTOR.
              properties:
                eligibleNodes:
                  description: |
                    Список узлов, eligible для данного storage pool.
                  items:
                    description: |
                      Узел, на котором допускается размещение томов данного storage pool.
                    properties:
                      agentReady:
                        description: |
                          Готов ли агент sds-replicated-volume на этом узле.
                      lvmVolumeGroups:
                        description: |
                          Список LVM Volume Group, доступных на этом узле.
                        items:
                          description: |
                            LVM Volume Group на eligible-узле.
                          properties:
                            name:
                              description: |
                                Имя ресурса LVMVolumeGroup.
                            ready:
                              description: |
                                Готов ли LVMVolumeGroup (и его thin pool, если применимо).
                            thinPoolName:
                              description: |
                                Имя Thin-pool (для Storage Pool типа LVMThin).
                            unschedulable:
                              description: |
                                Не следует ли использовать эту Volume Group для новых томов.
                      nodeName:
                        description: |
                          Имя узла Kubernetes.
                      nodeReady:
                        description: |
                          Готов ли узел Kubernetes.
                      unschedulable:
                        description: |
                          Не следует ли планировать новые тома на этот узел.
                      zoneName:
                        description: |
                          Зона, к которой относится узел.
                eligibleNodesRevision:
                  description: |
                    Увеличивается при изменении списка eligible nodes.
                message:
                  description: |
                    Человекочитаемое описание текущего phase.

                    Дублирует сообщение условия Ready.
                phase:
                  description: |
                    Операционное состояние Storage Pool.

                    Может быть:
                    - Ready (конфигурация корректна, eligible nodes рассчитаны)
                    - WaitingForLVMVolumeGroups (ожидание готовности указанных LVMVolumeGroup)
                    - InvalidConfiguration (некорректная конфигурация ресурса)
                reason:
                  description: |
                    Дополнительная информация о текущем состоянии ресурса.
                usedBy:
                  description: |
                    Какие ресурсы используют данный storage pool.
                  properties:
                    replicatedStorageClassNames:
                      description: |
                        Список имён RSC, использующих этот storage pool.

    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |
          Interface for managing operations on a DRBD resource on a specific node in the cluster.

          The resource is created to perform a maintenance operation on a DRBD resource; the agent on the specified node performs the operation and reports the result in the status.
        properties:
          apiVersion:

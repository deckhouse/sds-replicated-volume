spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            ReplicatedVolumeSnapshot описывает снимок (snapshot) ReplicatedVolume — согласованное на момент создания состояние данных тома, зафиксированное на всех его дисковых репликах.

            Ресурс создаётся CSI-драйвером при создании VolumeSnapshot и служит источником данных для восстановления тома через `spec.dataSource` ресурса ReplicatedVolume.
          properties:
            spec:
              properties:
                replicatedVolumeName:
                  description: |
                    Имя ReplicatedVolume, снимок которого создаётся.

                    > Важно: это поле является неизменяемым и не может быть изменено после первоначального создания ресурса.
            status:
              properties:
                conditions:
                  description: |
                    Условия, отражающие текущее состояние снимка.
                creationTime:
                  description: |
                    Время фиксации данных снимка. Соответствует моменту, когда снимок был создан на дисковых репликах, а не моменту создания самого ресурса.
                datamesh:
                  description: |
                    Наблюдаемый состав снимка: список реплик, участвующих в снимке, и их готовность.
                  properties:
                    members:
                      description: |
                        Участники снимка — по одному на каждую дисковую реплику исходного тома.
                      items:
                        properties:
                          name:
                            description: |
                              Имя ресурса ReplicatedVolumeReplicaSnapshot, соответствующего данному участнику.
                          nodeName:
                            description: |
                              Имя узла, на котором размещён снимок реплики.
                          ready:
                            description: |
                              Признак того, что снимок данной реплики создан и синхронизирован.
                          snapshotHandle:
                            description: |
                              Идентификатор снимка на узле — имя ресурса LVMLogicalVolumeSnapshot, в котором хранятся данные.
                    readyCount:
                      description: |
                        Количество участников, чьи снимки готовы к использованию.
                    replicatedVolumeName:
                      description: |
                        Имя исходного ReplicatedVolume, зафиксированное на момент создания снимка.
                    totalCount:
                      description: |
                        Общее количество участников снимка.
                message:
                  description: |
                    Сообщение о ходе выполнения или об ошибке.
                phase:
                  description: |
                    Текущая фаза снимка. Может быть:
                    - Pending (снимок принят, работа ещё не началась)
                    - InProgress (выполняется фаза подготовки: снимки создаются на репликах)
                    - Synchronizing (выполняется фаза синхронизации: отстающие снимки реплик догоняют источник)
                    - Ready (снимок готов к использованию)
                    - Failed (создание снимка завершилось ошибкой)
                    - Deleting (снимок и его дочерние ресурсы удаляются).
                prepareRevision:
                  description: |
                    Ревизия фазы подготовки снимка. Увеличивается при каждом новом раунде подготовки.
                prepareTransitions:
                  description: |
                    Список активных переходов (transitions) фазы подготовки снимка. Каждый переход имеет упорядоченный список шагов, объявляемых при создании и выполняемых последовательно.

                    В ходе подготовки создаются снимки на всех дисковых репликах: включается отслеживание битовой карты, создаются снимки вторичных реплик, приостанавливается ввод-вывод на первичной реплике, сбрасывается битовая карта, создаётся снимок первичной реплики, ввод-вывод возобновляется.
                  items:
                    properties:
                      fromReplicaType:
                        description: |
                          Исходный тип реплики. Не используется в переходах подготовки снимка.
                      fromSystemNetworkNames:
                        description: |
                          Исходный набор имён системных сетей. Не используется в переходах подготовки снимка.
                      group:
                        description: |
                          Группа параллелизма перехода. Задаётся контроллером при создании перехода и предназначена для наблюдаемости (объясняет, почему переход может ожидать).
                      planID:
                        description: |
                          Идентификатор плана перехода, используемого для создания данного перехода.
                      replicaName:
                        description: |
                          Имя реплики, к которой применяется переход.
                      replicaType:
                        description: |
                          Тип реплики, к которой применяется переход. Может быть: Diskful, Access, TieBreaker, ShadowDiskful.
                      steps:
                        description: |
                          Упорядоченный список шагов перехода. Шаги выполняются последовательно — активным одновременно может быть только один шаг.
                        items:
                          properties:
                            completedAt:
                              description: |
                                Время завершения шага (переход из Active в Completed).
                            datameshRevision:
                              description: |
                                Ревизия datamesh, назначенная при активации шага (0, если шаг ещё не активирован или не изменяет ревизию).
                            message:
                              description: |
                                Сообщение о ходе выполнения или об ошибке для данного шага.
                            name:
                              description: |
                                Человекочитаемое имя шага.
                            startedAt:
                              description: |
                                Время начала выполнения шага (переход из Pending в Active).
                            status:
                              description: |
                                Текущий статус шага. Может быть: Pending, Active, Completed.
                      toReplicaType:
                        description: |
                          Целевой тип реплики. Не используется в переходах подготовки снимка.
                      toSystemNetworkNames:
                        description: |
                          Целевой набор имён системных сетей. Не используется в переходах подготовки снимка.
                      type:
                        description: |
                          Тип перехода.
                readyToUse:
                  description: |
                    Признак того, что снимок полностью готов и может использоваться как источник данных для восстановления тома.
                sourceReplicaSnapshotName:
                  description: |
                    Имя ReplicatedVolumeReplicaSnapshot, созданного с подключённой (Primary) реплики. Содержит наиболее актуальные данные и используется как источник при синхронизации и при клонировании.
                syncCompletedReplicas:
                  description: |
                    Список имён ReplicatedVolumeReplica, для которых синхронизация в текущем раунде уже завершена. Используется контроллером, чтобы не запускать синхронизацию повторно для уже обработанной реплики.
                syncDRBDResources:
                  description: |
                    Список имён временных ресурсов DRBDResource, созданных для синхронизации снимка. Контроллер отслеживает по ним ход синхронизации и удаляет их после её завершения.
                syncRevision:
                  description: |
                    Ревизия фазы синхронизации снимка. Увеличивается при каждом новом раунде синхронизации.
                syncTransitions:
                  description: |
                    Список активных переходов (transitions) фазы синхронизации снимка. Каждый переход имеет упорядоченный список шагов, объявляемых при создании и выполняемых последовательно.

                    В ходе синхронизации поверх снимка отстающей реплики поднимается временный ресурс DRBDResource, данные подтягиваются с реплики-источника, после чего временный ресурс удаляется.
                  items:
                    properties:
                      fromReplicaType:
                        description: |
                          Исходный тип реплики. Не используется в переходах синхронизации снимка.
                      fromSystemNetworkNames:
                        description: |
                          Исходный набор имён системных сетей. Не используется в переходах синхронизации снимка.
                      group:
                        description: |
                          Группа параллелизма перехода. Задаётся контроллером при создании перехода и предназначена для наблюдаемости (объясняет, почему переход может ожидать).
                      planID:
                        description: |
                          Идентификатор плана перехода, используемого для создания данного перехода.
                      replicaName:
                        description: |
                          Имя реплики, к которой применяется переход.
                      replicaType:
                        description: |
                          Тип реплики, к которой применяется переход. Может быть: Diskful, Access, TieBreaker, ShadowDiskful.
                      steps:
                        description: |
                          Упорядоченный список шагов перехода. Шаги выполняются последовательно — активным одновременно может быть только один шаг.
                        items:
                          properties:
                            completedAt:
                              description: |
                                Время завершения шага (переход из Active в Completed).
                            datameshRevision:
                              description: |
                                Ревизия datamesh, назначенная при активации шага (0, если шаг ещё не активирован или не изменяет ревизию).
                            message:
                              description: |
                                Сообщение о ходе выполнения или об ошибке для данного шага.
                            name:
                              description: |
                                Человекочитаемое имя шага.
                            startedAt:
                              description: |
                                Время начала выполнения шага (переход из Pending в Active).
                            status:
                              description: |
                                Текущий статус шага. Может быть: Pending, Active, Completed.
                      toReplicaType:
                        description: |
                          Целевой тип реплики. Не используется в переходах синхронизации снимка.
                      toSystemNetworkNames:
                        description: |
                          Целевой набор имён системных сетей. Не используется в переходах синхронизации снимка.
                      type:
                        description: |
                          Тип перехода.

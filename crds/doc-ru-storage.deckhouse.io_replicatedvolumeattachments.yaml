spec:
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |
          ReplicatedVolumeAttachment описывает намерение и состояние подключения (attachment) ReplicatedVolume к конкретному узлу кластера.
        properties:
          spec:
            properties:
              nodeName:
                description: |
                  Имя узла, к которому должен быть подключён том.

                  > **Внимание.** Это поле является неизменяемым и не может быть изменено после первоначального создания ресурса.
              replicatedVolumeName:
                description: |
                  Имя ReplicatedVolume, который должен быть подключён к узлу.

                  > **Внимание.** Это поле является неизменяемым и не может быть изменено после первоначального создания ресурса.
          status:
            properties:
              conditions:
                description: |
                  Список условий, отражающих текущее состояние ресурса.
                items:
                  description: |
                    Сведения об одном аспекте текущего состояния ресурса.
                  properties:
                    lastTransitionTime:
                      description: |
                        Время последнего перехода условия из одного статуса в другой.

                        Должно соответствовать моменту изменения базового состояния. Если оно неизвестно, допустимо использовать время изменения поля API.
                    message:
                      description: |
                        Человекочитаемое сообщение с подробностями о переходе.

                        Может быть пустой строкой.
                    observedGeneration:
                      description: |
                        Значение `.metadata.generation`, на основе которого было установлено условие.

                        Например, если текущий `.metadata.generation` равен 12, а `.status.conditions[x].observedGeneration` равен 9, условие устарело относительно текущего состояния экземпляра.
                    reason:
                      description: |
                        Программный идентификатор причины последнего перехода условия.

                        Производители конкретных типов условий могут определять ожидаемые значения и их смысл. Значение должно быть в CamelCase. Поле не может быть пустым.
                    status:
                      description: |
                        Статус условия.
                    type:
                      description: |
                        Тип условия в CamelCase или в формате `foo.example.com/CamelCase`.
              devicePath:
                description: |
                  Путь к блочному устройству на узле.

                  Задаётся только когда устройство доступно на узле. Пример: /dev/drbd10012.
              inUse:
                description: |
                  Признак того, что блочное устройство в данный момент используется каким-либо процессом.

                  Задаётся только когда устройство доступно на узле.
              ioSuspended:
                description: |
                  Признак того, что ввод-вывод на устройстве приостановлен (suspend-io).

                  Задаётся только когда устройство доступно на узле.
              message:
                description: |
                  Человекочитаемое описание текущего состояния подключения.
              phase:
                description: |
                  Краткая сводка операционного состояния подключения.

                  Может быть:
                  - Pending — подключение ожидает обработки
                  - Attaching — выполняется подключение
                  - Attached — том подключён и устройство доступно на узле
                  - Detaching — выполняется отключение
                  - Terminating — ресурс подключения удаляется.

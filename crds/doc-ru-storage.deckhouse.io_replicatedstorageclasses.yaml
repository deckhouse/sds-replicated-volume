spec:
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |
          Интерфейс управления StorageСlass для CSI-драйвера replicated.csi.storage.deckhouse.io.

          Ручное создание StorageClass для данного драйвера запрещено.
        properties:
          spec:
            description: |
              Определяет конфигурацию Kubernetes StorageClass.
            properties:
              configurationRolloutStrategy:
                description: |
                  Стратегия применения изменений конфигурации к уже существующим томам.

                  Если не указана, контроллер подставляет значения по умолчанию (RollingUpdate, maxParallel=5).
                properties:
                  rollingUpdate:
                    description: |
                      Параметры стратегии RollingUpdate.

                      Обязательно, когда type равен RollingUpdate.
                    properties:
                      maxParallel:
                        description: |
                          Максимальное число томов, для которых одновременно выполняется rollout.
                  type:
                    description: |
                      Тип стратегии применения изменений конфигурации.
              eligibleNodesConflictResolutionStrategy:
                description: |
                  Стратегия обработки томов с конфликтом eligible nodes.

                  Если не указана, контроллер подставляет значения по умолчанию (RollingRepair, maxParallel=5).
                properties:
                  rollingRepair:
                    description: |
                      Параметры стратегии разрешения конфликтов RollingRepair.

                      Обязательно, когда type равен RollingRepair.
                    properties:
                      maxParallel:
                        description: |
                          Максимальное число томов, для которых одновременно выполняется repair.
                  type:
                    description: |
                      Тип стратегии разрешения конфликтов eligible nodes.
              eligibleNodesPolicy:
                description: |
                  Политики управления списком eligible nodes.

                  Если не указана, контроллер подставляет значения по умолчанию (notReadyGracePeriod=10m).
                properties:
                  notReadyGracePeriod:
                    description: |
                      Сколько ждать перед исключением not-ready узла из списка eligible nodes.
              failuresToTolerate:
                description: |
                  FailuresToTolerate (FTT) — сколько произвольных отказов узлов том может перенести, оставаясь доступным для IO.

                  Взаимоисключающе с Replication.
                  Должно задаваться вместе с GuaranteedMinimumDataRedundancy.
                  Допустимые комбинации: |FTT - GMDR| <= 1.
              guaranteedMinimumDataRedundancy:
                description: |
                  GuaranteedMinimumDataRedundancy (GMDR) — минимальное число дополнительных копий данных, поддерживаемых, пока том обслуживает IO.

                  GMDR=0 означает, что в деградированном режиме система может работать с одной копией данных (как RAID-1 после отказа одного диска).
                  GMDR=1 означает, что во время IO всегда поддерживаются как минимум 2 копии.
                  Взаимоисключающе с Replication.
                  Должно задаваться вместе с FailuresToTolerate.
                  Допустимые комбинации: |FTT - GMDR| <= 1.
              nodeLabelSelector:
                description: |
                  Селектор узлов, eligible для участия в DRBD.

                  Только узлы, соответствующие селектору, могут хранить данные, предоставлять доступ или размещать tiebreaker.
                  Если не указан, кандидатами считаются все узлы.
                properties:
                  matchExpressions:
                    description: |
                      Список требований label selector.

                      Требования объединяются через AND.
                    items:
                      description: |
                        Требование label selector: ключ, оператор и значения.
                      properties:
                        key:
                          description: |
                            Ключ лейбла, к которому применяется селектор.
                        operator:
                          description: |
                            Отношение ключа к набору значений.

                            Допустимые операторы: In, NotIn, Exists и DoesNotExist.
                        values:
                          description: |
                            Массив строковых значений.

                            Для операторов In и NotIn массив должен быть непустым.
                            Для Exists и DoesNotExist массив должен быть пустым.
                            При strategic merge patch массив заменяется целиком.
                  matchLabels:
                    description: |
                      Карта пар {key,value}.

                      Одна пара в matchLabels эквивалентна элементу matchExpressions с operator=In и единственным значением.
                      Требования объединяются через AND.
              storage:
                description: |
                  Конфигурация storage backend для данного StorageClass.

                  Задаёт тип томов и список LVMVolumeGroup, из которых выделяется место.
                properties:
                  lvmVolumeGroups:
                    description: |
                      Список ресурсов LVMVolumeGroup, Volume Group/Thin-pool которых используются для выделения места.

                      > **Внимание.** Каждый ресурс LVMVolumeGroup должен иметь тот же тип (Thin/Thick), что указан в поле Type.
                    items:
                      properties:
                        name:
                          description: |
                            Имя ресурса LVMVolumeGroup.
                        thinPoolName:
                          description: |
                            Имя выбранного Thin-pool.
                  type:
                    description: |
                      Тип томов.

                      Может быть:
                      - `LVM` — для Thick;
                      - `LVMThin` — для Thin.
              storagePool:
                description: |
                  Имя Storage Pool в бэкенде LINSTOR.
              reclaimPolicy:
                description: |
                  Reclaim policy дочернего StorageClass.

                  Может быть:
                  - `Delete` — если PersistentVolumeClaim будет удален, вместе с ним удалится соответствующий PersistentVolume;
                  - `Retain` — если PersistentVolumeClaim будет удален, соответствующий PersistentVolume останется нетронутым в статусе Released.

                  > **Внимание.** Поле изменяемое: при смене политики модуль пересоздаёт дочерний StorageClass с новым значением.
              replication:
                description: |
                  Режим репликации StorageClass.

                  Может быть:
                  - `None` — в этом режиме репликация отключена, и данные существуют только в одном экземпляре;
                  - `Availability` — режим репликации, при котором том остается доступным для чтения и записи, даже если одна из реплик тома становится недоступной. Данные хранятся в двух экземплярах на разных узлах. **Внимание.** Этот режим не гарантирует консистентность данных и может привести к split brain и потере данных при проблемах с сетевой связностью между узлами. Рекомендуется использовать только для некритичных данных и приложений, не требующих высокой надежности и целостности данных;
                  - `ConsistencyAndAvailability` — режим репликации, при котором том остается доступным для чтения и записи, даже если одна из реплик тома становится недоступной. Данные хранятся в трех экземплярах на разных узлах. Этот режим обеспечивает защиту от потери данных при выходе из строя двух узлов, содержащих реплики тома, и гарантирует консистентность данных. Однако при потере двух реплик том переходит в режим "приостановки" ввода/вывода (suspend-io).

                  > **Внимание.**
                  > - Режимом репликации по умолчанию является `ConsistencyAndAvailability`.
                  > - Поле можно изменять у существующего ресурса — так выполняется миграция томов между layout'ами (например r3→r2 сменой `ConsistencyAndAvailability` на `Availability`). Изменение применяется сразу ко всем томам класса; обратной автоматической миграции (в сторону большего числа реплик) нет.
              systemNetworkNames:
                description: |
                  Имена сетей, используемые для трафика репликации DRBD.

                  Необходимо указать хотя бы одно имя сети. Длина каждого имени — не более 64 символов.
              volumeAccess:
                description: |
                  Режим доступа к данным.

                  Может быть:
                  - `Local` — в этом режиме запрещено создание пода на узлах, на которых отсутствует локальная реплика тома, используемого этим подом;
                  - `EventuallyLocal` — в этом режиме том будет создан сразу после появления пода и назначения ему рабочего узла. При первоначальном создании пода учитываются настройки его топологии, и локальная реплика, по возможности, будет создана на том же узле, где размещен под. Однако может возникнуть ситуация, когда под создаётся на узле, на котором отсутствует локальная реплика тома. В таком случае под будет подключен по сети к существующим репликам тома, после чего, через 30 минут, на этом узле начнется создание локальной реплики тома, включающее копирование всех данных тома по сети с других реплик на этот узел;
                  - `PreferablyLocal` — то же, что и в EventuallyLocal, за исключением того, что под будет постоянно подключен по сети к репликам тома, если он был создан на узле, где отсутствует локальная реплика тома (локальная реплика на этом узле создаваться не будет);
                  - `Any` — в этом режиме том будет создан до появления пода и может быть размещен на любом доступном узле без учета настроек топологии у пода, который будет использовать его в будущем. В случае, если под создан на узле, где отсутствует локальная реплика тома, под будет постоянно подключен по сети к репликам тома.

                  > **Внимание.**
                  > - При использовании настроек EventuallyLocal, PreferablyLocal и Any доступ к данным по сети разрешен только в пределах одной зоны. Запрещено создание пода в зоне, где отсутствует реплика тома.
                  > - Это поле является неизменяемым и не может быть изменено после первоначального создания ресурса.
              topology:
                description: |
                  Настройки топологии для томов в создаваемом StorageClass.

                  Может быть:
                  - `TransZonal` — реплики для томов будут создаваться в разных зонах (по одной реплике на зону).
                  Для использования этой топологии доступные зоны должны быть указаны в параметре zones, а на узлах кластера должен присутствовать лейбл topology.kubernetes.io/zone=<название зоны>.
                  - `Zonal` — все реплики томов создаются в той же зоне, которую планировщик выбрал для размещения пода, использующего данный том. Рекомендуется использовать эту топологию в условиях высокого пинга и/или низкой пропускной способности сети между зонами;
                  - `Ignored` — для размещения реплик томов не будет использоваться информация о топологии. Реплики могут размещаться на любых доступных узлах, но с ограничением: не более одной реплики определенного тома на один узел.

                  > **Внимание.**
                  > - Создать StorageClass с топологией `Ignored` можно только если в кластере нет зон (нет узлов с лейблами `topology.kubernetes.io/zone`).
                  > - Для корректной работы системы лейблом `topology.kubernetes.io/zone` должны быть помечены либо все узлы кластера, либо ни один из них.
                  > - Это поле является неизменяемым и не может быть изменено после первоначального создания ресурса.
              zones:
                description: |
                  Список зон, в которых будут созданы реплики тома.

                  Контроллер повесит лейбл с именем StorageClass на те узлы, на которых будет возможно создать реплики томов.

                  > **Внимание.**
                  > - Для режимов репликации `Availability` и `ConsistencyAndAvailability` вам необходимо указать 3 зоны, если выбрана топология TransZonal.
                  > - Данный параметр является обязательным, если выбрана топология TransZonal.
                  > - Это поле является неизменяемым и не может быть изменено после первоначального создания ресурса.
          status:
            description: |
              Текущая информация о StorageClass.
            properties:
              configuration:
                description: |
                  Разрешённая конфигурация, с которой должны совпадать тома.
                properties:
                  failuresToTolerate:
                    description: |
                      Разрешённое значение FTT.
                  guaranteedMinimumDataRedundancy:
                    description: |
                      Разрешённое значение GMDR.
                  replicatedStoragePoolName:
                    description: |
                      Имя ресурса ReplicatedStoragePool.
                  topology:
                    description: |
                      Разрешённая настройка топологии.
                  volumeAccess:
                    description: |
                      Разрешённый режим доступа к тому.
              configurationGeneration:
                description: |
                  Generation RSC на момент принятия конфигурации.
              message:
                description: |
                  Человекочитаемое описание текущего phase.
              phase:
                description: |
                  Операционное состояние StorageClass.

                  Может быть:
                  - `Ready` — конфигурация принята, тома соответствуют требованиям;
                  - `WaitingForStoragePool` — ожидание готовности ReplicatedStoragePool;
                  - `InsufficientNodes` — недостаточно подходящих узлов;
                  - `InvalidConfiguration` — некорректная конфигурация ресурса;
                  - `RollingOut` — выполняется применение изменений конфигурации к томам;
                  - `PartiallyAligned` — часть томов ещё не соответствует конфигурации;
                  - `Terminating` — ресурс удаляется.
              storagePoolBasedOnGeneration:
                description: |
                  Generation RSC на момент вычисления storagePoolName.
              storagePoolEligibleNodesRevision:
                description: |
                  Отслеживает eligibleNodesRevision RSP для обнаружения изменений.
              storagePoolName:
                description: |
                  Вычисленное имя ReplicatedStoragePool для данного RSC.

                  Формат: auto-rsp-<fnv128-hex>. Несколько RSC с одинаковыми параметрами storage разделяют один и тот же StoragePoolName.
              volumes:
                description: |
                  Агрегированная статистика по томам.

                  Всегда присутствует (total может быть равен 0).
                properties:
                  aligned:
                    description: |
                      Число томов, конфигурация которых совпадает со StorageClass.
                  inConflictWithEligibleNodes:
                    description: |
                      Число томов с репликами на не-eligible узлах.
                  pendingObservation:
                    description: |
                      Число томов, которые ещё не увидели текущую конфигурацию RSC или eligible nodes.
                  staleConfiguration:
                    description: |
                      Число томов с устаревшей конфигурацией.
                  total:
                    description: |
                      Общее число томов.
                  usedStoragePoolNames:
                    description: |
                      Отсортированный список имён storage pool, которые сейчас используют тома.
              conditions:
                description: |
                  Список условий, отражающих текущее состояние ресурса.
                items:
                  description: |
                    Сведения об одном аспекте текущего состояния ресурса.
                  properties:
                    lastTransitionTime:
                      description: |
                        Время последнего перехода условия из одного статуса в другой.

                        Должно соответствовать моменту изменения базового состояния. Если оно неизвестно, допустимо использовать время изменения поля API.
                    message:
                      description: |
                        Человекочитаемое сообщение с подробностями о переходе.

                        Может быть пустой строкой.
                    observedGeneration:
                      description: |
                        Значение `.metadata.generation`, на основе которого было установлено условие.

                        Например, если текущий `.metadata.generation` равен 12, а `.status.conditions[x].observedGeneration` равен 9, условие устарело относительно текущего состояния экземпляра.
                    reason:
                      description: |
                        Программный идентификатор причины последнего перехода условия.

                        Производители конкретных типов условий могут определять ожидаемые значения и их смысл. Значение должно быть в CamelCase. Поле не может быть пустым.
                    status:
                      description: |
                        Статус условия.
                    type:
                      description: |
                        Тип условия в CamelCase или в формате `foo.example.com/CamelCase`.

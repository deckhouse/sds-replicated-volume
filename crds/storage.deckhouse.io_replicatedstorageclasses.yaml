---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  labels:
    backup.deckhouse.io/cluster-config: "true"
    heritage: deckhouse
    module: sds-replicated-volume
  name: replicatedstorageclasses.storage.deckhouse.io
spec:
  group: storage.deckhouse.io
  names:
    kind: ReplicatedStorageClass
    listKind: ReplicatedStorageClassList
    plural: replicatedstorageclasses
    shortNames:
    - rsc
    singular: replicatedstorageclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.configuration.failuresToTolerate
      name: FTT
      type: integer
    - jsonPath: .status.configuration.guaranteedMinimumDataRedundancy
      name: GMDR
      type: integer
    - jsonPath: .status.volumes.total
      name: Volumes
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .spec.topology
      name: Topology
      priority: 1
      type: string
    - jsonPath: .spec.volumeAccess
      name: VolumeAccess
      priority: 1
      type: string
    - jsonPath: .status.storagePoolName
      name: StoragePool
      priority: 1
      type: string
    - jsonPath: .status.message
      name: Message
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ReplicatedStorageClass is the interface for managing StorageClasses of the replicated.csi.storage.deckhouse.io
          CSI driver. Creating a StorageClass for this driver manually is prohibited.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              Defines a Kubernetes Storage class configuration.

              > In the LINSTOR control-plane the spec cannot be changed after creation: changes to
              > most fields are rejected, and a change to replication switches the resource to the
              > InvalidConfiguration phase and leaves its StorageClass unchanged.
              > In the new control-plane topology and volumeAccess are
              > immutable; systemNetworkNames is temporarily immutable once set until migration is supported.
              > The other fields can be changed on an existing resource: a change to
              > storage, zones, nodeLabelSelector or eligibleNodesPolicy moves the StorageClass's
              > volumes to a new storage pool, and a change to reclaimPolicy recreates the StorageClass
              > with the new policy.
            properties:
              configurationRolloutStrategy:
                description: |-
                  Only meaningful with the new control-plane.

                  ConfigurationRolloutStrategy defines how configuration changes are applied to existing volumes.
                  When not specified, the controller fills the default (RollingUpdate, maxParallel=5).
                properties:
                  rollingUpdate:
                    description: |-
                      RollingUpdate configures parameters for RollingUpdate strategy.
                      Required when type is RollingUpdate.
                    properties:
                      maxParallel:
                        default: 5
                        description: MaxParallel is the maximum number of volumes
                          being rolled out simultaneously.
                        format: int32
                        maximum: 200
                        minimum: 1
                        type: integer
                    required:
                    - maxParallel
                    type: object
                  type:
                    description: Type specifies the rollout strategy type.
                    enum:
                    - RollingUpdate
                    - NewVolumesOnly
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: rollingUpdate is required when type is RollingUpdate
                  rule: self.type != 'RollingUpdate' || has(self.rollingUpdate)
                - message: rollingUpdate must not be set when type is not RollingUpdate
                  rule: self.type == 'RollingUpdate' || !has(self.rollingUpdate)
              eligibleNodesConflictResolutionStrategy:
                description: |-
                  Only meaningful with the new control-plane.

                  EligibleNodesConflictResolutionStrategy defines how the controller handles volumes with eligible nodes conflicts.
                  When not specified, the controller fills the default (RollingRepair, maxParallel=5).
                properties:
                  rollingRepair:
                    description: |-
                      RollingRepair configures parameters for RollingRepair conflict resolution strategy.
                      Required when type is RollingRepair.
                    properties:
                      maxParallel:
                        default: 5
                        description: MaxParallel is the maximum number of volumes
                          being repaired simultaneously.
                        format: int32
                        maximum: 200
                        minimum: 1
                        type: integer
                    required:
                    - maxParallel
                    type: object
                  type:
                    description: Type specifies the conflict resolution strategy type.
                    enum:
                    - Manual
                    - RollingRepair
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: rollingRepair is required when type is RollingRepair
                  rule: self.type != 'RollingRepair' || has(self.rollingRepair)
                - message: rollingRepair must not be set when type is not RollingRepair
                  rule: self.type == 'RollingRepair' || !has(self.rollingRepair)
              eligibleNodesPolicy:
                description: |-
                  Only meaningful with the new control-plane.

                  EligibleNodesPolicy defines policies for managing eligible nodes.
                  When not specified, the controller fills the default (notReadyGracePeriod=10m).

                  > The policy is applied through the auto-generated storage pool and is part of its
                  > identity: classes share a pool only if their storage, zones, nodeLabelSelector,
                  > systemNetworkNames and eligibleNodesPolicy match. A change moves the StorageClass's
                  > volumes to a new storage pool.
                properties:
                  notReadyGracePeriod:
                    default: 10m
                    description: |-
                      NotReadyGracePeriod specifies how long to wait before removing
                      a not-ready node from the eligible nodes list.
                    type: string
                required:
                - notReadyGracePeriod
                type: object
              failuresToTolerate:
                description: |-
                  Only meaningful with the new control-plane.

                  FailuresToTolerate (FTT) specifies how many arbitrary node failures the volume
                  can tolerate while remaining available for IO.
                  Mutually exclusive with Replication.
                  Must be specified together with GuaranteedMinimumDataRedundancy.
                  Valid range: 0-1: the datamesh has layouts above FTT=1/GMDR=1 (4D, 4D+1TB, 5D),
                  but they are not tested in DRBD, so admission is limited to the layouts the
                  LINSTOR control-plane shipped (None, Availability, ConsistencyAndAvailability)
                  plus Consistency. Valid combinations: |FTT - GMDR| <= 1.
                maximum: 1
                minimum: 0
                type: integer
              guaranteedMinimumDataRedundancy:
                description: |-
                  Only meaningful with the new control-plane.

                  GuaranteedMinimumDataRedundancy (GMDR) specifies the minimum number of additional
                  data copies maintained while the volume is serving IO. GMDR=0 means the system may
                  operate with a single data copy in degraded mode (like a RAID-1 mirror after one
                  disk failure). GMDR=1 means at least 2 copies are always maintained during IO.
                  Mutually exclusive with Replication.
                  Must be specified together with FailuresToTolerate.
                  Valid range: 0-1: layouts above FTT=1/GMDR=1 are not tested in DRBD and are not
                  admitted (see failuresToTolerate).
                  Valid combinations: |FTT - GMDR| <= 1.
                maximum: 1
                minimum: 0
                type: integer
              nodeLabelSelector:
                description: |-
                  Only meaningful with the new control-plane.

                  NodeLabelSelector filters nodes eligible for DRBD participation.
                  Only nodes matching this selector can store data, provide access, or host tiebreaker.
                  If not specified, all nodes are candidates.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              reclaimPolicy:
                description: |-
                  The reclaim policy of the StorageClass. Might be:
                  - Delete (if the PersistentVolumeClaim is deleted, the PersistentVolume is deleted with it)
                  - Retain (if the PersistentVolumeClaim is deleted, the PersistentVolume stays intact in the Released phase)

                  > In the LINSTOR control-plane the field is immutable after creation. In the new
                  > control-plane the StorageClass is recreated with the new policy.
                enum:
                - Delete
                - Retain
                type: string
              replication:
                description: |-
                  Deprecated: in the new control-plane, use failuresToTolerate and
                  guaranteedMinimumDataRedundancy instead; the field is mutually exclusive with them.

                  The Storage class's replication mode. Might be:
                  - None — replication is disabled; the data exists in a single copy.
                  - Availability — the volume stays readable and writable even if one of its replicas becomes unavailable. The data is stored in two copies on different nodes. **Important:** this mode does not guarantee data consistency and may lead to split brain and data loss if the network connectivity between nodes is disrupted. Recommended only for non-critical data and applications that do not require high reliability and data integrity.
                  - Consistency — 2 replicas with consistency guarantees; requires both replicas for IO. Supported only in the new control-plane.
                  - ConsistencyAndAvailability — the volume stays readable and writable even if one of its replicas becomes unavailable. The data is stored in three copies on different nodes. This mode protects against data loss when two nodes holding volume replicas fail and guarantees data consistency. However, if two replicas are lost, the volume switches to suspend-io mode.

                  Mapping to failuresToTolerate/guaranteedMinimumDataRedundancy (in the new control-plane):
                    None                       → failuresToTolerate=0, guaranteedMinimumDataRedundancy=0
                    Availability               → failuresToTolerate=1, guaranteedMinimumDataRedundancy=0
                    Consistency                → failuresToTolerate=0, guaranteedMinimumDataRedundancy=1
                    ConsistencyAndAvailability → failuresToTolerate=1, guaranteedMinimumDataRedundancy=1

                  > Both in the new control-plane and in the LINSTOR control-plane an unset value is treated
                  > as 'ConsistencyAndAvailability'; setting the field explicitly is recommended.
                enum:
                - None
                - Availability
                - Consistency
                - ConsistencyAndAvailability
                type: string
              storage:
                description: |-
                  Only meaningful with the new control-plane.

                  Storage defines the storage backend configuration for this storage class.
                  Specifies the type of volumes (LVM or LVMThin) and which LVMVolumeGroups
                  will be used to allocate space for volumes.
                properties:
                  lvmVolumeGroups:
                    description: |-
                      LVMVolumeGroups is an array of LVMVolumeGroup resource names whose Volume Groups/Thin-pools
                      will be used to allocate the required space.

                      > Note that every LVMVolumeGroup resource must have the same type (Thin/Thick)
                      as specified in the Type field.
                    items:
                      properties:
                        name:
                          description: Selected LVMVolumeGroup resource's name.
                          minLength: 1
                          pattern: ^[a-z0-9]([a-z0-9-.]{0,251}[a-z0-9])?$
                          type: string
                        thinPoolName:
                          description: |-
                            The name of the selected Thin-pool within the LVMVolumeGroup. Required if the
                            ReplicatedStoragePool type is LVMThin.
                          maxLength: 128
                          minLength: 1
                          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_.+-]*$
                          type: string
                      required:
                      - name
                      type: object
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  type:
                    description: |-
                      Type defines the volumes type. Might be:
                      - LVM (for Thick)
                      - LVMThin (for Thin)
                    enum:
                    - LVM
                    - LVMThin
                    type: string
                required:
                - lvmVolumeGroups
                - type
                type: object
                x-kubernetes-validations:
                - message: thinPoolName is required for each lvmVolumeGroups entry
                    when type is LVMThin
                  rule: self.type != 'LVMThin' || self.lvmVolumeGroups.all(g, has(g.thinPoolName)
                    && size(g.thinPoolName) > 0)
                - message: thinPoolName must not be specified when type is LVM
                  rule: self.type != 'LVM' || self.lvmVolumeGroups.all(g, !has(g.thinPoolName)
                    || size(g.thinPoolName) == 0)
              storagePool:
                description: |-
                  Deprecated: in the new control-plane, use storage instead.

                  The name of the ReplicatedStoragePool resource, which is the Storage Pool in the LINSTOR
                  backend the volumes are created in. Required in the LINSTOR control-plane.

                  > The field cannot be added or changed after creation; removing it is possible only in
                  > the new control-plane.
                type: string
                x-kubernetes-validations:
                - message: StoragePool cannot be added or changed, only removed
                  rule: size(self) == 0 || self == oldSelf
              systemNetworkNames:
                description: |-
                  Only meaningful with the new control-plane.

                  SystemNetworkNames specifies network names used for DRBD replication traffic.
                  Specify exactly one network: Internal (the node network) or a SystemNetwork name
                  in DNS-1123 subdomain format, limited to 253 characters.
                  When omitted, the controller fills Internal. Once set, the field is temporarily
                  immutable until network migration is supported.
                items:
                  maxLength: 253
                  type: string
                maxItems: 1
                minItems: 1
                type: array
                x-kubernetes-list-type: set
                x-kubernetes-validations:
                - message: Network must be Internal or a DNS-1123 subdomain of at
                    most 253 characters
                  rule: self.all(n, n == 'Internal' || (size(n) <= 253 && n.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$')))
              topology:
                description: |-
                  The topology settings for the volumes in the created Storage class. Might be:
                  - TransZonal — replicas of the volumes will be created in different zones (one replica per zone).
                    To use this topology, the available zones must be specified in the 'zones' param, and the cluster nodes must have the topology.kubernetes.io/zone=<zone name> label.
                  - Zonal — all replicas of the volumes are created in the same zone that the scheduler selected to place the pod using this volume.
                    Recommended when the latency between zones is high and/or the bandwidth is low.
                  - Ignored — the topology information will not be used to place replicas of the volumes.
                    The replicas can be placed on any available nodes, with the restriction: no more than one replica of a given volume on one node.
                    Required when replication is 'None'.

                  > Note that the 'Ignored' value can be used only if there are no zones in the cluster (there are no nodes with the topology.kubernetes.io/zone label).
                  > In the LINSTOR control-plane 'Zonal' and 'TransZonal' can be used only if there are zones in the cluster.

                  > For the system to operate correctly, either every cluster node must be labeled with 'topology.kubernetes.io/zone', or none of them should have this label.

                  > The field is immutable after creation.
                enum:
                - TransZonal
                - Zonal
                - Ignored
                type: string
              volumeAccess:
                default: PreferablyLocal
                description: |-
                  The volume access mode. Might be:
                  - Local — pods cannot be created on nodes that have no local replica of the volume used by the pod.
                  - EventuallyLocal — the volume is created right after the pod appears and is assigned a node. The pod's topology settings are taken into account on initial creation, and a local replica is created on the pod's node where possible. If the pod is created on a node without a local replica, it is attached to the existing replicas over the network, and after 30 minutes a local replica starts being created on that node, which copies all volume data over the network from the other replicas.
                  - PreferablyLocal — the same as EventuallyLocal, except that a pod created on a node without a local replica stays attached to the replicas over the network permanently (no local replica is created on that node).
                  - Any — the volume is created before the pod appears and can be placed on any available node regardless of the topology settings of the pod that will use it. A pod created on a node without a local replica stays attached to the replicas over the network permanently.

                  > Note that the default Volume Access mode is 'PreferablyLocal'.

                  > With EventuallyLocal, PreferablyLocal and Any, access to the data over the network is allowed only within one zone: a pod cannot be created in a zone that has no replica of the volume.

                  > The field is immutable after creation.
                enum:
                - Local
                - EventuallyLocal
                - PreferablyLocal
                - Any
                type: string
              volumeCleanup:
                description: |-
                  Only meaningful with the new control-plane.

                  The method of wiping the data of a volume's backing logical volumes before they are
                  removed: when the volume is deleted, and also when a replica of the volume gives up its
                  disk (it is moved to another node or storage, becomes diskless or is removed). If the field
                  is not set, the data is not wiped, and there is no guarantee that it is completely deleted.
                  Might be:
                  - RandomFillSinglePass — the logical volume is overwritten with random data once before it is removed. Not recommended for solid-state drives, as overwriting reduces the drive's lifespan. For thin volumes, only the space in use at the moment of removal is overwritten.
                  - RandomFillThreePass — the logical volume is overwritten with random data three times before it is removed. Not recommended for solid-state drives, as overwriting reduces the drive's lifespan. For thin volumes, only the space in use at the moment of removal is overwritten.
                  - Discard — before removal, all blocks of the logical volume are marked as free with the `discard` system call. Applicable only to solid-state drives and thick volumes (storage.type LVM).

                  > The method is fixed for a volume when the volume is created: it is recorded in the
                  > ReplicatedVolume's spec.volumeCleanup and applies to every replica of the volume, including
                  > replicas created later. Changing the field affects only volumes created after the change.

                  > The wipe is done by sds-node-configurator and is available only in the Enterprise Edition
                  > and in the Certified Security Edition Pro; in other editions a non-empty value is rejected.

                  > Overwriting takes time proportional to the size of the volume, so a deleted volume (and
                  > its PersistentVolume) is gone only after the backing volumes of all its replicas are wiped.
                enum:
                - RandomFillThreePass
                - RandomFillSinglePass
                - Discard
                type: string
              zones:
                description: |-
                  The list of zones the StorageClass's volumes are replicated in. The controller puts a label
                  with the StorageClass's name on the nodes where replicas of the volumes can be created.

                  > Required with the TransZonal topology; the number of zones must be exactly
                  > one of the values below, depending on the redundancy settings:
                  > - failuresToTolerate=0, guaranteedMinimumDataRedundancy=1 (replication 'Consistency'): exactly 2 zones
                  > - failuresToTolerate=1, guaranteedMinimumDataRedundancy=0 (replication 'Availability'): exactly 3 zones
                  > - failuresToTolerate=1, guaranteedMinimumDataRedundancy=1 (replication 'ConsistencyAndAvailability', the default): exactly 3 zones
                  > In the LINSTOR control-plane the field can be set only with the TransZonal topology;
                  > with 'Availability' and 'ConsistencyAndAvailability' replication exactly 3 zones must
                  > be specified. The 'Consistency' replication is not supported there.
                  > In the new control-plane, with 'None' replication the zones limit where the single
                  > replica can be placed.
                  > In the LINSTOR control-plane the field is immutable after creation; in the new
                  > control-plane it can be changed.
                items:
                  maxLength: 63
                  type: string
                maxItems: 10
                type: array
                x-kubernetes-list-type: set
            required:
            - reclaimPolicy
            - topology
            type: object
            x-kubernetes-validations:
            - message: Replication None requires topology Ignored (no replicas to
                distribute).
              rule: '!has(self.replication) || self.replication != ''None'' || self.topology
                == ''Ignored'''
            - message: Cannot specify both replication and failuresToTolerate/guaranteedMinimumDataRedundancy.
              rule: '!(has(self.failuresToTolerate) || has(self.guaranteedMinimumDataRedundancy))
                || !has(self.replication)'
            - message: failuresToTolerate and guaranteedMinimumDataRedundancy must
                be specified together.
              rule: has(self.failuresToTolerate) == has(self.guaranteedMinimumDataRedundancy)
            - message: 'Invalid failuresToTolerate/guaranteedMinimumDataRedundancy
                combination: |FTT - GMDR| must be <= 1.'
              rule: '!has(self.failuresToTolerate) || (self.failuresToTolerate - self.guaranteedMinimumDataRedundancy
                <= 1 && self.guaranteedMinimumDataRedundancy - self.failuresToTolerate
                <= 1)'
            - message: failuresToTolerate=0 with guaranteedMinimumDataRedundancy=0
                requires topology Ignored.
              rule: '!(has(self.failuresToTolerate) && self.failuresToTolerate ==
                0 && self.guaranteedMinimumDataRedundancy == 0) || self.topology ==
                ''Ignored'''
            - message: TransZonal topology with Availability replication requires
                at least 3 zones (if specified).
              rule: has(self.storage) || self.topology != 'TransZonal' || !has(self.replication)
                || self.replication != 'Availability' || !has(self.zones) || size(self.zones)
                == 0 || size(self.zones) >= 3
            - message: TransZonal topology with ConsistencyAndAvailability replication
                (default) requires at least 3 zones (if specified).
              rule: has(self.storage) || self.topology != 'TransZonal' || (has(self.replication)
                && self.replication != 'ConsistencyAndAvailability') || !has(self.zones)
                || size(self.zones) == 0 || size(self.zones) >= 3
            - message: Replication Consistency is not supported by the legacy control
                plane (spec.storagePool); it requires the new control plane (spec.storage).
              rule: has(self.storage) || !has(self.replication) || self.replication
                != 'Consistency'
            - message: spec.volumeCleanup is not supported by the legacy control plane
                (spec.storagePool); it requires the new control plane (spec.storage).
              rule: has(self.storage) || !has(self.volumeCleanup)
            - message: volumeCleanup Discard is supported only for thick volumes (storage.type
                LVM).
              rule: '!has(self.storage) || !has(self.volumeCleanup) || self.volumeCleanup
                != ''Discard'' || self.storage.type == ''LVM'''
            - message: TransZonal topology requires zones to be specified.
              rule: '!has(self.storage) || self.topology != ''TransZonal'' || (has(self.zones)
                && size(self.zones) > 0)'
            - message: TransZonal topology with Consistency replication requires exactly
                2 zones.
              rule: '!has(self.storage) || self.topology != ''TransZonal'' || !has(self.replication)
                || self.replication != ''Consistency'' || !has(self.zones) || size(self.zones)
                == 0 || size(self.zones) == 2'
            - message: TransZonal topology with Availability replication requires
                exactly 3 zones.
              rule: '!has(self.storage) || self.topology != ''TransZonal'' || !has(self.replication)
                || self.replication != ''Availability'' || !has(self.zones) || size(self.zones)
                == 0 || size(self.zones) == 3'
            - message: TransZonal topology with ConsistencyAndAvailability replication
                (default) requires exactly 3 zones.
              rule: '!has(self.storage) || self.topology != ''TransZonal'' || has(self.failuresToTolerate)
                || (has(self.replication) && self.replication != ''ConsistencyAndAvailability'')
                || !has(self.zones) || size(self.zones) == 0 || size(self.zones) ==
                3'
            - message: TransZonal with FTT=0, GMDR=1 requires exactly 2 zones.
              rule: '!has(self.storage) || self.topology != ''TransZonal'' || !has(self.failuresToTolerate)
                || !has(self.zones) || size(self.zones) == 0 || self.failuresToTolerate
                != 0 || self.guaranteedMinimumDataRedundancy != 1 || size(self.zones)
                == 2'
            - message: TransZonal with FTT=1, GMDR=0 requires exactly 3 zones.
              rule: '!has(self.storage) || self.topology != ''TransZonal'' || !has(self.failuresToTolerate)
                || !has(self.zones) || size(self.zones) == 0 || self.failuresToTolerate
                != 1 || self.guaranteedMinimumDataRedundancy != 0 || size(self.zones)
                == 3'
            - message: TransZonal with FTT=1, GMDR=1 requires exactly 3 zones.
              rule: '!has(self.storage) || self.topology != ''TransZonal'' || !has(self.failuresToTolerate)
                || !has(self.zones) || size(self.zones) == 0 || self.failuresToTolerate
                != 1 || self.guaranteedMinimumDataRedundancy != 1 || size(self.zones)
                == 3'
            - message: spec.systemNetworkNames is immutable once set
              rule: '!has(oldSelf.systemNetworkNames) || (has(self.systemNetworkNames)
                && self.systemNetworkNames == oldSelf.systemNetworkNames)'
            - message: spec.topology is immutable
              rule: self.topology == oldSelf.topology
            - message: spec.volumeAccess is immutable
              rule: has(self.volumeAccess) == has(oldSelf.volumeAccess) && (!has(self.volumeAccess)
                || self.volumeAccess == oldSelf.volumeAccess)
            - message: spec.zones is immutable for the legacy control plane
              rule: (has(oldSelf.storage) && has(self.storage)) || (has(self.zones)
                == has(oldSelf.zones) && (!has(self.zones) || self.zones == oldSelf.zones))
            - message: spec.reclaimPolicy is immutable for the legacy control plane
              rule: (has(oldSelf.storage) && has(self.storage)) || self.reclaimPolicy
                == oldSelf.reclaimPolicy
          status:
            description: Displays current information about the Storage Class.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768

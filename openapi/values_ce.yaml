x-extend:
  schema: config-values.yaml
type: object
properties:
  internal:
    type: object
    default: {}
    x-required-for-helm:
    - httpsClientCert
    - httpsControllerCert
    - sslControllerCert
    - sslNodeCert
    - drbdVersion
    - drbdLegacyVersion
    - dataNodesChecksum
    - controlPlaneMigration
    - newControlPlane
    properties:
      drbdVersion:
        type: string
        default: "9.2.19-flant.21"
      drbdLegacyVersion:
        type: string
        default: "9.2.16"
      dataNodesChecksum:
        type: string
        default: "default_data_nodes_checksum"
      controlPlaneMigration:
        type: string
        default: "not_started"
      csiControllerMetricsPort:
        type: integer
        default: 8080
        description: |
          The port the CSI controller serves its operation metrics on, bound on
          127.0.0.1: the kube-rbac-proxy of the same pod is the only thing that reaches
          it. What is on it is sds_replicated_volume_csi_operations_total and
          sds_replicated_volume_csi_operation_duration_seconds -- how many CSI calls the
          driver answered, with which gRPC status, and how long each took.

      csiNodeMetricsPort:
        type: integer
        default: 4268
        description: |
          The port the CSI node serves its operation metrics on. The DaemonSet is
          hostNetwork, so this is a node-level port and is registered in the Deckhouse
          port reference; it must not be changed to an unregistered number.

          The driver binds it on 127.0.0.1 and the kube-rbac-proxy of the same pod
          publishes the same number on the node address -- two different sockets. What is
          on it is sds_replicated_volume_csi_operations_total and
          sds_replicated_volume_csi_operation_duration_seconds for the node calls:
          NodeStageVolume, NodePublishVolume and their unstage/unpublish counterparts.
      csiControllerMetricsProxyPort:
        type: integer
        default: 8080
        description: |
          The port the kube-rbac-proxy publishes the CSI controller metrics on. Reaching
          it requires "get" on deployments/prometheus-metrics for csi-controller.
      controllerMetricsPort:
        type: integer
        default: 8082
        description: |
          The port the controller serves its metrics on, bound on 127.0.0.1: the only
          thing that reaches it is the kube-rbac-proxy of the same pod.
      controllerMetricsProxyPort:
        type: integer
        default: 8080
        description: |
          The port the kube-rbac-proxy publishes the controller metrics on. Reaching
          it requires "get" on deployments/prometheus-metrics for the controller.
      oldControllerMetricsProxyPort:
        type: integer
        default: 8080
        description: |
          The port the kube-rbac-proxy publishes the legacy controller metrics on.
          Reaching it requires "get" on deployments/prometheus-metrics for the
          controller; the controller itself keeps its metrics on 127.0.0.1.
      oldControllerMetricsPort:
        type: integer
        default: 8080
        description: |
          The port the legacy control-plane controller serves its metrics on: the
          manager's reconcile and workqueue series. controller-runtime has always
          bound this port; until now nothing declared it or scraped it.
      newControlPlane:
        type: boolean
        default: false
        description: |
          Internal value determining whether to use the new control plane.
      masterPassphrase:
        type: string
      csiMigrationHook:
        type: object
        default: {}
        properties:
          completed:
            type: boolean
            default: false
          affectedPVsHash:
            type: string
            default: ""
            description: |
              Hash of affected PVs. Used to determine if bashible migration step should be forced to run.
      httpsClientCert:
        type: object
        default: {}
        x-required-for-helm:
        - crt
        - key
        - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      httpsControllerCert:
        type: object
        default: {}
        x-required-for-helm:
        - crt
        - key
        - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      sslControllerCert:
        type: object
        default: {}
        x-required-for-helm:
        - crt
        - key
        - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      sslNodeCert:
        type: object
        default: {}
        x-required-for-helm:
        - crt
        - key
        - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      spaasCert:
        type: object
        default: {}
        x-required-for-helm:
        - crt
        - key
        - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      linstorCA:
        type: object
        default: {}
        description: |
          CA signing the LINSTOR certificates. Kept in the linstor-ca secret, which lets those
          certificates be renewed without re-issuing all of them at once.
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      webhooksCA:
        type: object
        default: {}
        description: |
          CA signing the webhook certificates. Kept in the webhooks-ca secret.
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      spaasCA:
        type: object
        default: {}
        description: |
          CA signing the SPAAS certificate. Kept in the spaas-ca secret.
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      schedulerExtenderCA:
        type: object
        default: {}
        description: |
          CA signing the scheduler extender certificate. Kept in the
          linstor-scheduler-extender-ca secret.
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      customWebhookCert:
        type: object
        default: {}
        x-required-for-helm:
        - crt
        - key
        - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      storageClassLabelIgnoredPrefixesSystem:
        type: array
        description: |
          System list of label-key prefixes that MUST NOT be propagated from
          a ReplicatedStorageClass to the managed Kubernetes StorageClass.
          This list is hardcoded and cannot be changed by users.
        default:
          - app.kubernetes.io/managed-by
          - app.kubernetes.io/instance
          - kubernetes.io/
          - k8s.io/
          - storage.deckhouse.io/managed-by
        items:
          type: string
      pvcRwxAllowedUsernames:
        type: array
        default: ["system:serviceaccount:d8-virtualization:d8-cdi-sa", "system:serviceaccount:d8-virtualization:cdi-sa", "system:serviceaccount:d8-virtualization:virtualization-controller", "system:serviceaccount:d8-virtualization:kubevirt-internal-virtualization-controller", "system:serviceaccount:d8-sds-replicated-volume:csi"]
        items:
          type: string
        description: |
          Allowed admission usernames that can create RWX PVCs using StorageClasses
          with provisioner `replicated.csi.storage.deckhouse.io`.
      pvcRwxAllowedGroups:
        type: array
        default: []
        items:
          type: string
        description: |
          Allowed admission groups that can create RWX PVCs using StorageClasses
          with provisioner `replicated.csi.storage.deckhouse.io`.
      customSchedulerExtenderCert:
         type: object
         default: {}
         x-required-for-helm:
           - crt
           - key
           - ca
         properties:
           crt:
             type: string
             x-examples: ["YjY0ZW5jX3N0cmluZwo="]
           key:
             type: string
             x-examples: ["YjY0ZW5jX3N0cmluZwo="]
           ca:
             type: string
             x-examples: ["YjY0ZW5jX3N0cmluZwo="]

x-config-version: 2
type: object
properties:
  registryScheme:
    type: string
    description: Deprecated parameter. Remove it from ModuleConfig for Deckhouse with version greater than 1.57.
    default: https
  logLevel:
    type: string
    enum:
      - ERROR
      - WARN
      - INFO
      - DEBUG
      - TRACE
    description: Module log level
    default: INFO
  drbdPortRange:
    type: object
    description: Settings for DRBD TCP ports
    default: {}
    properties:
      minPort:
        type: integer
        default: 7000
        description: |
          DRBD ports range start
      maxPort:
        type: integer
        default: 7999
        description: |
          DRBD ports range end
  dataNodes:
    type: object
    description: Settings for Linstor on nodes with data
    default: {}
    properties:
      nodeSelector:
        type: object
        default:
          kubernetes.io/os: linux
        additionalProperties:
          type: string
        description: |
          The same as in the Pods `spec.nodeSelector` parameter in Kubernetes.

          If parameter is omitted, Linstor nodes will be placed on all nodes.

          **Caution!** Changing this parameter does not result in data redistribution. If node with data no longer matches the `nodeSelector`, data on that node will become inaccessible.
  resyncSlotsPerNode:
    type: integer
    default: 4
    minimum: 0
    description: |
      How many concurrent resyncs a single node may take part in. The default is `4`; `0` means
      no limit.

      A resync is the transfer of a volume's contents over the network into a replica that has no
      data yet or whose data is stale. It is counted in *resync ends*: a transfer between two nodes
      occupies one end on the sending node (reading its disk and pushing to the network) and one on
      the receiving node (receiving and writing). This parameter caps the number of ends per node,
      because the bottleneck is the network interface and the disk of that particular node — not the
      volume, not the replica, and not the cluster as a whole.

      When every node that could send a replica its data is already at the limit, placement of that
      replica is deferred and retried; nothing is interrupted. A resync already in progress is never
      aborted, since that would discard everything already transferred.

      Volumes that are still being created are never deferred, but the load of their resyncs is
      still counted, so that recovery of an existing volume does not oversubscribe a node that
      volume creation is already using.

      The limit is on by default because a volume that loses a copy refills it by itself: a node
      going away makes every volume it held heal at once, which is the load this parameter
      bounds. Lower it on nodes with a slow network or slow disks; the smallest useful value is
      `2`, which still lets a node send and receive at the same time. A lower limit defers the
      placement of replicas that would otherwise be placed at once, so recovery of a large
      cluster takes visibly longer.

      **Caution!** This parameter and the DRBD resync rate ceiling are configured independently.
      Their product must stay within the throughput of the node's link.
  storageClassLabelIgnoredPrefixes:
    type: array
    default:
      - argocd.argoproj.io/
      - kustomize.toolkit.fluxcd.io/
      - helm.toolkit.fluxcd.io/
      - fleet.cattle.io/
    items:
      type: string
    description: |
      List of label-key prefixes that MUST NOT be propagated from a ReplicatedStorageClass
      to the managed Kubernetes StorageClass.

      The controller treats this list as a complement to a built-in (system) list and
      drops any ReplicatedStorageClass label whose key starts with any prefix from either list.

      Matching is literal `strings.HasPrefix` (Go semantics): an entry without a trailing
      `/` matches by substring, NOT by full label key. For example, `team` would drop
      every key starting with `team` (`team`, `team-id`, `team.example.com/...`).
      To restrict matching to a specific subdomain, end the entry with `/`
      (e.g. `argocd.argoproj.io/`). To target an exact label key, write the full key
      and be aware it also matches keys whose name extends it
      (e.g. `app.kubernetes.io/managed-by` also drops `app.kubernetes.io/managed-by-foo`).

      Note that `kubernetes.io/` in the system list matches only labels whose key
      literally starts with `kubernetes.io/`; reserved subdomains such as
      `topology.kubernetes.io/zone` or `node.kubernetes.io/*` are NOT covered by
      default — add them here explicitly if your environment requires it.

      The defaults cover labels typically added by GitOps tooling (Argo CD, Flux,
      Rancher Fleet) so that their reconcilers do not fight the storage controller
      over labels on the managed StorageClass.
  backup:
    type: object
    description: Module backup settings
    properties:
      enabled:
        type: boolean
        default: true
        description: Module backup state
      retentionCount:
        type: integer
        default: 7
        description: Number of backups to keep
      schedule:
        type: string
        default: "0 3 * * *"
        description: Backup schedule
  newControlPlane:
    type: boolean
    default: false
    description: |
      When true, use the new control-plane as a backend for the module. Once switched to true, reverting back to false is prohibited.

      Enabling it is only allowed on Deckhouse development builds; on any release channel the setting is rejected and ignored.

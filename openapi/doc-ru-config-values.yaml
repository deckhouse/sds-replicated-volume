type: object
properties:
  registryScheme:
    description: Устаревший параметр. Удалите его из ModuleConfig для Deckhouse версии выше 1.57.
  logLevel:
    description: Уровень логирования для приложений модуля
  drbdPortRange:
    description: Настройки диапазона TCP-портов для DRBD
    properties:
      minPort:
        description: Начало диапазона портов DRBD
      maxPort:
        description: Конец диапазона портов DRBD
  dataNodes:
    description: Настройки узлов, на которых хранятся реплицируемые тома или к которым они подключаются
    properties:
      nodeSelector:
        description: |
          Настройка аналогична параметру `spec.nodeSelector` пода в Kubernetes.

          Узлы, которые соответствуют селектору, получают лейбл `storage.deckhouse.io/sds-replicated-volume-node: ""`. Агент узла текущего control plane и узловой компонент CSI работают на узлах с этим лейблом.

          Реплики размещаются на узлах из ReplicatedStoragePool; узел без этого лейбла не может хранить реплику.

          Значение по умолчанию `kubernetes.io/os: linux` выбирает все узлы с Linux. Заданное значение заменяет значение по умолчанию, а не объединяется с ним.

          **Внимание!** Указывайте этот параметр при включении модуля. Если изменить его позже, в том числе выключить модуль и снова включить его с другим селектором, на уже выбранных узлах останутся лейблы `storage.deckhouse.io/sds-replicated-volume-*` и продолжат работать компоненты модуля. Лейблы не снимаются, а данные не переносятся на другие узлы.

          Чтобы убрать модуль с такого узла, выполните действия из раздела FAQ [«Пример удаления ресурсов с узла без удаления самого узла»](./faq.html#%D0%BF%D1%80%D0%B8%D0%BC%D0%B5%D1%80-%D1%83%D0%B4%D0%B0%D0%BB%D0%B5%D0%BD%D0%B8%D1%8F-%D1%80%D0%B5%D1%81%D1%83%D1%80%D1%81%D0%BE%D0%B2-%D1%81-%D1%83%D0%B7%D0%BB%D0%B0-%D0%B1%D0%B5%D0%B7-%D1%83%D0%B4%D0%B0%D0%BB%D0%B5%D0%BD%D0%B8%D1%8F-%D1%81%D0%B0%D0%BC%D0%BE%D0%B3%D0%BE-%D1%83%D0%B7%D0%BB%D0%B0), а затем вручную удалите лейблы с узла.
  storageClassLabelIgnoredPrefixes:
    description: |
      Список префиксов ключей лейблов, которые НЕ должны пробрасываться (propagate — копироваться)
      с `ReplicatedStorageClass` на управляемый `StorageClass` в Kubernetes.

      Контроллер объединяет этот список с системным (system — служебным, неизменяемым) списком
      и при формировании лейблов `StorageClass` отбрасывает любой лейбл `ReplicatedStorageClass`,
      ключ которого начинается с одного из префиксов объединённого списка.

      Сопоставление выполняется по `strings.HasPrefix` (буквальное префиксное сравнение,
      без учёта структуры лейбла Kubernetes). Запись без завершающего `/` совпадает
      по подстроке, а не по полному ключу: например, `team` отбросит и `team`,
      и `team-id`, и `team.example.com/...`. Чтобы ограничить совпадение конкретным
      поддоменом, заканчивайте запись на `/` (например, `argocd.argoproj.io/`).
      Чтобы ориентироваться на точный ключ, пишите ключ целиком, помня, что он также
      покроет ключи, имя которых его расширяет
      (например, `app.kubernetes.io/managed-by` отбросит и `app.kubernetes.io/managed-by-foo`).

      Системный префикс `kubernetes.io/` покрывает только ключи, начинающиеся буквально
      на `kubernetes.io/`; зарезервированные K8s поддомены (subdomains) — например,
      `topology.kubernetes.io/zone` или `node.kubernetes.io/*` — по умолчанию НЕ покрываются.
      При необходимости добавляйте их в этот список явно.

      Значения по умолчанию покрывают лейблы, которые обычно проставляют инструменты GitOps
      (Argo CD, Flux, Rancher Fleet), чтобы их реконсилеры (reconcilers — компоненты,
      приводящие фактическое состояние к желаемому) не конфликтовали с контроллером
      `sds-replicated-volume` за состояние лейблов на управляемом `StorageClass`.
  backup:
    properties:
      enabled:
        description: Включение резервного копирования БД модуля
      retentionCount:
        description: Количество  резервных копий для хранения
      schedule:
        description: Расписание резервного копирования
  newControlPlane:
    description: |
      Использовать новый control-plane как бэкенд для модуля. После переключения в true возврат в false запрещён.

      Включение доступно только на dev-сборках Deckhouse; на любом канале обновлений настройка отклоняется и игнорируется.

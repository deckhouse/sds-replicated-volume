type: object
properties:
  registryScheme:
    description: Устаревший параметр. Удалите его из ModuleConfig для Deckhouse версии выше 1.57.
  logLevel:
    description: Уровень логирования для приложений модуля
  drbdPortRange:
    description: Настройки диапазона TCP-портов для DRBD
    properties:
      minPort:
        description: Начало диапазона портов DRBD
      maxPort:
        description: Конец диапазона портов DRBD
  dataNodes:
    description: Настройки для узлов Linstor с данными
    properties:
      nodeSelector:
        description: |
          Настройка аналогична `spec.nodeSelector` в Kubernetes.

          Если параметр не указан, поды для Linstor будут запущены на всех узлах.

          **Внимание!** При изменении этого параметра не происходит переразмещение данных. Если узел с данными перестанет соответствовать `nodeSelector`, данные на нем будут недоступны.
  resyncSlotsPerNode:
    description: |
      Сколько одновременных заливок (resync — передача содержимого тома по сети) допустимо на одном узле.
      Значение по умолчанию — `4`; `0` означает отсутствие ограничения.

      Заливка — это передача содержимого тома по сети в копию, у которой данных нет или они устарели.
      Единица учёта — конец заливки (resync end): заливка между двумя узлами занимает один конец на
      отдающем узле (чтение своего диска и отдача в сеть) и один на принимающем (приём и запись на диск).
      Параметр ограничивает число концов на узле, поскольку узким местом является сетевая карта и диск
      конкретного узла, а не том, не реплика и не кластер целиком.

      Если все узлы, способные отдать реплике данные, уже достигли предела, размещение этой реплики
      откладывается и повторяется позже; ничего при этом не прерывается. Уже идущая заливка никогда не
      останавливается — это отбросило бы всё уже переданное.

      Тома, которые ещё создаются, никогда не задерживаются, но нагрузка от их заливок учитывается,
      чтобы восстановление существующего тома не перегружало узел, уже занятый созданием тома.

      Лимит включён по умолчанию, потому что том, потерявший копию, восстанавливает её сам: уход узла
      заставляет лечиться сразу все тома, которые на нём лежали, — это и есть нагрузка, которую
      ограничивает параметр. Снижайте значение на узлах с медленной сетью или медленными дисками;
      наименьшее осмысленное значение — `2`, при нём узел всё ещё может одновременно отдавать и
      принимать. Чем ниже лимит, тем больше реплик, которые иначе разместились бы сразу, ждут своей
      очереди, поэтому восстановление большого кластера занимает заметно больше времени.

      **Внимание!** Этот параметр и потолок скорости заливки DRBD настраиваются независимо друг от
      друга. Их произведение не должно превышать пропускную способность линка узла.
  storageClassLabelIgnoredPrefixes:
    description: |
      Список префиксов ключей лейблов, которые НЕ должны пробрасываться (propagate — копироваться)
      с `ReplicatedStorageClass` на управляемый `StorageClass` в Kubernetes.

      Контроллер объединяет этот список с системным (system — служебным, неизменяемым) списком
      и при формировании лейблов `StorageClass` отбрасывает любой лейбл `ReplicatedStorageClass`,
      ключ которого начинается с одного из префиксов объединённого списка.

      Сопоставление выполняется по `strings.HasPrefix` (буквальное префиксное сравнение,
      без учёта структуры лейбла Kubernetes). Запись без завершающего `/` совпадает
      по подстроке, а не по полному ключу: например, `team` отбросит и `team`,
      и `team-id`, и `team.example.com/...`. Чтобы ограничить совпадение конкретным
      поддоменом, заканчивайте запись на `/` (например, `argocd.argoproj.io/`).
      Чтобы ориентироваться на точный ключ, пишите ключ целиком, помня, что он также
      покроет ключи, имя которых его расширяет
      (например, `app.kubernetes.io/managed-by` отбросит и `app.kubernetes.io/managed-by-foo`).

      Системный префикс `kubernetes.io/` покрывает только ключи, начинающиеся буквально
      на `kubernetes.io/`; зарезервированные K8s поддомены (subdomains) — например,
      `topology.kubernetes.io/zone` или `node.kubernetes.io/*` — по умолчанию НЕ покрываются.
      При необходимости добавляйте их в этот список явно.

      Значения по умолчанию покрывают лейблы, которые обычно проставляют инструменты GitOps
      (Argo CD, Flux, Rancher Fleet), чтобы их реконсилеры (reconcilers — компоненты,
      приводящие фактическое состояние к желаемому) не конфликтовали с контроллером
      `sds-replicated-volume` за состояние лейблов на управляемом `StorageClass`.
  backup:
    properties:
      enabled:
        description: Включение резервного копирования БД модуля
      retentionCount:
        description: Количество  резервных копий для хранения
      schedule:
        description: Расписание резервного копирования
  newControlPlane:
    description: |
      Использовать новый control-plane как бэкенд для модуля. После переключения в true возврат в false запрещён.

      Включение доступно только на dev-сборках Deckhouse; на любом канале обновлений настройка отклоняется и игнорируется.

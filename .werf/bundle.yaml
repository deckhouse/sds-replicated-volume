# The renderer of the release-notes pages lives in sds-common-lib: it is the same for
# every storage module, and the copy that used to sit in `hack/` here came with a
# committed 2.4-3.6 MB binary that the image depended on. Bump the pin below to pick up a
# new renderer; the module keeps only its notes.
{{- $_ := set $ "ReleaseNotesTool" "github.com/deckhouse/sds-common-lib/cmd/release-notes-docs@v0.16.0" }}
{{- $_ := set $ "GO_PRIVATE_TOKEN" (env "FOX_GO_TOKEN" (env "CI_JOB_TOKEN" "")) }}
{{- if not $.GOPROXY }}{{- $_ := set $ "GOPROXY" (env "GOPROXY" "https://proxy.golang.org,direct") }}{{- end }}
---
image: docs-generator
from: {{ index $.Images "builder/golang-alt" }}
final: false

git:
  - add: /
    to: /
    includePaths:
      - .release-notes
      - CHANGELOG
    stageDependencies:
      setup:
        - "**/*"

mount:
{{ include "mount points for golang builds" $ }}

# sds-common-lib is a private fox module, so the fetch needs the same netrc the Go images
# set up. Without it the go command reports the import path as unrecognised.
secrets:
- id: GOPROXY
  value: {{ $.GOPROXY }}
{{ include "secret for private go modules" $ }}

shell:
  setup:
    {{- include "auth for private go modules" $ | nindent 4 }}
    - cd /
    - mkdir -p /docs
    - |
      GOPROXY="$(cat /run/secrets/GOPROXY)" go run {{ $.ReleaseNotesTool }} \
        --root / \
        --out-en /docs/RELEASE_NOTES.md \
        --out-ru /docs/RELEASE_NOTES.ru.md
    - rm -rf .release-notes CHANGELOG
    - cat /docs/RELEASE_NOTES.md
    - cat /docs/RELEASE_NOTES.ru.md

# Bundle image, stored in your.registry.io/modules/<module-name>:<semver>
---
image: bundle
from: scratch
import:
  # Rendering .werf/images-digests.yaml is required!
  - image: images-digests
    add: /images_digests.json
    to: /images_digests.json
    after: setup
  # Rendering go-hooks is required!
  - image: go-hooks-artifact
    add: /go-hooks
    to: /hooks/go-hooks
    after: setup
  # Rendering .werf/choose-edition.yaml is required!
  - image: choose-edition
    add: /openapi
    to: /openapi
    after: setup
  - image: docs-generator
    add: /docs/RELEASE_NOTES.md
    to: /docs/RELEASE_NOTES.md
    after: setup
  - image: docs-generator
    add: /docs/RELEASE_NOTES.ru.md
    to: /docs/RELEASE_NOTES.ru.md
    after: setup
git:
  - add: /
    to: /
    excludePaths:
      - hooks/go
      - docs/internal
    includePaths:
      - .helmignore
      - charts
      - crds
      - docs
      - hooks
      - monitoring
      - templates
      - Chart.yaml
      - module.yaml
---
{{- include "vex mitigation" (list $ "bundle") }}

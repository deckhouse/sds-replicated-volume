# Release image, stored in your.registry.io/modules/<module-name>/release:<semver>
---
image: release-channel-version-artifact
from: {{ index $.Images "builder/alpine" }}
final: false
git:
- add: /
  to: /
  includePaths:
  - .release-notes
  - CHANGELOG
  - module.yaml
  # The dependency has to sit on `install`, the stage that actually consumes these
  # files below. Declared on `setup` -- a stage this image defines no commands for
  # -- it never invalidates anything: werf reused the cached `install` stage and
  # baked a stale CHANGELOG into the release image, so re-tagging the same version
  # with a fixed changelog silently republished the broken one.
  stageDependencies:
    install:
    - '**/*'
import:
  - from: {{ index $.Images "yq" }}
    add: /usr/bin/yq
    to: /usr/bin/yq
    before: install
shell:
  install:
    - |
      yq -n '.version = "{{ env "MODULES_MODULE_TAG" }}"' -o=json > version.json
    - |
      # changelog.yaml is what DKP reads out of the release image into
      # ModuleRelease.spec.changelog, and Console renders from there. Since the move to the
      # sectioned format the source is the locale pair under .release-notes/, and both
      # locales are shipped under `en` and `ru`; versions released before that move keep
      # their flat CHANGELOG file.
      TAG="{{ env "MODULES_MODULE_TAG" "local" }}"
      EN=".release-notes/${TAG}.yaml"
      RU=".release-notes/${TAG}.ru.yaml"
      LEGACY="CHANGELOG/${TAG}.yml"
      if [ -f "${EN}" ] && [ -f "${RU}" ]; then
        MODULE_NAME="$(yq '.name' module.yaml)"
        # The yq image is built from scratch and has no --arg, so the values are
        # interpolated by the shell.
        yq -n "
          load(\"${EN}\") as \$en |
          load(\"${RU}\") as \$ru |
          {
            \"version\": \"${TAG#v}\",
            \"module\": \"${MODULE_NAME}\",
            \"en\": \$en,
            \"ru\": \$ru
          }
        " > /changelog.yaml
        yq -e '.' /changelog.yaml >/dev/null || {
          echo "merged changelog.yaml for ${TAG} is not valid YAML" >&2
          exit 1
        }
      elif [ -f "${LEGACY}" ]; then
        cp -f "${LEGACY}" /changelog.yaml
      else
        # A release tag without release notes is a defect: the previous `|| touch` hid it
        # and published an empty changelog. Dev tags (mr<N>, main, local) legitimately
        # have none.
        case "${TAG}" in
          v[0-9]*.[0-9]*.[0-9]*)
            echo "No release notes for ${TAG}: expected ${EN} and ${RU}" >&2
            exit 1
            ;;
        esac
        : > /changelog.yaml
      fi
---
image: release-channel-version
from: {{ index $.Images "builder/scratch" }}
git:
  - add: /
    to: /
    includePaths:
      - crds
      - docs
      - openapi
    excludePaths:
      - docs/internal
import:
  - image: release-channel-version-artifact
    add: /
    to: /
    after: install
    includePaths:
      - version.json
      - changelog.yaml
      - module.yaml

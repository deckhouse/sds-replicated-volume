# - a ClusterRole with the computed name d8:{{ .Chart.Name }}:replicatedvolume-manager (templates/csi/rbac-for-us.yaml, under `and .Values.sdsReplicatedVolume.internal.newControlPlane (not (has (default "" .Values.sdsReplicatedVolume.internal.controlPlaneMigration) (list "not_started" "stage1_started" "stage1_completed")))`) is in the templates but did not render with the linter's values, so this declaration does not hold it -- add it (with its `when`), or lint with --values-file values that render it, before --fix rewrites the templates

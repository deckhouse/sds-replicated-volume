# - a ClusterRole with the computed name d8:{{ .Chart.Name }}:replicatedvolumereplica-reader (templates/csi/rbac-for-us.yaml, under `and .Values.sdsReplicatedVolume.internal.newControlPlane (not (has (default "" .Values.sdsReplicatedVolume.internal.controlPlaneMigration) (list "not_started" "stage1_started" "stage1_completed")))`) is in the templates but did not render with the linter's values, so this declaration does not hold it -- add it (with its `when`), or lint with --values-file values that render it, before --fix rewrites the templates
# - a ClusterRoleBinding with the computed name d8:{{ .Chart.Name }}:controller (templates/controller/rbac-for-us.yaml, under `.Values.sdsReplicatedVolume.internal.newControlPlane`) is in the templates but did not render with the linter's values, so this declaration does not hold it -- add it (with its `when`), or lint with --values-file values that render it, before --fix rewrites the templates
# - a ClusterRoleBinding with the computed name d8:{{ .Chart.Name }}:csi:rbac-proxy (templates/csi/rbac-for-us.yaml, under `and .Values.sdsReplicatedVolume.internal.newControlPlane (not (has (default "" .Values.sdsReplicatedVolume.internal.controlPlaneMigration) (list "not_started" "stage1_started" "stage1_completed")))`) is in the templates but did not render with the linter's values, so this declaration does not hold it -- add it (with its `when`), or lint with --values-file values that render it, before --fix rewrites the templates
# - a ClusterRoleBinding with the computed name d8:{{ .Chart.Name }}:replicatedvolume-manager-binding (templates/csi/rbac-for-us.yaml, under `and .Values.sdsReplicatedVolume.internal.newControlPlane (not (has (default "" .Values.sdsReplicatedVolume.internal.controlPlaneMigration) (list "not_started" "stage1_started" "stage1_completed")))`) is in the templates but did not render with the linter's values, so this declaration does not hold it -- add it (with its `when`), or lint with --values-file values that render it, before --fix rewrites the templates
# - a ClusterRoleBinding with the computed name d8:{{ .Chart.Name }}:replicatedvolumeattachment-manager-binding (templates/csi/rbac-for-us.yaml, under `and .Values.sdsReplicatedVolume.internal.newControlPlane (not (has (default "" .Values.sdsReplicatedVolume.internal.controlPlaneMigration) (list "not_started" "stage1_started" "stage1_completed")))`) is in the templates but did not render with the linter's values, so this declaration does not hold it -- add it (with its `when`), or lint with --values-file values that render it, before --fix rewrites the templates
# - a ClusterRoleBinding with the computed name d8:{{ .Chart.Name }}:replicatedvolumereplica-reader-binding (templates/csi/rbac-for-us.yaml, under `and .Values.sdsReplicatedVolume.internal.newControlPlane (not (has (default "" .Values.sdsReplicatedVolume.internal.controlPlaneMigration) (list "not_started" "stage1_started" "stage1_completed")))`) is in the templates but did not render with the linter's values, so this declaration does not hold it -- add it (with its `when`), or lint with --values-file values that render it, before --fix rewrites the templates
# - ServiceAccount agent mounted its token (automountServiceAccountToken unset or true); kept as true -- set false once its pods mount the token themselves
# - ServiceAccount linstor-affinity-controller mounted its token (automountServiceAccountToken unset or true); kept as true -- set false once its pods mount the token themselves

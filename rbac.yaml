# The module RBAC declaration, read from the RBAC objects the module renders. Review it: every TODO is a
# decision "dmt lint" reports; then run "dmt lint --linter rbac --fix" to bring the templates in line with it.
# Objects rendered only under values other than the defaults are not here: lint with --values-file (or
# --matrix) before the first --fix of the templates if the module has such templates, and declare them with when.
#
# Notes:
# - Role/controller (templates/controller/rbac-for-us.yaml, under `.Values.sdsReplicatedVolume.internal.newControlPlane`) is in the templates but did not render with the linter's values, so this declaration does not hold it -- add it (with its `when`), or lint with --values-file values that render it, before --fix rewrites the templates
# - RoleBinding/controller (templates/controller/rbac-for-us.yaml, under `.Values.sdsReplicatedVolume.internal.newControlPlane`) is in the templates but did not render with the linter's values, so this declaration does not hold it -- add it (with its `when`), or lint with --values-file values that render it, before --fix rewrites the templates

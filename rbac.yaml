      - apiGroups:
          - ""
        resources:
          - nodes
        verbs:
          - list
      - apiGroups:
          - storage.deckhouse.io
        resources:
          - replicatedstoragepools
          - replicatedstorageclasses
        verbs:
          - list
    automountServiceAccountToken: true

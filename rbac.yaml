serviceAccounts:
  - name: agent
    path: agent
    when: .Values.sdsReplicatedVolume.internal.newControlPlane
    labels:
      app: agent
    clusterRules:
      - apiGroups:
          - '*'
        resources:
          - '*'
        verbs:
          - '*'
    bindClusterRoles:
      - name: d8:rbac-proxy
        bindingName: d8:sds-replicated-volume:agent-rbac-proxy
    automountServiceAccountToken: true
  - name: linstor-affinity-controller
    path: linstor-affinity-controller
    when: not .Values.sdsReplicatedVolume.internal.newControlPlane
    labels:
      app: linstor-affinity-controller
    clusterRules:
      - apiGroups:
          - ""
        resources:
          - persistentvolumes
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
      - apiGroups:
          - storage.k8s.io
        resources:
          - storageclasses
        verbs:
          - get
      - apiGroups:
          - events.k8s.io
        resources:
          - events
        verbs:
          - create
          - patch
    namespaceRules:
      - apiGroups:
          - coordination.k8s.io
        resources:
          - leases
        verbs:
          - create
          - get
          - update
    automountServiceAccountToken: true
  - name: linstor-controller
    path: linstor-controller
    when: not .Values.sdsReplicatedVolume.internal.newControlPlane
    labels:
      app: linstor-controller
    clusterRules:
      - apiGroups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - get
          - list
          - create
          - delete
          - update
          - patch
          - watch
      - apiGroups:
          - internal.linstor.linbit.com
        resources:
          - '*'
        verbs:
          - get
          - list
          - create
          - delete
          - deletecollection
          - update
          - patch
    namespaceRules:
      - apiGroups:
          - coordination.k8s.io
        resources:
          - leases
        verbs:
          - get
          - watch
          - list
          - delete
          - update
          - create
      - apiGroups:
          - ""
        resources:
          - endpoints
          - endpoints/restricted
        verbs:
          - create
          - patch
          - update
    bindClusterRoles:
      - name: d8:rbac-proxy
        bindingName: d8:sds-replicated-volume:linstor-controller-rbac-proxy
    automountServiceAccountToken: true
  - name: linstor-node
    path: linstor-node
    when: not .Values.sdsReplicatedVolume.internal.newControlPlane
    labels:
      app: linstor-node
    clusterRules:
      - apiGroups:
          - security.openshift.io
        resources:
          - securitycontextconstraints
        resourceNames:
          - privileged
        verbs:
          - use
    bindClusterRoles:
      - name: d8:rbac-proxy
        bindingName: d8:sds-replicated-volume:linstor-node-rbac-proxy
    automountServiceAccountToken: true
  - name: linstor-scheduler-extender
    path: linstor-scheduler-extender
    when: not .Values.sdsReplicatedVolume.internal.newControlPlane
    labels:
      app: linstor-scheduler-extender
    namespaceRules:
      - apiGroups:
          - coordination.k8s.io
        resources:
          - leases
        verbs:
          - create
          - get
          - update
    bindClusterRoles:
      - name: system:kube-scheduler
        bindingName: d8:sds-replicated-volume:linstor-scheduler-extender-kube-scheduler
      - name: system:volume-scheduler
        bindingName: d8:sds-replicated-volume:linstor-scheduler-extender-volume-scheduler
    bindRoles:
      - namespace: kube-system
        name: extension-apiserver-authentication-reader
    automountServiceAccountToken: true
  - name: metadata-backup
    path: metadata-backup
    when: not .Values.sdsReplicatedVolume.internal.newControlPlane
    labels:
      app: metadata-backup
    clusterRules:
      - apiGroups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - get
          - list
          - create
          - delete
          - update
          - patch
          - watch
      - apiGroups:
          - internal.linstor.linbit.com
        resources:
          - '*'
        verbs:
          - get
          - list
      - apiGroups:
          - storage.deckhouse.io
        resources:
          - replicatedstoragemetadatabackups
        verbs:
          - get
          - list
          - create
          - delete
          - watch
          - update
          - patch
    namespaceRules:
      - apiGroups:
          - ""
        resources:
          - secrets
        verbs:
          - get
          - list
          - create
          - patch
          - update
          - delete
    bindClusterRoles:
      - name: d8:rbac-proxy
        bindingName: d8:sds-replicated-volume:metadata-backup-rbac-proxy
    automountServiceAccountToken: true
  - name: webhooks
    path: webhooks
    when: .Values.sdsReplicatedVolume.internal.newControlPlane

# Alerts on the membership layout of ReplicatedVolumes (new control plane).
#
# The sds_rv_condition_problem_timestamp_seconds series is exported only by the new control plane
# controller (images/controller/internal/metrics/current_metrics_collector.go), whose ServiceMonitor
# is itself gated on newControlPlane, so on the old control plane the series does not exist and the
# expression below yields an empty vector. That is why this file is a plain static .yaml with no
# Helm templating and no newControlPlane gate: {{ $labels.* }} stays a Prometheus template.
- name: kubernetes.replicated.volume.layout
  rules:
    - alert: D8ReplicatedVolumeLayoutDegraded
      # A volume under spec.maintenance is excluded: its layout convergence is frozen at the last
      # value and, per the UnderMaintenance contract, must not be reasoned from.
      expr: |
        max by (name, reason) (sds_rv_condition_problem_timestamp_seconds{condition="MembershipLayoutConverged",reason=~"TransitionUnsupported|CannotConverge"})
        unless on (name)
        sds_rv_condition_problem_timestamp_seconds{condition="UnderMaintenance"}
      for: 15m
      # Current metrics disappear for about a minute on a controller restart or a leader change;
      # without this the firing alert would resolve and wait another 15m before firing again.
      # It is also the `for` of D8SdsReplicatedVolumeCurrentMetricsUnavailable, which takes over
      # when the gap is longer; keep the two equal.
      keep_firing_for: 5m
      labels:
        severity_level: "6"
        tier: cluster
      annotations:
        plk_markup_format: "markdown"
        plk_protocol_version: "1"
        plk_labels_as_annotations: "name,reason"
        plk_create_group_if_not_exists__d8_replicated_volume_layout: "D8ReplicatedVolumeLayout,tier=~tier,prometheus=deckhouse,kubernetes=~kubernetes"
        plk_grouped_by__d8_replicated_volume_layout: "D8ReplicatedVolumeLayout,tier=~tier,prometheus=deckhouse,kubernetes=~kubernetes"
        summary: ReplicatedVolume runs with a degraded membership layout
        description: |
          The ReplicatedVolume `{{ $labels.name }}` runs with a layout that does not match its configuration, and the control plane will not repair it on its own (reason `{{ $labels.reason }}`).

          The volume keeps serving I/O: after a replica is lost, the quorum is lowered automatically. A volume configured for two diskful replicas is therefore left with a **single copy of the data**, so the next failure of that copy means downtime and possibly data loss. This alert fires only for the layouts the control plane will not fix on its own — a volume that is re-creating a lost replica by itself reports `Converging` and does not fire here.

          Reasons:

          - `TransitionUnsupported` — the actual layout differs from the intended one and no automatic transition covers this mismatch. The control plane never removes a replica, so this is the reason for a layout with **too many** replicas: an excess diskful replica, or a tie-breaker the configuration no longer asks for. Raising `replication` from r2 to r3 lands here too, because the volume's tie-breaker becomes redundant: remove it by hand and the missing third copy is then added automatically.
          - `CannotConverge` — an automatic transition does apply, but no admissible candidate is available: most often there is no eligible node left to host the missing replica, or not enough capacity in its storage pool. The condition message carries the scheduler's own summary.

          The alert compares the actual layout against the one intended by the volume configuration, so a volume that is configured to run on a single replica reports `Converged` and never fires here. A volume under `spec.maintenance` does not fire either: its layout convergence is frozen while reconciliation is paused.

          The recommended course of action:

          1. Look at the actual layout. It is shown in the `MembershipLayout` column (a priority-1 print column, hence `-o wide`), for example `1D` for a volume whose configuration asks for `2D+1TB`:

             ```shell
             kubectl get rv {{ $labels.name }} -o wide
             ```

          2. Read the exact arithmetic of the mismatch (`layout mismatch: have ..., want ...`) from the `MembershipLayoutConverged` condition:

             ```shell
             kubectl get rv {{ $labels.name }} -o jsonpath='{range .status.conditions[?(@.type=="MembershipLayoutConverged")]}{.status}/{.reason}: {.message}{"\n"}{end}'
             ```

          3. Inspect the replicas the volume currently has — their types, their placement and their `Scheduled` condition:

             ```shell
             kubectl get rvr --field-selector=spec.replicatedVolumeName={{ $labels.name }} -o wide
             ```

          4. If the reason is `CannotConverge`, the replica the volume needs already exists and is waiting for somewhere to live: the control plane created it and the scheduler cannot place it. Read the summary from the condition message above, then make room — bring an eligible node back, add one, or free capacity in the storage pool. No object has to be created by hand; the replica is placed as soon as a candidate appears.

          5. If the volume has more replicas than intended (`have 3D, want 2D+1TB` and similar), or carries a tie-breaker its configuration no longer asks for (`have 2D+1TB, want 3D`), delete the surplus replica by hand — for a diskful one, pick a replica that is not attached and is not the only up-to-date copy:

             ```shell
             kubectl delete rvr <replica-name>
             ```

          6. Watch the condition go back to `True`/`Converged`; the alert resolves once the layout matches the configuration again. If the layout does not converge, or the reason is `CannotConverge` and no node can be freed, contact tech support.

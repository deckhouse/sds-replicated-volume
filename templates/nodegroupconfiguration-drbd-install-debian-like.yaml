apiVersion: deckhouse.io/v1alpha1
kind: NodeGroupConfiguration
metadata:
  name: drbd-install-debian.sh
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
spec:
  weight: 98
  nodeGroups: ["*"]
  bundles: ["ubuntu-lts", "debian", "astra"]
  content: |
    # Copyright 2023 Flant JSC
    #
    # Licensed under the Apache License, Version 2.0 (the "License");
    # you may not use this file except in compliance with the License.
    # You may obtain a copy of the License at
    #
    #     http://www.apache.org/licenses/LICENSE-2.0
    #
    # Unless required by applicable law or agreed to in writing, software
    # distributed under the License is distributed on an "AS IS" BASIS,
    # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    # See the License for the specific language governing permissions and
    # limitations under the License.

    # data nodes checksum to force bashible execution on nodes list change
    # {{ $.Values.sdsReplicatedVolume.internal.dataNodesChecksum }}

    # Unpack package from module image and run install script
    # bb-rp-from-module-image-install package:digest registry_auth scheme registry_address registry_path
    bb-rp-from-module-image-install() {
      local MODULE_PACKAGE=$1
      local REGISTRY_AUTH=$2
      local SCHEME=$3
      local REGISTRY_ADDRESS=$4
      local REGISTRY_PATH=$5

      bb-rp-install $MODULE_PACKAGE
    }

    debian_candidate_version() {
      apt-cache policy "$1" 2>/dev/null | awk '$1 == "Candidate:" && $2 != "(none)" { print $2; exit }'
    }

    debian_snapshot_get() {
      local response
      response="$(mktemp)"
      if /usr/lib/apt/apt-helper download-file "$1" "$response" >/dev/null 2>&1; then
        cat "$response"
        rm -f "$response"
        return 0
      fi
      rm -f "$response"
      return 1
    }

    debian_snapshot_headers_sources() {
      local package="$1"
      local arch="$2"
      local codename="$3"
      local api="http://snapshot.debian.org/mr"
      local encoded version hash
      encoded="$(jq -rn --arg v "$package" '$v | @uri')"
      for version in $(debian_snapshot_get "${api}/binary/${encoded}/" | jq -r '.result[].binary_version'); do
        hash="$(debian_snapshot_get "${api}/binary/${encoded}/$(jq -rn --arg v "$version" '$v | @uri')/binfiles" | jq -r --arg arch "$arch" 'first(.result[] | select(.architecture == $arch) | .hash) // empty')"
        if [ -z "$hash" ]; then
          continue
        fi
        debian_snapshot_get "${api}/file/${hash}/info" | jq -r --arg codename "$codename" '
          [.result[] | select(.archive_name == "debian-security")] as $security
          | if ($security | length) > 0
            then $security[] | "debian-security/\(.first_seen)/ \($codename)-security"
            else .result[] | select(.archive_name == "debian") | "debian/\(.first_seen)/ \($codename)-proposed-updates", "debian/\(.first_seen)/ \($codename)-backports"
            end
          | "deb [check-valid-until=no] http://snapshot.debian.org/archive/\(.) main"'
      done
    }

    drbd_newer_kernels() {
      local modules_dir="$1"
      local running="$2"
      local kernel_dir kernel
      for kernel_dir in "$modules_dir"/*/; do
        kernel="$(basename "$kernel_dir")"
        if [ "$kernel" = "$running" ] || [ ! -d "${kernel_dir}kernel" ]; then
          continue
        fi
        if [ "$(printf '%s\n%s\n' "$running" "$kernel" | sort -V | tail -n 1)" = "$kernel" ]; then
          echo "$kernel"
        fi
      done
    }

    drbd_kernel_needs_build() {
      local module="$1/$2/updates/drbd.ko"
      local desired="$3"
      local regex="$4"
      local version
      version="$(modinfo -F version "$module" 2>/dev/null || true)"
      if [ -z "$version" ] || [[ ! "$version" =~ $regex ]]; then
        return 0
      fi
      [ "$(d8-semver compare "$version" "$desired")" == "-1" ]
    }

    drbd_kernels_to_build() {
      local kernel
      for kernel in $(drbd_newer_kernels "$1" "$2"); do
        if drbd_kernel_needs_build "$1" "$kernel" "$3" "$4"; then
          echo "$kernel"
        fi
      done
    }

    drbd_try() {
      set +e
      ( set -e; "$@" )
      drbd_try_rc=$?
      set -e
    }

    drbd_install_semver() {
      {{- if or (hasPrefix "dev" .Values.global.deckhouseVersion) (hasSuffix "dev" .Values.global.deckhouseVersion) (semverCompare ">=1.63" .Values.global.deckhouseVersion) }}
      bb-package-module-install "semver:{{ include "helm_lib_module_image_digest" (list . "semver" "sdsReplicatedVolume") }}" "$MODULE_REPOSITORY" "sds-replicated-volume"
      {{- else }}
      bb-rp-from-module-image-install "semver:{{ include "helm_lib_module_image_digest" (list . "semver" "sdsReplicatedVolume") }}" "$MODULE_REGISTRY_AUTH" "$MODULE_SCHEME" "$MODULE_REGISTRY_ADDRESS" "$MODULE_REGISTRY_PATH"
      {{- end }}
    }

    drbd_install_sources() {
      local package_name sibling_package_name sibling_installed drbd_config sources_version
      # Registry-package may skip install when the digest marker matches even if
      # /opt/deckhouse/drbd is stale. Both drbd and drbdLegacy unpack to the same
      # path; remove the inactive sibling too so a later uninstall of the old hold
      # cannot wipe the active sources. Sibling uninstall clears the shared tree,
      # so the active package must be removed as well to force reinstall.
      package_name="{{ include "drbd_package_name" . }}"
      if [ "$package_name" = "drbd" ]; then
        sibling_package_name="drbdLegacy"
      else
        sibling_package_name="drbd"
      fi
      sibling_installed="false"
      if [ -f "/var/cache/registrypackages/${sibling_package_name}/uninstall" ]; then
        sibling_installed="true"
      fi
      drbd_config="/opt/deckhouse/drbd/drbd/linux/drbd_config.h"
      sources_version=""
      if [ -f "$drbd_config" ]; then
        sources_version="$(sed -ne '/^#define REL_VERSION/{s/^[^"]*"\([^ "]*\).*/\1/;p;q;}' "$drbd_config")"
      fi
      if [ "$sibling_installed" = "true" ] || [ -z "$sources_version" ] || [ "$sources_version" != "$desired_version" ]; then
        bb-log-info "DRBD package reinstall required (sources='${sources_version:-none}', desired='${desired_version}', sibling_${sibling_package_name}=${sibling_installed})"
        bb-package-remove "$sibling_package_name" "$package_name"
      fi
      bb-package-module-install "${package_name}:{{ include "helm_lib_module_image_digest" (list . (include "drbd_package_name" .) "sdsReplicatedVolume") }}" "$MODULE_REPOSITORY" "sds-replicated-volume"
    }

    drbd_spaas_url() {
      local attempt
      if [ -n "${SPAAS_URL:-}" ]; then
        return 0
      fi

      attempt=0
      until SPAAS_IP="$(host -t A "$SPAAS_FQDN" "$CLUSTER_DNS" | awk '/has address/ { print $4 }')"
      do
        if [ $attempt -gt 60 ]; then
          bb-log-info "Cluster DNS isn't accessible, can't get SPAAS service IP for DRBD building"
          return 1
        fi

        ((attempt=attempt+1))
        bb-log-info "Waiting for cluster DNS response (try #$attempt)"
        sleep 10
      done

      bb-log-info "Cluster DNS responded, got SPAAS service IP"

      export SPAAS_URL="https://${SPAAS_IP}:2020"

      attempt=0
      until [[ "$(d8-curl -ks -w '%{http_code}' -o /dev/null $SPAAS_URL'/api/v1/hello')" == "200" ]]
      do
        if [ $attempt -gt 60 ]; then
          bb-log-info "SPAAS service isn't accessible, can't continue DRBD building"
          unset SPAAS_URL
          return 1
        fi

        ((attempt=attempt+1))
        bb-log-info "Waiting for SPAAS service is being accessible (try #$attempt)"
        sleep 10
      done

      bb-log-info "SPAAS service is accessible, starting DRBD building"
    }

    drbd_build_and_install() {
      local kernel="$1"
      if [[ "$(mokutil --sb-state || echo "Not supported")" == "SecureBoot enabled" ]]; then
        bb-log-info "SecureBoot is enabled, so DRBD is not built for kernel ${kernel}"
        return 0
      fi
      drbd_install_sources
      drbd_spaas_url
      drbd_build_dir="$(mktemp -d /var/tmp/d8-drbd-build.XXXXXX)"
      trap 'rm -rf "$drbd_build_dir"' EXIT
      cp -a /opt/deckhouse/drbd/. "$drbd_build_dir"
      cd "$drbd_build_dir"
      make clean || true
      make KDIR="/lib/modules/${kernel}/build"
      make install
      depmod -a "$kernel"
      bb-log-info "DRBD $(modinfo -F version "/lib/modules/${kernel}/updates/drbd.ko") is built for kernel ${kernel}"
    }

    drbd_build_for_newer_kernels() {
      local kernels kernel
      drbd_try drbd_install_semver
      if [ "$drbd_try_rc" -ne 0 ]; then
        bb-log-warning "d8-semver is not installed, so DRBD is not built for the installed kernels the node has not booted yet"
        return 0
      fi
      kernels="$(drbd_kernels_to_build /lib/modules "$kernel_version_in_use" "$desired_version" "$current_version_regex")"
      for kernel in $kernels; do
        bb-log-info "Building DRBD ${desired_version} for kernel ${kernel}, which is installed and not booted yet"
        drbd_try drbd_build_for_kernel "$kernel"
        if [ "$drbd_try_rc" -ne 0 ]; then
          bb-log-warning "DRBD ${desired_version} is not built for kernel ${kernel}, so the node builds it after it boots into that kernel"
        fi
      done
    }

    debian_kernel_gcc() {
      if grep -qs 'x86_64-linux-gnu-gcc-12' "$1/.config"; then
        echo gcc-12
      else
        echo gcc
      fi
    }

    install_kernel_headers() {
      local kernel="$1"
      local log="$2"
      local headers_package headers_snapshot_list headers_candidate os_id os_codename snapshot_sources
      headers_package="linux-headers-${kernel}"
      headers_snapshot_list="/etc/apt/sources.list.d/d8-drbd-kernel-headers-snapshot.list"
      if [ -e "$headers_snapshot_list" ]; then
        rm -f "$headers_snapshot_list"
        bb-flag-unset apt-updated
      fi
      if ! bb-apt-package? "$headers_package"; then
        bb-apt-update
        headers_candidate="$(debian_candidate_version "$headers_package" || true)"
        if [ -n "$headers_candidate" ]; then
          bb-log-info "${headers_package} ${headers_candidate} is in the configured repositories"
        else
          os_id="$(. /etc/os-release && echo "${ID:-}")"
          os_codename="$(. /etc/os-release && echo "${VERSION_CODENAME:-}")"
          if [ "$os_id" = "debian" ] && [ -n "$os_codename" ]; then
            bb-log-info "${headers_package} is not in the configured repositories, looking for it on snapshot.debian.org"
            bb-set-proxy
            snapshot_sources="$(debian_snapshot_headers_sources "$headers_package" "$(dpkg --print-architecture)" "$os_codename" | sort -u || true)"
            bb-unset-proxy
            if [ -n "$snapshot_sources" ]; then
              bb-log-info "Adding snapshot.debian.org sources for ${headers_package}: ${snapshot_sources//$'\n'/; }"
              printf '%s\n' "$snapshot_sources" > "$headers_snapshot_list"
              bb-flag-unset apt-updated
              bb-apt-update || true
            else
              bb-log-warning "snapshot.debian.org has no ${headers_package} for this architecture or cannot be reached"
            fi
          fi
        fi
        if [ -z "$(debian_candidate_version "$headers_package" || true)" ]; then
          rm -f "$headers_snapshot_list"
          bb-flag-unset apt-updated
          "$log" "${headers_package} for kernel ${kernel} is in neither the configured repositories nor the archives the script knows, so DRBD cannot be built for that kernel on this node. Add a repository or mirror that provides the package, or boot the node into a kernel whose headers are available."
          return 1
        fi
      fi
      bb-apt-install "$headers_package"
      if [ -e "$headers_snapshot_list" ]; then
        rm -f "$headers_snapshot_list"
        bb-flag-unset apt-updated
      fi
    }

    debian_headers_packages_without_kernel() {
      local modules_dir="$1"
      local packages path kernel
      dpkg-query -S '/lib/modules/*/build' '/usr/lib/modules/*/build' 2>/dev/null | while IFS=: read -r packages path; do
        kernel="$(basename "$(dirname "${path# }")")"
        if [ ! -d "${modules_dir}/${kernel}/kernel" ]; then
          printf '%s\n' "${packages//, /$'\n'}"
        fi
      done || true
    }

    drbd_build_for_kernel() {
      install_kernel_headers "$1" bb-log-warning
      bb-apt-install make bind9-host patch mokutil "$(debian_kernel_gcc "/lib/modules/$1/build")"
      drbd_build_and_install "$1"
    }

    kubeconfig="/etc/kubernetes/kubelet.conf"

    kernel_version_in_use="$(uname -r)"

    CLUSTER_DNS="{{ .Values.global.discovery.clusterDNSAddress }}"
    SPAAS_FQDN="spaas.d8-{{ .Chart.Name }}.svc.{{ .Values.global.discovery.clusterDomain }}"

    MODULE_REGISTRY_AUTH="$(echo {{ .Values.sdsReplicatedVolume.registry.dockercfg }} | base64 -d | jq -r '.auths[].auth // ""' | base64 -d)"
    {{- if or (hasPrefix "dev" .Values.global.deckhouseVersion) (hasSuffix "dev" .Values.global.deckhouseVersion) (semverCompare ">=1.58" .Values.global.deckhouseVersion) }}
    MODULE_SCHEME="{{ .Values.sdsReplicatedVolume.registry.scheme }}"
    {{- else }}
    MODULE_SCHEME="{{ .Values.sdsReplicatedVolume.registryScheme }}"
    {{- end }}
    MODULE_REGISTRY_ADDRESS=$(echo {{ .Values.sdsReplicatedVolume.registry.base }} | cut -f 1 -d '/')
    MODULE_REGISTRY_PATH="/"$(echo {{ .Values.sdsReplicatedVolume.registry.base }} | cut -f 2- -d '/')"/sds-replicated-volume"
    MODULE_REPOSITORY="{{ .Values.sdsReplicatedVolume.registry.base }}"

    is_master=$(bb-kubectl --kubeconfig $kubeconfig  get node "$(hostname)" -o json | jq -c '.metadata.labels | contains({"node-role.kubernetes.io/control-plane": ""})')
    if [ $is_master == "true" ]; then
      {{- if or (hasPrefix "dev" .Values.global.deckhouseVersion) (hasSuffix "dev" .Values.global.deckhouseVersion) (semverCompare ">=1.63" .Values.global.deckhouseVersion) }}
      bb-package-module-install "serviceScripts:{{ include "helm_lib_module_image_digest" (list . "serviceScripts" "sdsReplicatedVolume") }}" "$MODULE_REPOSITORY" "sds-replicated-volume"
      {{- else }}
      bb-rp-from-module-image-install "serviceScripts:{{ include "helm_lib_module_image_digest" (list . "serviceScripts" "sdsReplicatedVolume") }}" "$MODULE_REGISTRY_AUTH" "$MODULE_SCHEME" "$MODULE_REGISTRY_ADDRESS" "$MODULE_REGISTRY_PATH"
      {{- end }}
    fi

    is_linstor_data_node=$(bb-kubectl --kubeconfig $kubeconfig  get node "$(hostname)" -o json | jq -c '.metadata.labels | contains({"storage.deckhouse.io/sds-replicated-volume-node":""})')

    bb-log-info "we need drbd on node: "$is_linstor_data_node

    # Usermode helper has been disabled according to vendor recommendations. More information can be found here:
    # https://github.com/LINBIT/drbd/commit/819285d065f1f81bad7b97e32a64017b5e15948d
    # https://github.com/LINBIT/linstor-server/issues/121
    # https://github.com/piraeusdatastore/piraeus-operator/issues/134
    bb-sync-file /etc/modprobe.d/drbd.conf - << "EOF"
    options drbd usermode_helper=disabled
    EOF

    if [ $is_linstor_data_node == "false" ]; then
      if [ -e "/proc/drbd" ]; then
        if [ -e "/etc/modules" ]; then
          sed -i 's/^drbd$//' /etc/modules
        fi
        rmmod drbd_transport_rdma || true
        rmmod drbd_transport_tcp || true
        rmmod drbd || true
      fi
      exit 0
    fi

    current_version_regex='{{ include "drbd_current_version_regex" . }}'
    desired_version={{ include "drbd_desired_version" . | quote }}

    if [ -e "/proc/drbd" ]; then
      # DRBD check version

      current_version="$(cat /proc/drbd | grep 'version:' | awk '{print $2}')"
      # We expect the loaded DRBD module to be version 9.
      # If version 8 is loaded, it means that for some reason, the in-tree kernel module has been automatically loaded.
      # (For example, this can happen due to drbd-utils installed on the host, which should not occur in standard scenarios).
      # We are only interested in the version 9 loaded by our helper script, so unload module and wait until it done.
      if [[ ! $current_version =~ ^9.* ]]; then
        rmmod drbd_transport_rdma || true
        rmmod drbd_transport_tcp || true
        rmmod drbd || true
      fi

      {{- if or (hasPrefix "dev" .Values.global.deckhouseVersion) (hasSuffix "dev" .Values.global.deckhouseVersion) (semverCompare ">=1.63" .Values.global.deckhouseVersion) }}
      bb-package-module-install "semver:{{ include "helm_lib_module_image_digest" (list . "semver" "sdsReplicatedVolume") }}" "$MODULE_REPOSITORY" "sds-replicated-volume"
      {{- else }}
      bb-rp-from-module-image-install "semver:{{ include "helm_lib_module_image_digest" (list . "semver" "sdsReplicatedVolume") }}" "$MODULE_REGISTRY_AUTH" "$MODULE_SCHEME" "$MODULE_REGISTRY_ADDRESS" "$MODULE_REGISTRY_PATH"
      {{- end }}

      if [ -z "$current_version" ] || [[ ! "$current_version" =~ $current_version_regex ]]; then
        bb-log-info "DRBD needs to be rebuilt"
      elif [ "$(d8-semver compare "$current_version" "$desired_version")" == "-1" ]; then
        bb-log-info "DRBD needs to be rebuilt"
      else
        if [ -e "/etc/modules" ]; then
          if grep -q -E '^drbd$' /etc/modules; then
            sed -i '/^drbd$/d' /etc/modules
          fi
        fi
        bb-sync-file /etc/modules-load.d/d8_drbd.conf - <<< "drbd"

        bb-log-info "Desired drbd version is already loaded, nothing to do"
        drbd_build_for_newer_kernels
        exit 0
      fi
    fi

    # The headers are needed only to build DRBD, so they are asked for only once
    # the check above has found no desired DRBD loaded: a node
    # that already runs it has no business waiting on its repositories.
    # DRBD requires the kernel sources to be installed.
    # Install actual kernel headers
    install_kernel_headers "$kernel_version_in_use" bb-log-error

    # Remove unused kernel-headers
    packages_to_remove="$(debian_headers_packages_without_kernel /lib/modules)"
    if [ -n "$packages_to_remove" ]; then
      bb-apt-remove $packages_to_remove
    fi

    # Check, if we need gcc version 12
    gccVersion="$(cat /proc/version | grep -q x86_64-linux-gnu-gcc-12 && echo gcc-12 || echo gcc)"
    bb-apt-install make bind9-host patch mokutil $gccVersion
    check_sb_state="$(mokutil --sb-state || echo "Not supported")"
    if [[ "$check_sb_state" == "SecureBoot enabled" ]]; then
      bb-log-info "SecureBoot is enabled. Please manually install DRBD version ${desired_version} or higher."
      exit 0
    fi

    drbd_install_sources

    drbd_spaas_url

    cd /opt/deckhouse/drbd
    make clean || true
    make
    make install
    if [ -e "/etc/modules" ]; then
      if grep -q -E '^drbd$' /etc/modules; then
        sed -i '/^drbd$/d' /etc/modules
      fi
    fi
    bb-sync-file /etc/modules-load.d/d8_drbd.conf - <<< "drbd"
    depmod
    modprobe drbd
    modprobe dm-thin-pool

    if [ -e "/proc/drbd" ]; then
      current_version="$(cat /proc/drbd | grep 'version:' | awk '{print $2}')"
      {{- if or (hasPrefix "dev" .Values.global.deckhouseVersion) (hasSuffix "dev" .Values.global.deckhouseVersion) (semverCompare ">=1.63" .Values.global.deckhouseVersion) }}
      bb-package-module-install "semver:{{ include "helm_lib_module_image_digest" (list . "semver" "sdsReplicatedVolume") }}" "$MODULE_REPOSITORY" "sds-replicated-volume"
      {{- else }}
      bb-rp-from-module-image-install "semver:{{ include "helm_lib_module_image_digest" (list . "semver" "sdsReplicatedVolume") }}" "$MODULE_REGISTRY_AUTH" "$MODULE_SCHEME" "$MODULE_REGISTRY_ADDRESS" "$MODULE_REGISTRY_PATH"
      {{- end }}

      if [ -z "$current_version" ] || [[ ! "$current_version" =~ $current_version_regex ]] || [ "$(d8-semver compare "$current_version" "$desired_version")" == "-1" ]; then
        bb-log-info "Non-actual version of drbd is loaded (now $current_version, desired minimum $desired_version), setting reboot flag"
        bb-flag-set reboot
      fi
    fi

    drbd_build_for_newer_kernels

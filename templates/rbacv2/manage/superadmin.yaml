{{- if eq (include "sds-replicated-volume.rbacv2_new_scheme" .) "true" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:system-capability:sds-replicated-volume:superadmin
  {{- include "helm_lib_module_labels" (list . (dict "rbac.deckhouse.io/aggregate-to-storage-as" "superadmin" "rbac.deckhouse.io/capability" "system-capability.sds-replicated-volume.superadmin" "rbac.deckhouse.io/kind" "capability" "rbac.deckhouse.io/namespace" "d8-sds-replicated-volume" "rbac.deckhouse.io/scope" "system")) | nindent 2 }}
  annotations:
    en.meta.deckhouse.io/description: "Read ReplicatedVolume and DRBDResource resources, which hold the DRBD shared secret of every volume, and create and delete DRBDResourceOperation and DRBDNodeOperation resources, the DRBD maintenance operations of the new control plane, such as ForcePrimary, Invalidate, CreateNewUUID and UpdateDRBD."
    en.meta.deckhouse.io/title: "Module sds-replicated-volume: DRBD operations and volumes"
    ru.meta.deckhouse.io/description: "Чтение ресурсов ReplicatedVolume и DRBDResource, которые хранят общий секрет DRBD каждого тома, а также создание и удаление ресурсов DRBDResourceOperation и DRBDNodeOperation — операций обслуживания DRBD новой управляющей плоскости, например ForcePrimary, Invalidate, CreateNewUUID и UpdateDRBD."
    ru.meta.deckhouse.io/title: "Модуль sds-replicated-volume: операции DRBD и тома"
rules:
- apiGroups:
  - storage.deckhouse.io
  resources:
  - drbdnodeoperations
  verbs:
  - create
  - delete
- apiGroups:
  - storage.deckhouse.io
  resources:
  - drbdresourceoperations
  verbs:
  - create
  - delete
- apiGroups:
  - storage.deckhouse.io
  resources:
  - drbdresources
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.deckhouse.io
  resources:
  - replicatedvolumes
  verbs:
  - get
  - list
  - watch
{{- end }}

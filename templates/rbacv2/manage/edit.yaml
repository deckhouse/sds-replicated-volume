{{- if eq (include "sds-replicated-volume.rbacv2_new_scheme" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: sds-replicated-volume
    rbac.deckhouse.io/aggregate-to-storage-as: manager
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "system-capability.sds-replicated-volume.edit"
    rbac.deckhouse.io/scope: system
    rbac.deckhouse.io/namespace: d8-sds-replicated-volume
  name: d8:system-capability:sds-replicated-volume:edit
  annotations:
    en.meta.deckhouse.io/title: "Module sds-replicated-volume: manage cluster resources"
    ru.meta.deckhouse.io/title: "Модуль sds-replicated-volume: управление кластерными ресурсами"
    en.meta.deckhouse.io/description: "Create, update and delete the cluster-scoped resources of the sds-replicated-volume module (DRBDMapper, DRBDNodeOperation, DRBDResourceOperation, DRBDResource, ReplicatedStorageClass, ReplicatedStoragePool, ReplicatedVolumeAttachment, ReplicatedVolumeReplica, ReplicatedVolume)."
    ru.meta.deckhouse.io/description: "Создание, изменение и удаление кластерных ресурсов модуля sds-replicated-volume (DRBDMapper, DRBDNodeOperation, DRBDResourceOperation, DRBDResource, ReplicatedStorageClass, ReplicatedStoragePool, ReplicatedVolumeAttachment, ReplicatedVolumeReplica, ReplicatedVolume)."
rules:
- apiGroups:
  - storage.deckhouse.io
  resources:
  - drbdmappers
  - drbdnodeoperations
  - drbdresourceoperations
  - drbdresources
  - replicatedstorageclasses
  - replicatedstoragepools
  - replicatedvolumeattachments
  - replicatedvolumereplicas
  - replicatedvolumes
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: sds-replicated-volume
    rbac.deckhouse.io/aggregate-to-storage-as: manager
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-sds-replicated-volume
  name: d8:manage:permission:module:sds-replicated-volume:edit
rules:
- apiGroups:
  - storage.deckhouse.io
  resources:
  - drbdmappers
  - drbdnodeoperations
  - drbdresourceoperations
  - drbdresources
  - replicatedstorageclasses
  - replicatedstoragepools
  - replicatedvolumeattachments
  - replicatedvolumereplicas
  - replicatedvolumes
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
{{- end }}

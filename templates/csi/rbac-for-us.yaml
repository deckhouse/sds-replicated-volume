{{- include "helm_lib_csi_controller_rbac" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:{{ .Chart.Name }}:storagepool-reader
  {{- include "helm_lib_module_labels" (list . ) | nindent 2 }}
rules:
  - apiGroups: ["storage.deckhouse.io"]
    resources: ["replicatedstoragepools", "lvmvolumegroups"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d8:{{ .Chart.Name }}:storagepool-reader-binding
  {{- include "helm_lib_module_labels" (list . ) | nindent 2 }}
subjects:
  - kind: ServiceAccount
    name: csi
    namespace: d8-{{ .Chart.Name }}
roleRef:
  kind: ClusterRole
  name: d8:{{ .Chart.Name }}:storagepool-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:{{ .Chart.Name }}:rsc-watcher
  {{- include "helm_lib_module_labels" (list . ) | nindent 2 }}
rules:
  - apiGroups: ["storage.deckhouse.io"]
    resources: ["replicatedstorageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d8:{{ .Chart.Name }}:rsc-read-access
  {{- include "helm_lib_module_labels" (list . ) | nindent 2 }}
subjects:
  - kind: ServiceAccount
    name: csi
    namespace: d8-{{ .Chart.Name }}
roleRef:
  kind: ClusterRole
  name: d8:{{ .Chart.Name }}:rsc-watcher
  apiGroup: rbac.authorization.k8s.io


{{- if and .Values.sdsReplicatedVolume.internal.newControlPlane (not (has (default "" .Values.sdsReplicatedVolume.internal.controlPlaneMigration) (list "not_started" "stage1_started" "stage1_completed"))) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:{{ .Chart.Name }}:replicatedvolume-manager
  {{- include "helm_lib_module_labels" (list . ) | nindent 2 }}
rules:
  - apiGroups: ["storage.deckhouse.io"]
    resources: ["replicatedvolumes"]
    verbs: ["create", "get", "update", "delete", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d8:{{ .Chart.Name }}:replicatedvolume-manager-binding
  {{- include "helm_lib_module_labels" (list . ) | nindent 2 }}
subjects:
  - kind: ServiceAccount
    name: csi
    namespace: d8-{{ .Chart.Name }}
roleRef:
  kind: ClusterRole
  name: d8:{{ .Chart.Name }}:replicatedvolume-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:{{ .Chart.Name }}:replicatedvolumereplica-reader
  {{- include "helm_lib_module_labels" (list . ) | nindent 2 }}
rules:
  - apiGroups: ["storage.deckhouse.io"]
    resources: ["replicatedvolumereplicas"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d8:{{ .Chart.Name }}:replicatedvolumereplica-reader-binding
  {{- include "helm_lib_module_labels" (list . ) | nindent 2 }}
subjects:
  - kind: ServiceAccount
    name: csi
    namespace: d8-{{ .Chart.Name }}
roleRef:
  kind: ClusterRole
  name: d8:{{ .Chart.Name }}:replicatedvolumereplica-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:{{ .Chart.Name }}:replicatedvolumeattachment-manager
  {{- include "helm_lib_module_labels" (list . ) | nindent 2 }}
rules:
  - apiGroups: ["storage.deckhouse.io"]
    resources: ["replicatedvolumeattachments"]
    verbs: ["create", "get", "update", "delete", "list", "watch"]
  - apiGroups: ["storage.deckhouse.io"]
    resources: ["replicatedvolumeattachments/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d8:{{ .Chart.Name }}:replicatedvolumeattachment-manager-binding
  {{- include "helm_lib_module_labels" (list . ) | nindent 2 }}
subjects:
  - kind: ServiceAccount
    name: csi
    namespace: d8-{{ .Chart.Name }}
roleRef:
  kind: ClusterRole
  name: d8:{{ .Chart.Name }}:replicatedvolumeattachment-manager
  apiGroup: rbac.authorization.k8s.io
---
{{- /*
  Both CSI pods of this branch -- the controller Deployment and the node DaemonSet --
  carry a kube-rbac-proxy in front of their metrics port, and both run under the "csi"
  ServiceAccount. The proxy answers every scrape by asking the API server who the
  caller is (TokenReview) and whether they hold get on the prometheus-metrics
  subresource (SubjectAccessReview). Both verbs live in d8:rbac-proxy, and neither
  helm_lib_csi_controller_rbac nor anything else here grants them. Without this
  binding the proxy fails closed with 401 while the pods stay Ready, so the only
  symptom is up == 0 on both CSI jobs and a TargetDown that never clears.

  One binding for both workloads, because one ServiceAccount serves both.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d8:{{ .Chart.Name }}:csi:rbac-proxy
  {{- include "helm_lib_module_labels" (list . ) | nindent 2 }}
subjects:
  - kind: ServiceAccount
    name: csi
    namespace: d8-{{ .Chart.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: d8:rbac-proxy
{{- end }}

###
### controller
###

{{- define "csi_controller_args" }}
{{- if not .Values.sdsReplicatedVolume.internal.newControlPlane }}
- --csi-endpoint=unix://$(ADDRESS)
- --node=$(KUBE_NODE_NAME)
- --linstor-endpoint=$(LS_CONTROLLERS)
- --log-level=info
{{- end }}

{{- if and .Values.sdsReplicatedVolume.internal.newControlPlane (not (has (default "" .Values.sdsReplicatedVolume.internal.controlPlaneMigration) (list "not_started" "stage1_started" "stage1_completed"))) }}
- --csi-endpoint=unix://$(ADDRESS)
{{- end }}
{{- end }}


{{- define "csi_controller_envs" }}
{{- if not .Values.sdsReplicatedVolume.internal.newControlPlane }}
- name: ADDRESS
  value: /csi/csi.sock
- name: KUBE_NODE_NAME
  valueFrom:
    fieldRef:
      apiVersion: v1
      fieldPath: spec.nodeName
- name: LS_CONTROLLERS
  value: https://linstor.d8-sds-replicated-volume.svc:3371
- name: LS_ROOT_CA
  valueFrom:
    secretKeyRef:
      key: ca.crt
      name: linstor-client-https-cert
- name: LS_USER_CERTIFICATE
  valueFrom:
    secretKeyRef:
      key: tls.crt
      name: linstor-client-https-cert
- name: LS_USER_KEY
  valueFrom:
    secretKeyRef:
      key: tls.key
      name: linstor-client-https-cert
{{- end }}

{{- if and .Values.sdsReplicatedVolume.internal.newControlPlane (not (has (default "" .Values.sdsReplicatedVolume.internal.controlPlaneMigration) (list "not_started" "stage1_started" "stage1_completed"))) }}
- name: ADDRESS
  value: /csi/csi.sock
- name: KUBE_NODE_NAME
  valueFrom:
    fieldRef:
      apiVersion: v1
      fieldPath: spec.nodeName
- name: LOG_LEVEL
  value: {{ include "helm_lib_module_controller_log_level" (list . "sdsReplicatedVolume") | quote }}
{{- /* Only this branch runs our own driver; the legacy branch is LINSTOR's CSI, which
       does not read this. Loopback, because the kube-rbac-proxy added below is what
       publishes it.

       The CSI node DaemonSet deliberately gets no such env: it is hostNetwork, where a
       bound port is a node-level resource and needs an entry in the Deckhouse port
       registry. With the variable unset the driver opens no endpoint at all. */}}
- name: METRICS_BIND_ADDRESS
  value: "127.0.0.1:{{ .Values.sdsReplicatedVolume.internal.csiControllerMetricsPort }}"
{{- end }}

{{- include "helm_lib_envs_for_proxy" . }}
{{- end }}


{{- define "csi_controller_init_containers" }}
{{- if not .Values.sdsReplicatedVolume.internal.newControlPlane }}
- command:
  - /linstor-wait-until
  - api-online
  env:
  - name: LS_CONTROLLERS
    value: https://linstor.d8-sds-replicated-volume.svc:3371
  - name: LS_ROOT_CA
    valueFrom:
      secretKeyRef:
        key: ca.crt
        name: linstor-client-https-cert
  - name: LS_USER_CERTIFICATE
    valueFrom:
      secretKeyRef:
        key: tls.crt
        name: linstor-client-https-cert
  - name: LS_USER_KEY
    valueFrom:
      secretKeyRef:
        key: tls.key
        name: linstor-client-https-cert
  image: {{ include "helm_lib_module_image" (list . "linstorWaitUntil") }}
  imagePullPolicy: IfNotPresent
  name: linstor-wait-api-online
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
{{- end }}
{{- end }}


{{- define "csi_additional_controller_volumes" }}
{{- end }}


{{- define "csi_additional_controller_volume_mounts" }}
{{- end }}


{{- define "csi_controller_metrics_proxy_vpa" }}
{{- include "helm_lib_vpa_kube_rbac_proxy_resources" . }}
{{- end }}


{{- define "csi_controller_metrics_proxy" }}
- name: kube-rbac-proxy
  {{- include "helm_lib_module_container_security_context_pss_restricted_flexible" dict | nindent 2 }}
  image: {{ include "helm_lib_module_common_image" (list . "kubeRbacProxy") }}
  imagePullPolicy: IfNotPresent
  args:
    - "--secure-listen-address=$(KUBE_RBAC_PROXY_LISTEN_ADDRESS):{{ .Values.sdsReplicatedVolume.internal.csiControllerMetricsProxyPort }}"
    - "--v=2"
    - "--logtostderr=true"
    - "--stale-cache-interval=1h30m"
    - "--livez-path=/livez"
  env:
    - name: KUBE_RBAC_PROXY_LISTEN_ADDRESS
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: KUBE_RBAC_PROXY_CONFIG
      value: |
        excludePaths:
        - /livez
        upstreams:
        - upstream: http://127.0.0.1:{{ .Values.sdsReplicatedVolume.internal.csiControllerMetricsPort }}/metrics
          path: /metrics
          authorization:
            resourceAttributes:
              namespace: d8-{{ .Chart.Name }}
              apiGroup: apps
              apiVersion: v1
              resource: deployments
              subresource: prometheus-metrics
              name: csi-controller
  ports:
    - name: https-metrics
      containerPort: {{ .Values.sdsReplicatedVolume.internal.csiControllerMetricsProxyPort }}
      protocol: TCP
  livenessProbe:
    httpGet:
      path: /livez
      port: {{ .Values.sdsReplicatedVolume.internal.csiControllerMetricsProxyPort }}
      scheme: HTTPS
  {{- /* No readinessProbe on purpose: readiness of this pod is what the provisioning
         path hangs on, and a container that only serves metrics must not be able to
         take it out. A wedged proxy is still restarted by the liveness probe. */}}
  resources:
    requests:
      {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 6 }}
{{- if not (include "helm_lib_api_version_exists" (list . "autoscaling.k8s.io/v1/VerticalPodAutoscaler")) }}
      {{- include "helm_lib_container_kube_rbac_proxy_resources" . | nindent 6 }}
{{- end }}
{{- end }}


{{- define "csi_custom_node_selector" }}
storage.deckhouse.io/sds-replicated-volume-node: ""
{{- end }}


{{- if not .Values.sdsReplicatedVolume.internal.newControlPlane }}
{{- $csiControllerImage := include "helm_lib_module_image" (list . "linstorCsi") }}


    - satellite-online
    - $(KUBE_NODE_NAME)
  env:
    - name: KUBE_NODE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: spec.nodeName
    - name: LS_CONTROLLERS
      value: https://linstor.d8-{{ .Chart.Name }}.svc:3371
    - name: LS_ROOT_CA
      valueFrom:
        secretKeyRef:
          key: ca.crt
          name: linstor-client-https-cert
    - name: LS_USER_CERTIFICATE
      valueFrom:
        secretKeyRef:
          key: tls.crt
          name: linstor-client-https-cert
    - name: LS_USER_KEY
      valueFrom:
        secretKeyRef:
          key: tls.key
          name: linstor-client-https-cert
  image: {{ include "helm_lib_module_image" (list . "linstorWaitUntil") }}
  imagePullPolicy: IfNotPresent
  name: linstor-wait-node-online
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
{{- end }}
{{- end }}


{{- define "csi_node_metrics_proxy" }}
- name: kube-rbac-proxy
  {{- include "helm_lib_module_container_security_context_pss_restricted_flexible" dict | nindent 2 }}
  image: {{ include "helm_lib_module_common_image" (list . "kubeRbacProxy") }}
  imagePullPolicy: IfNotPresent
  args:
    - "--secure-listen-address=$(KUBE_RBAC_PROXY_LISTEN_ADDRESS):{{ .Values.sdsReplicatedVolume.internal.csiNodeMetricsPort }}"
    - "--v=2"
    - "--logtostderr=true"
    - "--stale-cache-interval=1h30m"
    - "--livez-path=/livez"
  env:
    - name: KUBE_RBAC_PROXY_LISTEN_ADDRESS
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: KUBE_RBAC_PROXY_CONFIG
      value: |
        excludePaths:
        - /livez
        upstreams:
        - upstream: http://127.0.0.1:{{ .Values.sdsReplicatedVolume.internal.csiNodeMetricsPort }}/metrics
          path: /metrics
          authorization:
            resourceAttributes:
              namespace: d8-{{ .Chart.Name }}
              apiGroup: apps
              apiVersion: v1
              resource: daemonsets
              subresource: prometheus-metrics
              name: csi-node
  ports:
    - name: https-metrics
      containerPort: {{ .Values.sdsReplicatedVolume.internal.csiNodeMetricsPort }}
      protocol: TCP
  livenessProbe:
    httpGet:
      path: /livez
      port: {{ .Values.sdsReplicatedVolume.internal.csiNodeMetricsPort }}
      scheme: HTTPS
  {{- /* No readinessProbe on purpose: a container that only serves metrics must not be
         able to take this pod out of the endpoints of anything that selects it. */}}
  resources:
    requests:
      {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 6 }}
{{- if not (include "helm_lib_api_version_exists" (list . "autoscaling.k8s.io/v1/VerticalPodAutoscaler")) }}
      {{- include "helm_lib_container_kube_rbac_proxy_resources" . | nindent 6 }}
{{- end }}
{{- end }}



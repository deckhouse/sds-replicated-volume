###
### node
###

{{- define "csi_node_args" }}
{{- if not .Values.sdsReplicatedVolume.internal.newControlPlane }}
- --csi-endpoint=unix://$(CSI_ENDPOINT)
- --node=$(KUBE_NODE_NAME)
- --linstor-endpoint=$(LS_CONTROLLERS)
- --log-level=info
{{- end }}

{{- if and .Values.sdsReplicatedVolume.internal.newControlPlane (not (has (default "" .Values.sdsReplicatedVolume.internal.controlPlaneMigration) (list "not_started" "stage1_started" "stage1_completed"))) }}
- --csi-endpoint=unix://$(CSI_ADDRESS)
{{- end }}
{{- end }}


{{- define "csi_node_envs" }}
{{- if not .Values.sdsReplicatedVolume.internal.newControlPlane }}
- name: CSI_ENDPOINT
  value: /csi/csi.sock
- name: DRIVER_REG_SOCK_PATH
  value: /var/lib/kubelet/plugins/replicated.csi.storage.deckhouse.io/csi.sock
- name: KUBE_NODE_NAME
  valueFrom:
    fieldRef:
      apiVersion: v1
      fieldPath: spec.nodeName
- name: LS_CONTROLLERS
  value: https://linstor.d8-sds-replicated-volume.svc:3371
- name: LS_ROOT_CA
  valueFrom:
    secretKeyRef:
      key: ca.crt
      name: linstor-client-https-cert
- name: LS_USER_CERTIFICATE
  valueFrom:
    secretKeyRef:
      key: tls.crt
      name: linstor-client-https-cert
- name: LS_USER_KEY
  valueFrom:
    secretKeyRef:
      key: tls.key
      name: linstor-client-https-cert
{{- end }}

{{- if and .Values.sdsReplicatedVolume.internal.newControlPlane (not (has (default "" .Values.sdsReplicatedVolume.internal.controlPlaneMigration) (list "not_started" "stage1_started" "stage1_completed"))) }}
- name: CSI_ADDRESS
  value: /csi/csi.sock
- name: DRIVER_REG_SOCK_PATH
  value: /var/lib/kubelet/plugins/replicated.csi.storage.deckhouse.io/csi.sock
- name: KUBE_NODE_NAME
  valueFrom:
    fieldRef:
      fieldPath: spec.nodeName
- name: LOG_LEVEL
  value: {{ include "helm_lib_module_controller_log_level" (list . "sdsReplicatedVolume") | quote }}
{{- /* Only this branch runs our own driver; the legacy branch is LINSTOR's CSI. The
       DaemonSet is hostNetwork, so this number is node-level and registered in the
       Deckhouse port reference; the kube-rbac-proxy of this pod publishes the same
       number on the node address, which is a different socket.

       Note what loopback does and does not buy here: in hostNetwork it is the NODE's
       loopback, so the endpoint is unreachable from off the node but stays open,
       unauthenticated, to anything in the node's network namespace. */}}
- name: METRICS_BIND_ADDRESS
  value: "127.0.0.1:{{ .Values.sdsReplicatedVolume.internal.csiNodeMetricsPort }}"
{{- end }}
{{- end }}



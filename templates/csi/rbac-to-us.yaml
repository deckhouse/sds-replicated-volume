{{- if and .Values.sdsReplicatedVolume.internal.newControlPlane (not (has (default "" .Values.sdsReplicatedVolume.internal.controlPlaneMigration) (list "not_started" "stage1_started" "stage1_completed"))) }}
---
{{- /*
  Reaching the CSI operation metrics means holding "get" on the prometheus-metrics
  subresource of the workload that serves them. Only the Prometheus scraper is given
  it; the kube-rbac-proxy in each pod checks it on every scrape.

  Two rules, because the two pods are two workloads: the CSI controller is a
  Deployment and the CSI node is a DaemonSet.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: access-to-csi-prometheus-metrics
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "csi-controller")) | nindent 2 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/prometheus-metrics"]
    resourceNames: ["csi-controller"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["daemonsets/prometheus-metrics"]
    resourceNames: ["csi-node"]
    verbs: ["get"]
{{- if (.Values.global.enabledModules | has "prometheus") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: access-to-csi-prometheus-metrics
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "csi-controller")) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: access-to-csi-prometheus-metrics
subjects:
  - kind: User
    name: d8-monitoring:scraper
  - kind: ServiceAccount
    name: prometheus
    namespace: d8-monitoring
{{- end }}
{{- end }}

{{- if and (not .Values.sdsReplicatedVolume.internal.newControlPlane) (.Values.global.enabledModules | has "admission-policy-engine-crd") }}
---
apiVersion: deckhouse.io/v1alpha1
kind: SecurityPolicyException
metadata:
  name: linstor-controller
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "linstor-controller")) | nindent 2 }}
spec:
  securityContext:
    runAsUser:
      allowedValues:
        - 0
      metadata:
        description: |
          Allow running as root (UID 0) for the linstor-controller container.
          The LINSTOR controller uses the same root-owned image as the satellite and has only ever run as root. It drops all capabilities, so root gives it nothing beyond the ownership of its own files.
    runAsNonRoot:
      allowedValue: false
      metadata:
        description: |
          Allow running as root for the linstor-controller container.
          The LINSTOR controller uses the same root-owned image as the satellite and has only ever run as root. It drops all capabilities.
{{- end }}

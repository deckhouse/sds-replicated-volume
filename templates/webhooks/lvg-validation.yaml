{{- /* Keeps a thin pool a ReplicatedStoragePool or a ReplicatedStorageClass uses in
       spec.thinPools of its LVMVolumeGroup. Rendered in both control planes: the
       webhook Service is named the same in each. Written out rather than through
       helm_lib_module_validating_webhook_configuration, which has no failurePolicy:
       an unavailable webhook of this module must not block sds-node-configurator. */}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: d8-{{ .Chart.Name }}-lvg-validation
  annotations:
    werf.io/deploy-dependency-webhooks: state=ready,kind=Deployment,name=webhooks,namespace=d8-{{ .Chart.Name }}
    werf.io/deploy-dependency-service: state=present,kind=Service,name=webhooks,namespace=d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
webhooks:
  - name: d8-{{ .Chart.Name }}-lvg-validation.storage.deckhouse.io
    rules:
      - apiGroups: ["storage.deckhouse.io"]
        apiVersions: ["v1alpha1"]
        operations: ["UPDATE"]
        resources: ["lvmvolumegroups"]
        scope: "Cluster"
    clientConfig:
      service:
        namespace: d8-{{ .Chart.Name }}
        name: webhooks
        path: /lvg-validate
      caBundle: {{ .Values.sdsReplicatedVolume.internal.customWebhookCert.ca | b64enc | quote }}
    admissionReviewVersions: ["v1", "v1beta1"]
    failurePolicy: Ignore
    sideEffects: None
    timeoutSeconds: 5

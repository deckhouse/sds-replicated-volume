{{- if .Values.sdsReplicatedVolume.internal.newControlPlane }}
---
apiVersion: v1
kind: Service
metadata:
  name: webhooks
  namespace: d8-{{ .Chart.Name }}
  annotations:
    werf.io/deploy-dependency-controller: state=ready,kind=Deployment,name=controller,namespace=d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "controller" )) | nindent 2 }}
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: webhooks
      protocol: TCP
      name: http
  selector:
    app: controller
{{- end }}
rules:
- apiGroups:
  - storage.deckhouse.io
  resources:
  - drbdmappers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.deckhouse.io
  resources:
  - drbdnodeoperations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.deckhouse.io
  resources:
  - drbdresourceoperations
  verbs:
  - get
  - list

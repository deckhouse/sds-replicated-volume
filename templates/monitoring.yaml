{{- /* Dashboards are gated by control plane: LINSTOR dashboards live in a separate root,
       so only one set is rendered. Folder and resource names are derived relative to the root,
       so they stay the same as with helm_lib_grafana_dashboard_definitions. */ -}}
{{- if .Values.global.enabledModules | has "prometheus" }}
  {{- if .Values.sdsReplicatedVolume.internal.newControlPlane }}
{{- include "helm_lib_grafana_dashboard_definitions_recursion" (list . "monitoring/grafana-dashboards") }}
  {{- else }}
{{- include "helm_lib_grafana_dashboard_definitions_recursion" (list . "monitoring/linstor-grafana-dashboards") }}
  {{- end }}
{{- end }}
{{- $otherControlPlaneRules := list "monitoring/prometheus-rules/replicated-storage-pool-capacity.yaml" }}
{{- if .Values.sdsReplicatedVolume.internal.newControlPlane }}
  {{- $otherControlPlaneRules = list "monitoring/prometheus-rules/linstor-storage-pools.yaml" }}
{{- end }}
{{- $rules := list }}
{{- range $path, $_ := .Files.Glob "monitoring/prometheus-rules/**.{yaml,tpl}" }}
  {{- if not (has $path $otherControlPlaneRules) }}
    {{- $rules = append $rules $path }}
  {{- end }}
{{- end }}
{{- include "helm_lib_prometheus_rules" (list . "d8-sds-replicated-volume" $rules) }}

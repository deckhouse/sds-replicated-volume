    # distributed under the License is distributed on an "AS IS" BASIS,
    # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    # See the License for the specific language governing permissions and
    # limitations under the License.

    rebuild_initramfs_with_drbd() {
      local boot_dir="$1"
      local modules_dir="$2"
      local kernel_dir kernel image contents
      for kernel_dir in "$modules_dir"/*/; do
        kernel="$(basename "$kernel_dir")"
        for image in "${boot_dir}/initramfs-${kernel}.img" "${boot_dir}/initrd.img-${kernel}"; do
          if [ ! -f "$image" ] || ! contents="$(lsinitrd "$image" 2>/dev/null)"; then
            continue
          fi
          if ! grep -q 'usr/lib/dracut/' <<< "$contents" || ! grep -Eq '/drbd\.ko' <<< "$contents"; then
            continue
          fi
          bb-log-info "${image} carries a DRBD kernel module, rebuilding it without one"
          if ! dracut -f "$image" "$kernel"; then
            bb-log-warning "dracut failed to rebuild ${image}, so the node may still load DRBD from it at boot"
          fi
        done
      done
    }

    if ! command -v dracut >/dev/null 2>&1; then
      exit 0
    fi

    mkdir -p /etc/dracut.conf.d
    bb-sync-file /etc/dracut.conf.d/d8_drbd.conf - <<< 'omit_drivers+=" drbd "'

    if command -v lsinitrd >/dev/null 2>&1; then
      rebuild_initramfs_with_drbd /boot /lib/modules
    fi

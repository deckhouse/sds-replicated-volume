{{- if .Values.sdsReplicatedVolume.internal.newControlPlane }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-replicated-volume-controller")) | nindent 2 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:{{ .Chart.Name }}:controller
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-replicated-volume-controller")) | nindent 2 }}
rules:
  # --- storage.deckhouse.io: read + patch (finalizers, labels) ---
  - apiGroups: ["storage.deckhouse.io"]
    resources:
      - replicatedstorageclasses
      - replicatedvolumes
      - replicatedvolumeattachments
    verbs: ["get", "list", "watch", "patch"]

  # --- storage.deckhouse.io: full lifecycle (create, patch, delete) ---
  - apiGroups: ["storage.deckhouse.io"]
    resources:
      - replicatedstoragepools
      - replicatedvolumereplicas
      - drbdresources
      - lvmlogicalvolumes
    verbs: ["get", "list", "watch", "create", "patch", "delete"]

  # --- storage.deckhouse.io: read + create + delete (no patch) ---
  - apiGroups: ["storage.deckhouse.io"]
    resources:
      - drbdresourceoperations
      - drbdnodeoperations
    verbs: ["get", "list", "watch", "create", "delete"]

  # --- storage.deckhouse.io: read-only ---
  - apiGroups: ["storage.deckhouse.io"]
    resources:
      - lvmvolumegroups
    verbs: ["get", "list", "watch"]

  # --- storage.k8s.io: StorageClass lifecycle ---
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get", "list", "watch", "create", "patch", "delete"]

  # --- storage.deckhouse.io: status subresources ---
  - apiGroups: ["storage.deckhouse.io"]
    resources:
      - replicatedstorageclasses/status
      - replicatedstoragepools/status
      - replicatedvolumes/status
      - replicatedvolumereplicas/status
      - replicatedvolumeattachments/status
    verbs: ["patch"]

  # --- Nodes: read + patch labels ---
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d8:{{ .Chart.Name }}:controller
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-replicated-volume-controller")) | nindent 2 }}
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: d8-{{ .Chart.Name }}
roleRef:
  kind: ClusterRole
  name: d8:{{ .Chart.Name }}:controller
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: controller
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-replicated-volume-controller")) | nindent 2 }}
rules:
  # --- Pods: read-only (agent readiness checks) ---
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # --- Leader election: specific Lease ---
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["sds-replicated-volume-controller"]
    verbs: ["get", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]

  # --- Events: leader election event recording ---
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controller
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-replicated-volume-controller")) | nindent 2 }}
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: d8-{{ .Chart.Name }}
roleRef:
  kind: Role
  name: controller
  apiGroup: rbac.authorization.k8s.io

---
{{- /*
  The controller records Events on ReplicatedStorageClass and
  ReplicatedStoragePool through events.k8s.io/v1. Both kinds are cluster-scoped,
  and the Event of a cluster-scoped object is created in the default namespace:
  client-go creates it there and patches it on a repeat. The core "events" rule
  above covers only the module namespace and the core API group, where leader
  election records.
*/}}
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: d8:{{ .Chart.Name }}:controller:events
  namespace: default
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-replicated-volume-controller")) | nindent 2 }}
rules:
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: d8:{{ .Chart.Name }}:controller:events
  namespace: default
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-replicated-volume-controller")) | nindent 2 }}
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: d8-{{ .Chart.Name }}
roleRef:
  kind: Role
  name: d8:{{ .Chart.Name }}:controller:events
  apiGroup: rbac.authorization.k8s.io

---
{{- /*
  The controller answers every scrape of its metrics port by asking the API
  server who the caller is (TokenReview) and whether they hold get on the
  prometheus-metrics subresource (SubjectAccessReview). Both verbs live in
  d8:rbac-proxy. Without this binding the scrape fails closed with 401 while
  the pod stays Ready, so the only symptom is up == 0 on the module's job and a
  TargetDown that never clears.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d8:{{ .Chart.Name }}:controller-rbac-proxy
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-replicated-volume-controller")) | nindent 2 }}
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: d8-{{ .Chart.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: d8:rbac-proxy
{{- end }}

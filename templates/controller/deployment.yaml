{{- if .Values.sdsReplicatedVolume.internal.newControlPlane }}
{{- $config := dict
  "valuesKey" "sdsReplicatedVolume"
  "onMasterNode" true
  "priorityClass" "cluster-medium"
  "controllerMaxMemory" "100Mi"
  "controllerMetricsPort" (int .Values.sdsReplicatedVolume.internal.controllerMetricsPort)
  "controllerMetricsProxyPort" (int .Values.sdsReplicatedVolume.internal.controllerMetricsProxyPort)
  "controllerMetricsInProcessAuthorization" true
  "additionalControllerEnvs" (list
    (dict "name" "POD_NAMESPACE" "valueFrom" (dict "fieldRef" (dict "fieldPath" "metadata.namespace")))
    (dict "name" "SCHEDULER_EXTENDER_URL" "value" "https://sds-common-scheduler-extender.d8-sds-node-configurator.svc:8099")
    (dict "name" "DATA_NODE_SELECTOR" "value" (.Values.sdsReplicatedVolume.dataNodes.nodeSelector | toJson))
    (dict "name" "STORAGE_CLASS_LABEL_IGNORED_PREFIXES" "value" (concat (default (list) .Values.sdsReplicatedVolume.internal.storageClassLabelIgnoredPrefixesSystem) (default (list) .Values.sdsReplicatedVolume.storageClassLabelIgnoredPrefixes) | uniq | toJson))
    (dict "name" "NEW_CONTROL_PLANE" "value" "true")
    (dict "name" "WEBHOOKS_BIND_ADDRESS" "value" ":9443")
    (dict "name" "WEBHOOKS_CERT_DIR" "value" "/etc/webhook/certs"))
  "additionalControllerPorts" (list
    (dict "containerPort" 9443 "name" "webhooks" "protocol" "TCP"))
  "additionalControllerVolumeMounts" (list
    (dict "name" "webhook-certs" "mountPath" "/etc/webhook/certs" "readOnly" true))
  "additionalVolumes" (list
    (dict "name" "webhook-certs" "secret" (dict "secretName" "webhooks-https-certs")))
}}
{{- include "helm_lib_module_controller_manifests" (list . $config) }}
{{- end }}

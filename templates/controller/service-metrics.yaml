{{- if .Values.sdsReplicatedVolume.internal.newControlPlane }}
{{- if (include "helm_lib_api_version_exists" (list . "monitoring.coreos.com/v1/ServiceMonitor")) }}
---
apiVersion: v1
kind: Service
metadata:
  name: controller-metrics
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list $ (dict "app" "controller")) | nindent 2 }}
spec:
  clusterIP: None
  selector:
    app: controller
  ports:
  # The proxy's port, not the controller's: the controller keeps its metrics on
  # 127.0.0.1 and only the kube-rbac-proxy of the pod can reach them.
  - name: https-metrics
    port: {{ .Values.sdsReplicatedVolume.internal.controllerMetricsProxyPort }}
    targetPort: https-metrics
    protocol: TCP
{{- end }}
{{- end }}

date: "2026-11-24"

summary: "DRBD replicas of the new control plane connect on kernels without `crct10dif-pclmul`, a node boots with DRBD 9 after a kernel update in the LINSTOR control plane and with a `dracut` initramfs, a replica that failed to schedule is placed once space is freed, and the `controller` Pod of the new control plane starts on clusters with `ContainerdV2` and the `erofs` snapshotter."

highlights:
  - "In the new control plane, DRBD connections use `crc32c` for online verification, so replicas on kernels without the `crct10dif-pclmul` driver, such as 7.0, no longer fail with `VERIFYAlgNotAvail` and join their volumes."
  - "A node no longer boots with an outdated DRBD: in the LINSTOR control plane DRBD 9 is built for a newly installed kernel before the reboot, and `dracut` no longer puts the `drbd` module into the initramfs."
  - "In the new control plane, the `controller` Pod no longer stays in `CrashLoopBackOff` with `read-only file system` on clusters with `ContainerdV2` and the `erofs` snapshotter (DKP CSE, or DKP with `defaultCRI: ContainerdV2`)."

fixes:
  - "In the new control plane, DRBD connections now use `crc32c` as the online-verify algorithm instead of `crct10dif-pclmul`. Kernels that no longer provide the `crct10dif-pclmul` driver (such as 7.0) rejected every new connection with `VERIFYAlgNotAvail`, so a replica on such a node never joined its volume and volumes with more than one replica, or a tie-breaker, on that node stayed in formation. Existing connections switch to `crc32c` in place."
  - "In the LINSTOR control plane, the `NodeGroupConfiguration` script that builds DRBD now also builds it for every installed kernel that is newer than the running one and lacks the required DRBD version, and it no longer removes the headers packages of installed kernels, only those of kernels that are gone. Before, DRBD was built only for the running kernel, so the first boot into a new kernel loaded the DRBD that came with it (8.4 on RED OS) or none, and the node stayed without DRBD 9 until bashible ran again, which waits for update approval. Now a kernel installed by a `NodeGroupConfiguration` script gets DRBD in the same bashible run, before the reboot. A failure to build for such a kernel is a warning in the bashible log and does not stop the run; DRBD is then built after the node boots into that kernel, as before. On ALT Linux only the newest kernel of each flavour is handled, since the headers package exists only for it."
  - "A node whose initramfs is built by `dracut` (RED OS, Rocky Linux and other RHEL-like systems, or Debian and Ubuntu with `dracut` installed) no longer loads an outdated DRBD from the initramfs at boot. `dracut` put the `drbd` module into the initramfs because of `/etc/modules-load.d/d8_drbd.conf`: the in-tree DRBD 8.4 when the image was built before DRBD 9 had been built for the kernel, or the DRBD 9 of that moment, which an update of the module made outdated. That module was loaded before the root file system was mounted, and only the DRBD installation script of `bashible` replaced it, which does not run while a node update waits for approval (`approvalMode: Manual`). A new `NodeGroupConfiguration` script, `drbd-initramfs.sh`, adds `/etc/dracut.conf.d/d8_drbd.conf`, which leaves `drbd` out of the initramfs, and once rebuilds with `dracut` every initramfs of an installed kernel that carries a DRBD module, so the node loads the DRBD 9 built for its kernel from `/lib/modules` after the root is mounted. The first boot into a newly installed kernel still loads the DRBD that comes with that kernel, if it has one, until `bashible` builds DRBD 9 for it. `srv-node-cleanup.sh` removes the new file as well."
  - "In the new control plane, a replica that could not be placed (a `ReplicatedVolumeReplica` with `Scheduled=False` and the `SchedulingFailed` reason) is now checked again every 30 seconds, so it is placed once space is freed on a suitable node. Before, it stayed unplaced until something else changed in its volume or `ReplicatedStoragePool`, or the controller restarted."
  - "In the new control plane, the `controller` Pod now starts on clusters with `ContainerdV2` and the `erofs` snapshotter (DKP CSE, or DKP with `defaultCRI: ContainerdV2`): its image contains the `/etc/webhook/certs` mount point, so the container no longer fails with `read-only file system` and no longer stays in `CrashLoopBackOff`."

docs:
  - "The FAQ explains how to take a node with DRBD replicas out of the cluster: that draining and rebooting keep the data, that a volume whose only up-to-date replica is on the node loses its data, how to move the replicas off the node with `evict.sh` in the LINSTOR control plane, and how to check in the new control plane that every volume of the node has an up-to-date replica on another node."

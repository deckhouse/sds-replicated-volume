date: "2026-xx-xx"
summary: ""
highlights: []

new_features:
  - "A script, `srv-node-cleanup.sh`, cleans a node of DRBD and of the module's volumes when the cluster is unavailable, for both control planes. It brings DRBD resources down, unloads the `drbd` kernel modules, removes the module's files and its edits of `lvm.conf`, and, with `--delete-volumes` and `--vg`, removes the module's logical volumes from the named volume groups only. By default it is a dry run that prints what it would do, and it never touches volume groups, physical volumes or thin pools. The text of the script and the procedure are in the FAQ section \"How do I clean a node of DRBD and module volumes when the cluster is unavailable?\"."
  - "In the new control plane, four alerts warn that a storage pool is running out of space, as the `D8LinstorStoragePoolFreeCapacityLessThen*` alerts do in the LINSTOR control plane: `D8ReplicatedStoragePoolFreeCapacityLessThan20Percent`, `D8ReplicatedStoragePoolFreeCapacityLessThan10Percent`, `D8ReplicatedStoragePoolFreeCapacityLessThan5Percent` and `D8ReplicatedStoragePoolFreeCapacityLessThan1Percent` fire when an LVMVolumeGroup of a `ReplicatedStoragePool` has had less than 20%, 10%, 5% and 1% free for 5 minutes. For an `LVMThin` pool they check the free space of the thin pool and fire with severities 6, 4, 3 and 1; for an `LVM` (thick) pool, the free space of the volume group, with 7, 6, 5 and 4. The alerts are built on the `sds_node_configurator_lvg_*` metrics of the sds-node-configurator agent and carry the `storage_pool`, `node` and `lvg_name` labels, and `thin_pool` for a thin pool. The `D8LinstorStoragePoolFreeCapacityLessThen*` rules are no longer deployed with the new control plane, which has no LINSTOR metrics for them."

improvements:
  - "In the new control plane, the `StorageClass` created for a `ReplicatedStorageClass` now carries the labels of that `ReplicatedStorageClass`, as in the LINSTOR control plane and in the other storage modules, so a `ClusterResourceGrantPolicy` can select the class by `allowedSelector` and `deniedSelector`; the labels are set on the `ReplicatedStorageClass`, because the webhook does not accept label changes on the `StorageClass`. Labels whose keys start with a prefix from `storageClassLabelIgnoredPrefixes` (the system list and the one in the `ModuleConfig`) are not copied, `storage.deckhouse.io/managed-by: sds-replicated-volume` cannot be overridden, a label removed from the `ReplicatedStorageClass` leaves the `StorageClass`, and a change of labels updates the `StorageClass` in place without recreating it."
  - "In the LINSTOR control plane, the `D8LinstorStoragePoolFreeCapacityLessThen*` alerts fire with a lower severity for an `LVM` (thick) storage pool: 7, 6, 5 and 4 at less than 20%, 10%, 5% and 1% free, instead of 6, 4, 3 and 1. A thick volume takes all of its space when it is created, so a full thick pool stops new volumes, new replicas and volume growth; unlike a full thin pool, it does not stop writes to the existing volumes. The severities of `LVMThin` pools are unchanged, and so are the names and labels of the alerts."

fixes:
  - "DRBD is now built on Debian and Rocky Linux nodes booted into a kernel whose headers have already left the distribution repositories, for example a node created from an older cloud image. On Debian the `NodeGroupConfiguration` script now looks the `linux-headers` package of the running kernel up on `snapshot.debian.org` and installs it through a temporary source that `apt` still verifies with the Debian archive keys; on Rocky Linux it downloads the `kernel-devel` package from the Rocky Linux vault and installs it with the RPM signature check. If the headers are not there either, the script fails with an error that names the package and says what to do; before, the only trace was the `apt` or `dnf` message that the package could not be found."
  - "A `VolumeSnapshot` of a `PersistentVolumeClaim` in a class with an `LVM` (thick) pool, a claim restored from a `VolumeSnapshot` into such a class and a clone of a claim from or into such a class are now rejected on creation with a message that names the `StorageClass`, its pool and the `LVMThin` requirement. Before, they were accepted and the CSI driver retried them forever, since snapshots, and clones made through them, exist only in thin pools. The pool type is `spec.type` of the `ReplicatedStoragePool` in the LINSTOR control plane and `spec.storage.type` of the `ReplicatedStorageClass` in the new control plane. A `VolumeSnapshot` bound to an existing `VolumeSnapshotContent` is not checked."
  - "The `StorageClass` of a `ReplicatedStorageClass` with an `LVM` (thick) pool no longer has the `storage.deckhouse.io/volumesnapshotclass` annotation, so `storage-foundation` no longer fills in the module's `VolumeSnapshotClass` for snapshots of its volumes; classes with an `LVMThin` pool keep it."
  - "In the LINSTOR control plane, a `ReplicatedStorageClass` with `replication: None` now sets `auto-quorum` to `disabled` and `auto-add-quorum-tiebreaker` to `false` in its `StorageClass`, and the controller sets `auto-quorum: disabled` on the LINSTOR resource group of existing single-replica classes. A single copy cannot split the brain, but a disconnected diskless peer used to turn quorum on and suspend I/O on a healthy replica. Existing single-replica volumes lose quorum when LINSTOR next recalculates their resource definition."
  - "In the new control plane, a `ReplicatedStorageClass` with the `Ignored` topology is rejected while the cluster has nodes labeled `topology.kubernetes.io/zone`, and one with the `Zonal` or `TransZonal` topology is rejected while it has none, as in the LINSTOR control plane. A class that already holds such a topology stays editable, and its volumes are not touched: the controller reports the mismatch in the `Ready` condition (`InsufficientEligibleNodes`, or `Degraded` when the configuration is already in effect)."

security:
  - "The webhook that allows only listed service accounts to create a `ReadWriteMany` `PersistentVolumeClaim` in a class of the module now reads the class the way Kubernetes does: from the `volume.beta.kubernetes.io/storage-class` annotation first, then from `spec.storageClassName`. Before, a claim could name a class of the module in the annotation and another class in `spec`, pass the check and get a volume of the module. A claim with `storageClassName: \"\"` asks for no class and is no longer checked against the default class, and of several default classes the newest is taken, as Kubernetes does."
  - "The `user-authz` roles of the module no longer let `User` read the internal resources of the new control plane or `ClusterEditor` change them: `ReplicatedVolume`, `ReplicatedVolumeReplica`, `ReplicatedVolumeAttachment`, `DRBDResource`, `DRBDMapper`, `DRBDResourceOperation` and `DRBDNodeOperation`. The CSI driver, the controller and the agent create and keep them, and `ReplicatedVolume` and `DRBDResource` hold the DRBD shared secret of every volume, which any `User` could read. `ReplicatedVolume` and `DRBDResource` are now read from `ClusterAdmin` up and the other five from `ClusterEditor` up; `ClusterAdmin` creates and deletes the DRBD maintenance operations, `DRBDResourceOperation` and `DRBDNodeOperation`, and nobody but `SuperAdmin` changes the rest. In the RBACv2 role model the viewer of the storage subsystem no longer has them, the manager only reads the five that hold no secret, and the superadmin reads `ReplicatedVolume` and `DRBDResource` and creates and deletes the DRBD maintenance operations."

docs:
  - "The documentation names the `storage-foundation` module, not `snapshot-controller`, as the module that volume snapshots require, and no longer asks to enable `snapshot-controller`."
  - "The link to the section on evicting DRBD resources from a node in the FAQ section about cleaning a node when the cluster is unavailable now leads to the section."
  - "The description of `dataNodes` in the module settings no longer mentions LINSTOR: it names the node agent of the current control plane and the CSI node, and says that replicas are placed only on the nodes of a `ReplicatedStoragePool` that carry the `dataNodes` label."

upgrade_notes:
  - "On update, the module removes the `storage.deckhouse.io/volumesnapshotclass` annotation from existing `StorageClass` objects of classes with an `LVM` (thick) pool, a value set by hand included; the `StorageClass` is updated in place and not recreated, and its volumes are not affected. A `VolumeSnapshot` of such a volume that names no `volumeSnapshotClassName` no longer gets the module's class."
  - "The `user-authz` access to the module changes. `User` through `Admin` no longer read `ReplicatedVolume`, `ReplicatedVolumeReplica`, `ReplicatedVolumeAttachment`, `DRBDResource`, `DRBDMapper`, `DRBDResourceOperation` and `DRBDNodeOperation`. `ClusterEditor` reads `ReplicatedVolumeReplica`, `ReplicatedVolumeAttachment`, `DRBDMapper`, `DRBDResourceOperation` and `DRBDNodeOperation`, but no longer changes them, and no longer reads or changes `ReplicatedVolume` and `DRBDResource`. `ClusterAdmin` reads all seven and creates and deletes `DRBDResourceOperation` and `DRBDNodeOperation`, the DRBD maintenance operations such as `ForcePrimary`, `Invalidate`, `CreateNewUUID` and `UpdateDRBD`, but no longer changes the other five; only `SuperAdmin` does. In the RBACv2 role model the viewer of the storage subsystem no longer has these resources, the manager reads the same five as `ClusterEditor` and no longer changes any, and from DKP 1.78 the superadmin reads `ReplicatedVolume` and `DRBDResource` and creates and deletes the DRBD maintenance operations through the `d8:system-capability:sds-replicated-volume:superadmin` capability. `ReplicatedStorageClass` and `ReplicatedStoragePool` keep their levels: `User` reads them, `ClusterEditor` changes them. The pages of these resources in the console are shown only to subjects that can read them: `ClusterEditor` sees replicas and attachments, but not volumes."


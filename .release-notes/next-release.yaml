highlights: []
fixes:
  - "In the LINSTOR control plane, labels of a `ReplicatedStorageClass` whose keys match `storageClassLabelIgnoredPrefixes` (by default `argocd.argoproj.io/`, `kustomize.toolkit.fluxcd.io/`, `helm.toolkit.fluxcd.io/`, `fleet.cattle.io/`) or the system list (`app.kubernetes.io/managed-by`, `app.kubernetes.io/instance`) are again not copied to its StorageClass. Since v0.9.5 the list did not reach the controller of the LINSTOR control plane, so it copied every label, and the StorageClass inherited the tracking label of Argo CD and was shown as an extra resource of the application. After the update the controller removes such labels from existing StorageClasses without recreating them."


# Optional sections — delete rather than leave empty.
new_features:
  - "On DKP 1.78 and later, the module's access roles follow the capability/scope RBAC scheme: the ClusterRoles `d8:system-capability:sds-replicated-volume:view` and `d8:system-capability:sds-replicated-volume:edit` grant read-only and full access to `ReplicatedStorageClass`, `ReplicatedStoragePool`, `ReplicatedVolume`, `ReplicatedVolumeReplica`, `ReplicatedVolumeAttachment`, `DRBDResource`, `DRBDResourceOperation`, `DRBDNodeOperation` and `DRBDMapper`. Below 1.78 the module keeps the `d8:manage:permission:module:sds-replicated-volume:view` and `:edit` roles."
improvements:
  - "New alert `D8DrbdResourceIOSuspended` fires when a DRBD resource has had its I/O suspended for 5 minutes for a reason other than a lost quorum (no up-to-date replica reachable, fencing, or `drbdsetup suspend-io`). I/O to such a volume hangs instead of failing, and before only the loss of quorum raised an alert. The alert description shows how to find the reason and what to do."
  - "Removing a thin pool from `spec.thinPools` of an LVMVolumeGroup is now rejected while a ReplicatedStoragePool or a ReplicatedStorageClass uses that thin pool. sds-node-configurator removes a thin pool dropped from the spec once it is empty, and replicas would then be placed in a thin pool that is gone. The check does not block LVMVolumeGroup updates while the module's webhook is unavailable."
  - "During scheduling simulations of the Deckhouse kube-scheduler (filter and prioritize requests with `dryRun: true`), `linstor-scheduler-extender` no longer records `FailedScheduling` Events on the simulated Pod, so descheduler checks no longer leave false scheduling errors on running VM Pods."
fixes:
  - "In the new control plane, the controller no longer deletes a StorageClass of another provisioner that has the name of a `ReplicatedStorageClass`. It used to remove such a StorageClass and create its own in its place. Now it leaves the StorageClass alone, and the `ReplicatedStorageClass` goes to the `InvalidConfiguration` phase with `Ready=False`, reason `StorageClassConflict`, and a message naming the StorageClass and its provisioner. Once the name is free, the class gets its StorageClass within a minute."
  - "In the LINSTOR control plane, a `ReplicatedStorageClass` whose name is held by a StorageClass of another provisioner now goes to the `InvalidConfiguration` phase with a message naming the StorageClass and its provisioner. Before, the conflict was only written to the controller log and the status did not change."
# security: []
# breaking: []
upgrade_notes:
  - "On DKP 1.78 and later, the `d8:manage:permission:module:sds-replicated-volume:view` and `:edit` ClusterRoles are replaced by `d8:system-capability:sds-replicated-volume:view` and `:edit`. Bindings that reference the old role names directly have to be switched to the new ones."

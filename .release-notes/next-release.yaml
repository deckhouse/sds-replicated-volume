fixes:
  - "A node whose initramfs is built by `dracut` (RED OS, Rocky Linux and other RHEL-like systems, or Debian and Ubuntu with `dracut` installed) no longer loads an outdated DRBD from the initramfs at boot. `dracut` put the `drbd` module into the initramfs because of `/etc/modules-load.d/d8_drbd.conf`: the in-tree DRBD 8.4 when the image was built before DRBD 9 had been built for the kernel, or the DRBD 9 of that moment, which an update of the module made outdated. That module was loaded before the root file system was mounted, and only the DRBD installation script of `bashible` replaced it, which does not run while a node update waits for approval (`approvalMode: Manual`). A new `NodeGroupConfiguration` script, `drbd-initramfs.sh`, adds `/etc/dracut.conf.d/d8_drbd.conf`, which leaves `drbd` out of the initramfs, and once rebuilds with `dracut` every initramfs of an installed kernel that carries a DRBD module, so the node loads the DRBD 9 built for its kernel from `/lib/modules` after the root is mounted. The first boot into a newly installed kernel still loads the DRBD that comes with that kernel, if it has one, until `bashible` builds DRBD 9 for it. `srv-node-cleanup.sh` removes the new file as well."
docs:
  - "The FAQ explains how to take a node with DRBD replicas out of the cluster: that draining and rebooting keep the data, that a volume whose only up-to-date replica is on the node loses its data, how to move the replicas off the node with `evict.sh` in the LINSTOR control plane, and how to check in the new control plane that every volume of the node has an up-to-date replica on another node."

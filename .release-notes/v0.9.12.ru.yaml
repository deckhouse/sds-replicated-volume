date: "2026-10-14"

summary: "Старая плоскость управления перестала вызывать алерт StorageClass для `ReplicatedStorageClass` без `spec.replication`, DRBD снова собирается на узлах ALT Linux с вариантом ядра, отличным от `std-def`, migrator и spaas следуют уровню логирования модуля, а новая плоскость управления сохраняет кворум при подключении реплики с диском и сама завершает переход r2 → r3."

highlights:
  - "`ReplicatedStorageClass`, созданный без `spec.replication`, старый контроллер теперь тоже обрабатывает как `ConsistencyAndAvailability`: его StorageClass больше не помечается неработоспособным и не вызывает алерт StorageClass."
  - "На узлах ALT Linux с вариантом (flavour) ядра, отличным от `std-def` (например, ALT p11 с вариантом `6.12`), NodeGroupConfiguration для DRBD ставит заголовки работающего варианта ядра, и DRBD собирается, а не падает на отсутствующем пакете `kernel-headers-modules-std-def`."
  - "Настройка модуля `resyncSlotsPerNode`, которая действует только в новой плоскости управления, удалена, лимит ресинхронизаций зафиксирован на 4 на узел. Если настройка задана в ModuleConfig, удалите её до обновления."

improvements:
  - "Migrator плоскости управления и spaas берут уровень логирования из `logLevel` модуля, а не пишут логи всегда на уровне debug. При значении по умолчанию `Info` migrator логирует на уровне `info`, а spaas запускается без `--debug`."
  - "В новой плоскости управления метрики текущего состояния контроллера экспортирует только реплика-лидер, поэтому резервные реплики больше не публикуют дублирующиеся общекластерные ряды."
  - "В новой плоскости управления перевод `ReplicatedStorageClass` с `Availability` на `ConsistencyAndAvailability` завершается сам: после того как третья копия с диском становится `UpToDate`, лишний tie-breaker (диск-арбитр без данных) удаляется автоматически, и том больше не останавливается в `TransitionUnsupported` в ожидании ручного удаления."

fixes:
  - "Старый вебхук применяет проверку трёх зон для `TransZonal` и к `ReplicatedStorageClass` без `spec.replication`, поэтому ошибка отклоняется при применении, а не проявляется позже как `InvalidConfiguration`. Старый вебхук и валидация CRD также отклоняют `replication: Consistency` в старой плоскости управления, где для неё нет раскладки StorageClass. С уже существующих StorageClass, помеченных неработоспособными из-за пустого `replication`, метка снимается."
  - "CSI-узел новой плоскости управления отдаёт `/metrics`, `/healthz`, `/readyz` и `/health` только на своём loopback-адресе метрик. Он больше не слушает порт 8081 на всех интерфейсах, где конфликтовал с `capdvp-controller-manager` на master-узлах кластеров в DVP: запустившийся вторым уходил в crash loop, и такие кластеры нельзя было удалить."
  - "В новой плоскости управления подключение реплики с диском к тому больше не приводит к потере кворума и кратковременной приостановке ввода-вывода (`Ready=False`, причина `QuorumLost`). Агент повышает кворум только после того, как новый узел учитывается как голос, контроллер — только после того, как подключаемая реплика находится в состоянии `Connected` со всеми участниками, а голосующая реплика, которую видит в состоянии `Connected` узел с кворумом, считается доступной."
  - "В новой плоскости управления добавление реплики с диском больше не поднимает минимальную избыточность данных выше числа копий в состоянии `UpToDate`, пока новая копия ещё ресинхронизируется: раньше это приостанавливало ввод-вывод на всех репликах до конца ресинхронизации."
  - "В новой плоскости управления контроллер удаляет `ReplicatedVolumeReplica`, только если это всё ещё тот же объект, поэтому реплика, получившая имя удалённой, никогда не удаляется по ошибке."
  - "В новой плоскости управления проверка `TransZonal` у `ReplicatedStorageClass` требует непустой список `zones` с точным числом зон для выбранной избыточности, а требования к зонам проверяются отдельно от правил старой плоскости управления."

breaking:
  - "Настройка модуля `resyncSlotsPerNode`, которая действует только в новой плоскости управления, удалена из схемы конфигурации модуля. ModuleConfig, в котором она по-прежнему задана, после обновления не проходит валидацию."
  - "В новой плоскости управления `failuresToTolerate` и `guaranteedMinimumDataRedundancy` у `ReplicatedStorageClass` и в `spec.manualConfiguration` у `ReplicatedVolume` принимают значения не больше 1. Раскладки выше (4D, 4D+1TB, 5D) не допускаются; существующий ресурс с большим значением сообщает об ошибке валидации."

upgrade_notes:
  - "Перед обновлением удалите `settings.resyncSlotsPerNode` из ModuleConfig `sds-replicated-volume`, если настройка задана. Настройка действует только в новой плоскости управления: после обновления новая плоскость управления во всех кластерах ограничивает ресинхронизации четырьмя на узел, изменить или отключить этот лимит нельзя."
  - "На узлах ALT Linux, где раньше не удавалось собрать DRBD, ничего делать руками не нужно: при следующем запуске bashible поставит нужные заголовки и соберёт модуль."

docs:
  - "Документация модуля описывает выпущенную плоскость управления на LINSTOR: фаза `ReplicatedStorageClass` и `ReplicatedStoragePool` — `Ready`, а не `Created` или `Completed`, `spec` этих ресурсов нельзя изменить после создания, а расширение `ReplicatedStoragePool` на новые узлы выполняется пересозданием ресурса. Документация и CRD новой плоскости управления больше не показываются в документации модуля."
  - "Справочник CRD `ReplicatedStorageClass` и `ReplicatedStoragePool` отмечает поля, используемые только новой плоскостью управления, одинаково описывает общие поля на английском и русском языках и отмечает `replication` и `storagePool` как устаревшие только в новой плоскости управления."
  - "Исправлены примеры `ReplicatedStorageClass`: в примере HA-класса в русском руководстве `name` был вне `metadata`, а пример в FAQ больше не содержит `metadata.generation`."

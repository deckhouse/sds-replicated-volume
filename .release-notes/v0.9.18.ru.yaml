date: "2026-11-24"

summary: "Реплики DRBD в новом control plane подключаются на ядрах без `crct10dif-pclmul`, узел загружается с DRBD 9 после обновления ядра в LINSTOR control plane и с initramfs, собранным `dracut`, реплика, которую не удалось разместить, размещается, как только освобождается место, а под `controller` нового control plane запускается в кластерах с `ContainerdV2` и снапшоттером (snapshotter — механизм хранения слоёв образов контейнеров) `erofs`."

highlights:
  - "В новом control plane соединения DRBD используют для онлайн-проверки `crc32c`, поэтому реплики на ядрах без драйвера `crct10dif-pclmul`, например 7.0, больше не получают ошибку `VERIFYAlgNotAvail` и входят в свои тома."
  - "Узел больше не загружается с устаревшим DRBD: в LINSTOR control plane DRBD 9 собирается для только что установленного ядра до перезагрузки, а `dracut` больше не кладёт модуль `drbd` в initramfs."
  - "В новом control plane под `controller` больше не остаётся в `CrashLoopBackOff` с ошибкой `read-only file system` в кластерах с `ContainerdV2` и снапшоттером `erofs` (DKP CSE или DKP с `defaultCRI: ContainerdV2`)."

fixes:
  - "В новом control plane соединения DRBD теперь используют для онлайн-проверки алгоритм `crc32c` вместо `crct10dif-pclmul`. Ядра, в которых больше нет драйвера `crct10dif-pclmul` (например, 7.0), отклоняли каждое новое соединение с ошибкой `VERIFYAlgNotAvail`: реплика на таком узле не входила в том, и тома с несколькими репликами или с tie-breaker на этом узле оставались в формировании. Существующие соединения переходят на `crc32c` на месте."
  - "В LINSTOR control plane скрипт `NodeGroupConfiguration`, который собирает DRBD, теперь собирает его и для каждого установленного ядра новее запущенного, в котором нет нужной версии DRBD, и больше не удаляет пакеты заголовков установленных ядер — только тех, которых на узле уже нет. Раньше DRBD собирался только для запущенного ядра, поэтому при первой загрузке в новое ядро загружался DRBD из его состава (8.4 в RED OS) или никакой, и узел оставался без DRBD 9 до следующего запуска bashible, который ждёт подтверждения обновления. Теперь ядро, установленное скриптом `NodeGroupConfiguration`, получает DRBD в том же запуске bashible, до перезагрузки. Ошибка сборки для такого ядра — предупреждение в логе bashible, запуск не прерывается; тогда DRBD собирается после загрузки узла в это ядро, как раньше. В ALT Linux обрабатывается только самое новое ядро каждого варианта (flavour), потому что пакет заголовков есть только для него."
  - "Узел, initramfs которого собирает `dracut` (RED OS, Rocky Linux и другие RHEL-подобные системы, а также Debian и Ubuntu с установленным `dracut`), больше не загружает при старте устаревший DRBD из initramfs. `dracut` клал модуль `drbd` в initramfs из-за `/etc/modules-load.d/d8_drbd.conf`: встроенный в ядро DRBD 8.4, если образ собран раньше, чем DRBD 9 под это ядро, или DRBD 9 того момента, который устаревал при обновлении модуля. Этот модуль загружался до монтирования корневой файловой системы, а заменял его только скрипт установки DRBD в `bashible`, который не выполняется, пока обновление узла ждёт подтверждения (`approvalMode: Manual`). Новый скрипт `NodeGroupConfiguration` `drbd-initramfs.sh` добавляет `/etc/dracut.conf.d/d8_drbd.conf`, исключающий `drbd` из initramfs, и один раз пересобирает через `dracut` каждый initramfs установленного ядра, в котором есть модуль DRBD, поэтому узел загружает DRBD 9, собранный под его ядро, из `/lib/modules` после монтирования корня. При первой загрузке в только что установленное ядро по-прежнему загружается DRBD из состава этого ядра, если он там есть, пока `bashible` не соберёт под него DRBD 9. `srv-node-cleanup.sh` удаляет и новый файл."
  - "В новом control plane реплика, которую не удалось разместить (`ReplicatedVolumeReplica` с `Scheduled=False` и причиной `SchedulingFailed`), теперь проверяется повторно каждые 30 секунд и размещается, как только на подходящем узле освобождается место. Раньше она оставалась неразмещённой, пока не менялось что-то ещё в её томе или `ReplicatedStoragePool` либо не перезапускался контроллер."
  - "В новом control plane под `controller` теперь запускается в кластерах с `ContainerdV2` и снапшоттером `erofs` (DKP CSE или DKP с `defaultCRI: ContainerdV2`): в его образе есть точка монтирования `/etc/webhook/certs`, поэтому контейнер больше не падает с ошибкой `read-only file system` и не остаётся в `CrashLoopBackOff`."

docs:
  - "В FAQ описано, как вывести из кластера узел с репликами DRBD: что вытеснение подов и перезагрузка узла данные сохраняют, что том, единственная актуальная реплика которого находится на узле, теряет данные, как перенести реплики с узла скриптом `evict.sh` в control plane LINSTOR и как в новом control plane проверить, что у каждого тома узла есть актуальная реплика на другом узле."

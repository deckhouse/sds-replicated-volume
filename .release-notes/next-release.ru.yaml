docs:
  - "В FAQ описано, что происходит со снапшотами и восстановленными томами, когда один из них удаляют: снапшот тома LVMThin снимается на каждой реплике, удалять можно в любом порядке, восстановленный том не зависит ни от снапшота, ни от исходного тома, а свободное место, которое LINSTOR показывает для пула LVMThin, уже учитывает снапшоты."

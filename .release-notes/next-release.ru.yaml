date: "2026-xx-xx"
summary: ""
highlights: []

fixes:
  - "В новом control plane соединения DRBD теперь используют для онлайн-проверки алгоритм `crc32c` вместо `crct10dif-pclmul`. Ядра, в которых больше нет драйвера `crct10dif-pclmul` (например, 7.0), отклоняли каждое новое соединение с ошибкой `VERIFYAlgNotAvail`: реплика на таком узле не входила в том, и тома с несколькими репликами или с tie-breaker на этом узле оставались в формировании. Существующие соединения переходят на `crc32c` на месте."
  - "Скрипт `NodeGroupConfiguration`, который собирает DRBD, теперь собирает его и для каждого установленного ядра новее запущенного, в котором нет нужной версии DRBD, и больше не удаляет пакеты заголовков установленных ядер — только тех, которых на узле уже нет. Раньше DRBD собирался только для запущенного ядра, поэтому при первой загрузке в новое ядро загружался DRBD из его состава (8.4 в RED OS) или никакой, и узел оставался без DRBD 9 до следующего запуска bashible, который ждёт подтверждения обновления. Теперь ядро, установленное скриптом `NodeGroupConfiguration`, получает DRBD в том же запуске bashible, до перезагрузки. Ошибка сборки для такого ядра — предупреждение в логе bashible, запуск не прерывается; тогда DRBD собирается после загрузки узла в это ядро, как раньше. В ALT Linux обрабатывается только самое новое ядро каждого варианта (flavour), потому что пакет заголовков есть только для него."


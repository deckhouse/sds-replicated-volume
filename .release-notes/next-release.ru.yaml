upgrade_notes:
  - "В DKP 1.78 и новее ClusterRole `d8:manage:permission:module:sds-replicated-volume:view` и `:edit` заменяются на `d8:system-capability:sds-replicated-volume:view` и `:edit`. Привязки, которые ссылаются на старые имена ролей напрямую, нужно перевести на новые."

date: "2026-xx-xx"
summary: ""
highlights: []

# Необязательные разделы — пустые не оставлять, а удалять.
# new_features: []
improvements:
  - "Удаление thin pool из `spec.thinPools` LVMVolumeGroup теперь отклоняется, пока его использует ReplicatedStoragePool или ReplicatedStorageClass. sds-node-configurator удаляет убранный из spec thin pool, как только он опустел, и реплики размещались бы в thin pool, которого больше нет. Пока вебхук модуля недоступен, проверка не блокирует изменения LVMVolumeGroup."
  - "В симуляциях планирования kube-scheduler Deckhouse (запросы filter и prioritize с `dryRun: true`) `linstor-scheduler-extender` больше не записывает Events `FailedScheduling` на симулируемый под, поэтому проверки descheduler не оставляют ложных ошибок планирования на работающих подах ВМ."
fixes:
  - "В новой плоскости управления контроллер больше не удаляет StorageClass другого провижинера с именем `ReplicatedStorageClass`. Раньше он удалял такой StorageClass и создавал на его месте свой. Теперь он не трогает этот StorageClass, а `ReplicatedStorageClass` переходит в фазу `InvalidConfiguration` с `Ready=False`, причиной `StorageClassConflict` и сообщением, в котором названы StorageClass и его провижинер. Когда имя освободится, класс получит свой StorageClass в течение минуты."
  - "В старой плоскости управления на LINSTOR `ReplicatedStorageClass`, имя которого занято StorageClass другого провижинера, теперь переходит в фазу `InvalidConfiguration` с сообщением, в котором названы StorageClass и его провижинер. Раньше конфликт только записывался в лог контроллера, а статус не менялся."

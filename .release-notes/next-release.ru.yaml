# Заготовка для следующего релиза. Перед тегом переименовать в vX.Y.Z.ru.yaml
# (имя файла должно совпадать с тегом) и заполнить.
date: "2026-xx-xx"
summary: ""
highlights: []

# Необязательные разделы — пустые не оставлять, а удалять.
new_features:
  - "В DKP 1.78 и новее роли доступа модуля следуют схеме RBAC capability/scope (возможность/область действия): ClusterRole `d8:system-capability:sds-replicated-volume:view` и `d8:system-capability:sds-replicated-volume:edit` дают доступ только на чтение и полный доступ к `ReplicatedStorageClass`, `ReplicatedStoragePool`, `ReplicatedVolume`, `ReplicatedVolumeReplica`, `ReplicatedVolumeAttachment`, `DRBDResource`, `DRBDResourceOperation`, `DRBDNodeOperation` и `DRBDMapper`. В версиях ниже 1.78 модуль сохраняет роли `d8:manage:permission:module:sds-replicated-volume:view` и `:edit`."
  - "Новые алерты новой плоскости управления: `D8ReplicatedStoragePoolNotReady` срабатывает, когда `ReplicatedStoragePool` не в состоянии `Ready` 5 минут (нет LVMVolumeGroup или thin pool, неверный селектор узлов), а `D8ReplicatedStorageClassNotReady` — когда 5 минут не в состоянии `Ready` `ReplicatedStorageClass`. Класс, пул которого не в состоянии `Ready`, сообщается только алертом пула. У обоих severity 4, в описаниях перечислены причины и что проверить. Раньше такие пулы и классы были видны только в их статусе. Для них контроллер экспортирует новые метрики `sds_rsp_condition_problem_timestamp_seconds` и `sds_rsc_condition_problem_timestamp_seconds`."
  - "На дашборде Grafana `SDS Replicated Volume` новой плоскости управления появилась строка `Capacity by ReplicatedStorageClass`. Для каждого выбранного класса она показывает ёмкость и свободное место его пула хранения как без учёта репликации, так и в пересчёте на число реплик класса, заполнение thin-пулов (тонких пулов LVM) относительно `allocationLimit` и таблицу по узлам и LVMVolumeGroup. Thin-пулы считаются по лимиту выделения: свободное место — это размер thin-пула, умноженный на `allocationLimit`, за вычетом уже выделенного места. Для этого контроллер экспортирует новые метрики `sds_rsp_lvg_info` (LVMVolumeGroup и thin-пулы `ReplicatedStoragePool`) и `sds_rsc_replicas` (число реплик и пул хранения `ReplicatedStorageClass`), которые связывают метрики ёмкости sds-node-configurator с классами хранения."
improvements:
  - "Новый алерт `D8DrbdResourceIOSuspended` срабатывает, когда I/O DRBD-ресурса приостановлен 5 минут по причине, отличной от потери кворума (недоступна ни одна реплика с актуальными данными, fencing или `drbdsetup suspend-io`). I/O к такому тому зависает, а не завершается ошибкой, и раньше алерт был только на потерю кворума. В описании алерта сказано, как узнать причину и что делать."
  - "Удаление thin pool из `spec.thinPools` LVMVolumeGroup теперь отклоняется, пока его использует ReplicatedStoragePool или ReplicatedStorageClass. sds-node-configurator удаляет убранный из spec thin pool, как только он опустел, и реплики размещались бы в thin pool, которого больше нет. Пока вебхук модуля недоступен, проверка не блокирует изменения LVMVolumeGroup."
  - "В симуляциях планирования kube-scheduler Deckhouse (запросы filter и prioritize с `dryRun: true`) `linstor-scheduler-extender` больше не записывает Events `FailedScheduling` на симулируемый под, поэтому проверки descheduler не оставляют ложных ошибок планирования на работающих подах ВМ."
fixes:
  - "В новой плоскости управления контроллер больше не удаляет StorageClass другого провижинера с именем `ReplicatedStorageClass`. Раньше он удалял такой StorageClass и создавал на его месте свой. Теперь он не трогает этот StorageClass, а `ReplicatedStorageClass` переходит в фазу `InvalidConfiguration` с `Ready=False`, причиной `StorageClassConflict` и сообщением, в котором названы StorageClass и его провижинер. Когда имя освободится, класс получит свой StorageClass в течение минуты."
  - "В старой плоскости управления на LINSTOR `ReplicatedStorageClass`, имя которого занято StorageClass другого провижинера, теперь переходит в фазу `InvalidConfiguration` с сообщением, в котором названы StorageClass и его провижинер. Раньше конфликт только записывался в лог контроллера, а статус не менялся."
  - "`DeleteVolume` навсегда отказывал в удалении тома, если ReplicatedVolumeAttachment пережил VolumeAttachment своего узла: финализатор CSI-контроллера на нём снимает только `ControllerUnpublishVolume`, которую external-attacher после исчезновения VolumeAttachment больше не вызывает, и PersistentVolume оставался `Released`. Теперь `DeleteVolume` сначала освобождает такие attachment, если их устройство не используется."

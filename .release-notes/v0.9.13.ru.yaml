date: "2026-10-26"

summary: "Новая плоскость управления переводит том с r2 на r3, превращая его tie-breaker в третью копию на месте, сообщает алертами о томах, которые не находятся в состоянии `Ready` или `Resilient`, и получила переработанный дашборд Grafana; обе плоскости управления поставляют объекты `SecurityPolicyException`, которые DKP 1.79 требует для системных подов, а из образов модуля убраны уязвимости зависимостей, найденные сканером."

highlights:
  - "В новой плоскости управления перевод `ReplicatedStorageClass` с `Availability` на `ConsistencyAndAvailability` превращает tie-breaker (диск-арбитр без данных) каждого тома в его третью копию с диском на том же узле, поэтому переход завершается и ровно на трёх узлах хранения, где раньше он так и не сходился."
  - "В новой плоскости управления алерты `D8ReplicatedVolumeNotReady`, `D8ReplicatedVolumeNotResilient` и `D8SdsReplicatedVolumeCurrentMetricsUnavailable` сообщают о томах, которые не обслуживают ввод-вывод, о томах, которые не переживут следующий отказ, и о пропаже метрик, на которых построены эти алерты; дашборд «SDS Replicated Volume» открывается состоянием томов и списком проблемных."
  - "Модуль в обеих плоскостях управления поставляет `SecurityPolicyException` для каждой нагрузки, которой нужно больше, чем разрешает профиль `restricted`, поэтому его поды продолжат запускаться, когда в DKP 1.79 стандарты безопасности подов (Pod Security Standards) в системных пространствах имён перейдут от предупреждения к запрету."

new_features:
  - "Новые алерты новой плоскости управления: `D8ReplicatedVolumeNotReady` (уровень 4) срабатывает, если `ReplicatedVolume` не находится в состоянии `Ready` 5 минут, `D8ReplicatedVolumeNotResilient` (уровень 6) — если он 30 минут не находится в состоянии `Resilient`, оставаясь `Ready`, а `D8SdsReplicatedVolumeCurrentMetricsUnavailable` (уровень 6) — если контроллер-лидер 5 минут не экспортирует метрики текущего состояния и построенные на них алерты не могут сработать. Тома, которые ещё создаются, не учитываются. `D8ReplicatedVolumeNotResilient` срабатывает и тогда, когда том переходит на более высокую избыточность, а синхронизация новой копии длится дольше 30 минут."
  - "Новые метрики контроллера новой плоскости управления: `sds_rv_condition_count` и `sds_rv_condition_problem_timestamp_seconds` по условиям `ReplicatedVolume`, `sds_rv_created_total`, `sds_rvr_ready_lost_total`, `sds_metrics_collector_up`, возраст самых старых зависших объектов (`sds_deleting_oldest_timestamp_seconds`, `sds_rv_deleting_timestamp_seconds`, `sds_rv_datamesh_transition_oldest_timestamp_seconds`, `sds_rvr_not_ready_oldest_timestamp_seconds`) и метка `configuration_mode` (`Auto` или `Manual`) у `sds_rv_count`. Агент экспортирует `sds_drbd_module_info` с полной версией загруженного модуля ядра DRBD, включая суффикс сборки."

improvements:
  - "Дашборд Grafana «SDS Replicated Volume» новой плоскости управления переработан. Он открывается разделами Volume Health и Problem Volumes, где видны тома, которые не находятся в состоянии `Ready` или `Resilient`, находятся на обслуживании или удаляются, с моментом последней смены статуса их условия и временем, прошедшим с него. Разделы Control Plane Throughput, Replicas & Attachments, Lifecycle Latency, Datamesh Transitions, DRBD Runtime State и Debug / Metrics Collection свёрнуты и выполняют запросы только при раскрытии. В DRBD Runtime State перенесены панели DRBD из дашборда LINSTOR и добавлены ресурсы с приостановленным вводом-выводом и устройства, диск которых не находится ни в `UpToDate`, ни в `Diskless`."
  - "`D8ReplicatedVolumeLayoutDegraded` больше не срабатывает для тома с `spec.maintenance`, у которого схождение раскладки заморожено, и больше не снимается и не начинает заново 15-минутное ожидание при перезапуске контроллера или смене лидера."
  - "Нагрузки, которым нужно больше, чем разрешает профиль `restricted`, получают `SecurityPolicyException` с описанием каждой привилегии, а их поды — метку `security.deckhouse.io/security-policy-exception`, ссылающуюся на этот объект: `agent`, Job `control-plane-migrator` и CSI-узел в новой плоскости управления, `linstor-node`, `linstor-controller` и CSI-узел в плоскости управления на LINSTOR. Объекты создаются, только если в кластере доступен ресурс `SecurityPolicyException` (включён модуль `admission-policy-engine-crd`)."

fixes:
  - "В новой плоскости управления перевод `ReplicatedStorageClass` с `Availability` на `ConsistencyAndAvailability` ровно на трёх узлах хранения никогда не сходился: создавалась четвёртая реплика с диском, которой некуда было разместиться, и она навсегда занимала слот раскатки класса. Теперь у исправного тома с двумя копиями с диском и tie-breaker реплика tie-breaker сохраняется вместе со своим узлом и идентификатором узла DRBD, получает диск на этом узле и становится третьей копией; четвёртая реплика не создаётся. На узле tie-breaker должно быть хранилище из пула класса, иначе `MembershipLayoutConverged` сообщает `CannotConverge`. Том, у которого третья реплика с диском уже создаётся, по-прежнему завершает переход удалением tie-breaker."
  - "В новой плоскости управления, пока том переходит на три копии с диском, включая восстановление копии, потерянной во время перехода, он продолжает обслуживать ввод-вывод при одной копии в состоянии `UpToDate`, пока все три не станут `UpToDate`. Раньше подключение третьей копии поднимало этот минимум до двух при всего двух копиях в `UpToDate`, и единственный отказ во время ресинхронизации приостанавливал ввод-вывод."
  - "В новой плоскости управления метрики DRBD узла собираются и тогда, когда под `agent` не готов. Раньше каждый перезапуск агента убирал их, и алерты DRBD этого узла снимались именно тогда, когда на нём что-то было не так."
  - "Метрики жизненного цикла новой плоскости управления считаются правильно: каждое удаление `DRBDResource` учитывается один раз (раньше учитывалась примерно треть), `sds_rvr_backing_volume_duration_seconds` и `sds_drbdr_configured_duration_seconds` больше не записывают возраст старого объекта, вернувшегося в готовое состояние, переходы datamesh (распределённой схемы реплик тома) и их шаги учитываются ровно один раз, а отменённые пропускаются, `sds_rva_ready_duration_seconds` учитывает только первое подключение, а тома без `ReplicatedStorageClass` во всех метриках получают `storage_class=\"unknown\"`. Трекеры в памяти, на которых построены эти метрики, больше не хранят до перезапуска записи об объектах, удалённых кем-то другим."

security:
  - "Каждый контейнер модуля сбрасывает все capabilities (привилегии ядра Linux) и возвращает только нужные ему (`CHOWN` и `FOWNER` для init-контейнера `control-plane-migrator`); для привилегированных контейнеров `agent` и `linstor-satellite` меняется только манифест. Контейнеры `kube-rbac-proxy` пода `agent` работают от пользователя `deckhouse`, а не от root."
  - "Обновлены Go-зависимости бинарных файлов модуля, пропатченных компонентов LINSTOR (`linstor-csi`, `linstor-affinity-controller`, `linstor-scheduler-extender`, `k8s-await-election`) и хуков, а также `urllib3` в образе резервного копирования метаданных, что убирает CVE-2026-78669, CVE-2026-78659, CVE-2026-78660, CVE-2026-78663, CVE-2026-97032, CVE-2026-56851, CVE-2026-63209, CVE-2026-85747, CVE-2026-97687, CVE-2026-97688 и CVE-2026-97689 из результатов сканирования образов модуля."

upgrade_notes:
  - "Руками делать ничего не нужно. Поды модуля один раз перезапускаются, чтобы получить новые контексты безопасности и, там, где доступен ресурс `SecurityPolicyException`, новую метку."
  - "Дашборды Grafana зависят от используемой плоскости управления: с плоскостью управления на LINSTOR устанавливается только «SDS-REPLICATED-VOLUME / DRBD», с новой — только «SDS Replicated Volume» и «SDS Replicated Volume - Controller Runtime»."
  - "Если собственные алерты или дашборды используют метрики новой плоскости управления, обновите их: `sds_rv_membership_layout_converged`, `sds_rv_datamesh_transitions_completed_total`, `sds_rvr_ready_transition_duration_seconds` и правило записи `sds:rvr_degraded_count` удалены (вместо них используйте `sds_rv_condition_problem_timestamp_seconds`, `_count` гистограммы `sds_rv_datamesh_transition_duration_seconds` и `sds_rvr_ready_lost_total`), а границы корзин гистограмм жизненного цикла теперь доходят до часа."

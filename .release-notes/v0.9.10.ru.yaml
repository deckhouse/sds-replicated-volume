date: "2026-09-24"

summary: "Том, потерявший копию с данными, теперь восстанавливается сам в пределах ограничения ресинхронизаций, которое включено по умолчанию; отдельный том можно приостановить, не останавливая контроллер; бинарные файлы на Go пересобраны с исправленными `grpc` и `x/crypto`."

highlights:
  - "Сходимость раскладки сама пересоздаёт потерянную копию `ReplicatedVolume` с данными (diskful), а не останавливается на `TransitionUnsupported` в ожидании реплики, созданной вручную."
  - "`resyncSlotsPerNode` включён по умолчанию (4), поэтому выход узла из строя не запускает разом все ресинхронизации томов, которые на нём были."
  - "`spec.maintenance: NoResourceReconciliation` в `ReplicatedVolume` приостанавливает согласование этого тома, его реплик и его ресурсов DRBD, а все остальные тома продолжают согласовываться."

new_features:
  - "В `ReplicatedVolume` появилось поле `spec.maintenance`. Со значением `NoResourceReconciliation` контроллер не совершает над томом никаких действий: ни решений о составе и раскладке, ни изменений реплик и подключений, ни вывода конфигурации, ни обработки удаления. Пауза распространяется на реплики тома и их ресурсы DRBD; ресурс DRBD, приостановленный вручную, остаётся как есть. `Ready`, `Resilient` и `AttachedReady` продолжают публиковаться, остальной статус замирает, а пауза отражается условием `UnderMaintenance` и колонкой `Maintenance` в `kubectl get replicatedvolume -o wide`. Приостановленный том не удаляется до конца: он и его PVC остаются в `Terminating`, пока поле не очищено."
  - "Если в раскладке `ReplicatedVolume` копий с данными меньше, чем задано, недостающая копия создаётся и синхронизируется автоматически — например, при r1 → r2, r1 → r3 или после потери копии вместе с узлом. Изменения, для которых нужно удалить реплику, по-прежнему не выполняются автоматически: уменьшение числа копий, замена копии с живым участником и r2 → r3 при лишней реплике-арбитре (tie-breaker) — удалите арбитра, и копия будет восстановлена. Если копию некуда разместить, том сообщает `CannotConverge` с причиной от планировщика."

improvements:
  - "Значение `resyncSlotsPerNode` по умолчанию меняется с 0 (без ограничения) на 4, поэтому нагрузка от восстановления после отказа узла ограничена. Значение, явно заданное в настройках модуля, сохраняется; 0 по-прежнему отключает ограничение."
  - "Проба состояния и локальные метрики контроллера переезжают с портов 4271 и 4272 на 8081 и 127.0.0.1:8082, а livenessprobe контроллера CSI больше не использует порт 4261. Эти порты входят в диапазон 4200–4299, отведённый модулям, которые слушают порты в сети узла, а ни один из этих подов в ней не работает. При обновлении поды перезапускаются."

fixes:
  - "При включённом ограничении ресинхронизаций несколько томов могли одновременно выбрать один и тот же узел для приёма или отправки данных: размещение оставалось невидимым для других обработчиков, пока не возвращалось через watch, и в начале каждой волны ограничение на узел превышалось. Теперь оба конца передачи резервируются до записи размещения и освобождаются, как только реплика перестаёт ждать данные."
  - "В новом кластере метка узла `storage.deckhouse.io/sds-replicated-volume-node` ставилась только на узлы, уже подходящие для `ReplicatedStoragePool`. Именно эта метка запускает агент `sds-node-configurator`, который создаёт ресурсы `BlockDevice` для построения `LVMVolumeGroup`, поэтому ни один пул не мог получить подходящие узлы. Теперь метку сразу получают узлы, подходящие под `dataNodes.nodeSelector`."

security:
  - "`google.golang.org/grpc` обновлён с v1.82.1 до v1.83.2 в CSI-драйвере, `linstor-csi`, `linstor-affinity-controller` и `linstor-scheduler-extender`, что закрывает CVE-2026-84303, CVE-2026-84304 и CVE-2026-84445."
  - "`golang.org/x/crypto` обновлён с v0.53.0 до v0.57.0 в хуках модуля (`go-hooks`) и `linstor-scheduler-extender`, что закрывает CVE-2026-56854 (обход аутентификации по адресу источника в `x/crypto/ssh`), CVE-2026-56855 и CVE-2026-78662."

breaking:
  - "`evict.sh` и `replicas_manager.sh` устанавливаются в `/var/lib/deckhouse/sbin` вместо `/opt/deckhouse/sbin`, а старые копии удаляются с узлов. Регламенты и скрипты, которые вызывают их по старому пути, должны перейти на новый."

upgrade_notes:
  - "Руками делать ничего не нужно. После обновления конфигурация узлов переносит `evict.sh` и `replicas_manager.sh` в `/var/lib/deckhouse/sbin`; исправьте регламенты, в которых вызывается `/opt/deckhouse/sbin/evict.sh`."
  - "Если `resyncSlotsPerNode` не был задан, после обновления действует ограничение 4, и тома, которым не хватало копии с данными, начинают восстанавливаться в его пределах. Чтобы оставить ресинхронизации без ограничения, задайте `resyncSlotsPerNode: 0`."

docs:
  - "В руководстве по использованию описано восстановление потерянной реплики, которое больше не требует ручных действий, а описание алерта `D8ReplicatedVolumeLayoutDegraded` больше не ведёт через создание реплики вручную."

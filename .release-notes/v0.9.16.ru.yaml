date: "2026-11-12"

summary: "Новый control plane сам удаляет лишние реплики с данными, предварительно синхронизирует новые реплики с данными вне кворума и снова подключает отключённые реплики на медленных дисках, планировщик-расширитель LINSTOR больше не заставляет kube-scheduler оценивать занятые узлы как пустые, а CSI-драйвер объясняет неудачное расширение файловой системы ext4 с ошибками."

highlights:
  - "В новом control plane том, у которого реплик с данными (diskful) больше, чем требует его конфигурация, например после уменьшения `replication` его класса, сам приходит к нужной раскладке: контроллер удаляет по одной лишней неподключённой реплике, пока оставшиеся копии сохраняют избыточность новой конфигурации."
  - "В новом control plane отключённая реплика с данными большого тома на медленном диске снова подключается: агент узла больше не читает весь битмап DRBD, чтобы проверить метаданные, — эту проверку каждый раз прерывал 10-секундный timeout."
  - "В control plane LINSTOR `linstor-scheduler-extender` отвечает kube-scheduler именами узлов, поэтому в Kubernetes 1.33 и новее узлы, на которых уже работают поды, больше не оцениваются как пустые при планировании любого пода."

new_features:
  - "В новом control plane том, у которого реплик с данными больше, чем требует его конфигурация, теперь сам приходит к нужной раскладке — например, после уменьшения `replication` его `ReplicatedStorageClass` с трёх реплик до двух или с двух до одной либо после ручного добавления реплики с данными. Контроллер удаляет по одной лишней реплике с данными, никогда не подключённую, и только пока копии, остающиеся в состоянии `UpToDate`, сохраняют избыточность и зональные гарантии новой конфигурации; первой выбирается копия не в состоянии `UpToDate`. Раньше такой том оставался с лишними репликами, и срабатывал алерт `D8ReplicatedVolumeLayoutDegraded` с причиной `TransitionUnsupported`, пока реплику не удаляли вручную. Если ни одну реплику нельзя удалить безопасно, условие `MembershipLayoutConverged` ресурса `ReplicatedVolume` имеет значение `False` с причиной `CannotConverge` и называет подключение или ограничение, которое мешает удалению; описание алерта обновлено."

improvements:
  - "В новом control plane новая реплика с данными, а в большинстве случаев и реплика доступа (access) или tie-breaker (реплика-арбитр без данных), которая становится репликой с данными, сначала копирует данные как неголосующий участник `ShadowDiskful`, не входящий в кворум, и входит в кворум как реплика `Diskful` только после того, как её том на узле перейдёт в состояние `UpToDate`. Это включается, только если под агента на каждом узле модуля сообщает `sds-replicated-volume.deckhouse.io/shadow-diskful-supported: \"true\"`, то есть DRBD на узле содержит расширение Flant для неголосующих участников; иначе реплики добавляются как раньше. Переходы, которые уже идут, завершаются по плану, с которым начались. Настройки для этого нет."
  - "В DKP 1.78 и новее роли `d8:system-capability:sds-replicated-volume:view` и `d8:system-capability:sds-replicated-volume:edit` дают также доступ на чтение к ModuleConfig `sds-replicated-volume`, а `edit` — и на запись, и несут стандартные заголовки и описания платформы, как все capability ролевой модели DKP 1.78. RBAC модуля теперь описан в `rbac.yaml`, и шаблоны RBACv2 пишутся из него; кластеры ниже DKP 1.78 сохраняют прежние роли."
  - "Если онлайн-расширение файловой системы ext4 не удалось, CSI-драйвер нового control plane читает суперблок командой `dumpe2fs -h` (только чтение) и, если ФС помечена как имеющая ошибки, ставит перед ошибкой в событиях пода причину (ядро запрещает расширять такую ФС, пока она смонтирована) и что делать: остановить поды, использующие том, и проверить ФС командой `e2fsck -f`, пока она не смонтирована, — см. FAQ. Автоматического исправления нет; исходный текст ошибки сохраняется."

fixes:
  - "В новом control plane агент узла проверяет метаданные DRBD отключённого тома на узле командой `drbdmeta dstate`, которая читает только суперблок, а не `drbdmeta dump-md`, которая читает весь битмап. На томе 1,5 ТиБ на вращающемся диске `dump-md` выполнялась около минуты, поэтому 10-секундный timeout прерывал каждую проверку, реплика оставалась в `Configured=False` с причиной `StateQueryFailed` и больше не подключалась, а каждая повторная попытка снова читала битмап с диска, и без того занятого ресинхронизацией. Том без метаданных по-прежнему получает новые метаданные, а при сбое проверки по другой причине реплика по-прежнему не трогается."
  - "В control plane LINSTOR `linstor-scheduler-extender` теперь отвечает на запрос фильтрации с именами узлов — так его вызывает kube-scheduler Deckhouse — отфильтрованными именами узлов. Раньше он отвечал объектами Node, по которым kube-scheduler строит сведения об узле без подов, запросов ресурсов и образов, уже находящихся на узле. Начиная с Kubernetes 1.33 эти сведения используют плагины оценки (scoring) узлов, поэтому занятые узлы могли оцениваться как пустые, а поды — распределяться неравномерно. Это затрагивало и поды без томов LINSTOR, потому что расширитель вызывается для каждого пода. На запросы с объектами Node по-прежнему возвращаются объекты Node."
  - "Алерт `D8ObsoleteLinstorBackupPresents` указывал себя же как группу в аннотациях `plk_create_group_if_not_exists` и `plk_grouped_by`. Теперь он группируется в `D8ObsoleteLinstorBackupPresentsGroup`."

upgrade_notes:
  - "В новом control plane реплика с данными, добавленная вручную сверх того, что требует конфигурация, теперь удаляется автоматически, и контроллер может выбрать новую копию, пока она ещё синхронизируется. Поэтому добавить реплику, а затем удалить старую, больше нельзя как способ перенести реплику. Если конфигурацию вернули к большему числу реплик, пока лишняя реплика удаляется, удаление не отменяется: пока реплика не выйдет из тома, условие `MembershipLayoutConverged` сообщает `CannotConverge` и называет её, а недостающая копия создаётся после этого."
  - "Предварительная синхронизация через `ShadowDiskful` включается сама, когда агенты на всех узлах модуля работают на этой версии и сообщают о поддержке; ручных действий не нужно."

docs:
  - "В документации модуля сказано, что узлам с данными для сборки DRBD нужен доступ к репозиториям пакетов ОС (в изолированном окружении — к их зеркалу): в требованиях перечислены пакеты, которые ставятся для каждого семейства ОС, и указано, что пакет с заголовками ядра (kernel headers) должен существовать для запущенного ядра, а Secure Boot (проверка подписи загружаемого кода) не поддерживается. В FAQ добавлен раздел о случае, когда DRBD не собирается из-за отсутствия пакета с заголовками или репозитория, с командами проверки на узле."
  - "В FAQ добавлен раздел об ошибке расширения PVC `resize2fs: Permission denied to resize filesystem … on-line resizing required` (файловая система ext4 помечена как имеющая ошибки): причина, проверка командами `dumpe2fs -h` и `dmesg` и для control plane LINSTOR — исправление через `e2fsck -f` на узле с репликой, хранящей данные, пока том нигде не используется."

dependencies:
  - name: base images
    from: "v4.0.7"
    to: "v4.0.12"
    notes: "Все образы модуля пересобраны на актуальных базовых образах."
  - name: Go
    from: "1.27.3"
    to: "1.27.4"
    notes: "Тулчейн (набор инструментов сборки), которым собираются компоненты модуля на Go."

date: "2026-09-21"

summary: "ReplicatedVolume теперь сообщает, где размещены его реплики, в `-o wide` вернулись две колонки, которых не хватало картине конфигурации и раскладки, а включение лимитера заливок больше не упирает контроллер в потолок памяти."

highlights:
  - "`ReplicatedVolume` сообщает о размещении: условия `Scheduled` и `SatisfyEligibleNodes` выставляются впервые, а `status.eligibleNodesViolations` перечисляет реплики на узлах, которые не разрешены их пулом хранения, с причиной по каждой."
  - "`kubectl get replicatedvolume -o wide` показывает `CONVERGED` и `CONFIGURATIONREADY`: том с застрявшей раскладкой или с неверной конфигурацией виден в списке, а не только внутри объекта."
  - "Включение `resyncSlotsPerNode` больше не стоит контроллеру целого кластера в памяти: на кластере из тысяч томов он упирался в лимит своего пода."

new_features:
  - "`Scheduled` сообщает, для всех ли реплик тома выбран узел; агрегируется по неудаляемым репликам, которые размещает планировщик, — реплики `Access`, которые следуют за своим потребителем, исключены. Условие ортогонально доступности и не входит в `Ready`: том с неправильно размещённой репликой продолжает обслуживать ввод-вывод."
  - "`SatisfyEligibleNodes` сообщает, согласуется ли размещение с eligible-узлами (разрешёнными узлами) пула хранения, а `status.eligibleNodesViolations` перечисляет нарушающие реплики с узлом и причиной. Кроме вердикта по каждой реплике проверяется то, что видно только по составу участников: при `TransZonal` — узел без зоны, зона, в которой у пула нет разрешённых узлов, и все voter'ы, собранные в одну зону; при `Zonal` — каждый voter вне домашней зоны."
  - "`ReplicatedStorageClass` считает такие тома в `status.volumes.inConflictWithEligibleNodes` и выставляет по ним условие `VolumesSatisfyEligibleNodes` — пока условие тома не писалось, счётчик был структурно прибит к нулю."

improvements:
  - "В список `ReplicatedVolume` вернулись две широкие колонки: `CONVERGED` (условие `MembershipLayoutConverged` — единственный способ увидеть в списке членство, которое без человека не сдвинется) и `CONFIGURATIONREADY` (верна ли и актуальна ли сама конфигурация относительно класса хранения — та половина ответа, которой нет у `CONFIGURED`). Обе только в `-o wide`, вывод по умолчанию не изменился."

fixes:
  - "Лимитер заливок больше не вычитывает весь кластер на каждое решение. Раньше каждое решение о бюджете материализовало все `ReplicatedVolume` и все `ReplicatedVolumeReplica`, и десять воркеров одновременно выходили за лимит памяти пода контроллера; теперь выборки сужены индексами по полям, а очередь собирается по одной заявке, так что кандидат стоит сотни байт, а не своих реплик. Сами решения не изменились."
  - "Метрики CSI-контроллера и CSI-драйвера на узлах снова собираются. Их sidecar'ы `kube-rbac-proxy` авторизуют каждый scrape через `TokenReview` и `SubjectAccessReview`, а ServiceAccount `csi` не был привязан ни к тому, ни к другому, поэтому прокси отвечал 401, а поды оставались `Ready` — единственным симптомом были `up == 0` по обеим джобам и вечный `TargetDown`."
  - "Той же привязки не было у контроллера старой control plane: прокси метрик рендерится, `ServiceMonitor` выбирает Service, а каждый scrape отклонялся API-сервером."

upgrade_notes:
  - "Руками делать нечего, тома никуда не переезжают: два условия о размещении только сообщают о том, что уже есть."
  - "Класс хранения, у томов которого реплики стоят на неразрешённых узлах, может впервые после обновления выйти из `Ready` — в `PartiallyAligned` при стратегии разрешения конфликтов `Manual` и в `RollingOut` там, где разрешение включено. Размещение было неверным и раньше, теперь о нём сообщается. Какие именно реплики имеются в виду, видно в `status.eligibleNodesViolations` тех томов, которые посчитал класс."

docs:
  - "Инструкция по миграции Replication r3 → r2 называет существующие колонки: прогресс по каждому тому смотрят в `LAYOUT` и, в `-o wide`, в `CONVERGED`."

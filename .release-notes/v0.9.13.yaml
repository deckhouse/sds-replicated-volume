date: "2026-10-26"

summary: "The new control plane grows a volume from r2 to r3 by turning its tie-breaker into the third copy in place, alerts on volumes that are not `Ready` or not `Resilient` and gets a reworked Grafana dashboard, both control planes ship the `SecurityPolicyException`s that DKP 1.79 requires for system Pods, and the module images no longer carry the reported dependency vulnerabilities."

highlights:
  - "In the new control plane, raising a `ReplicatedStorageClass` from `Availability` to `ConsistencyAndAvailability` turns the tie-breaker of each volume into its third diskful copy on the same node, so the growth also completes on exactly three storage nodes, where it never converged before."
  - "In the new control plane, the `D8ReplicatedVolumeNotReady`, `D8ReplicatedVolumeNotResilient` and `D8SdsReplicatedVolumeCurrentMetricsUnavailable` alerts report volumes that do not serve I/O, volumes that would not survive the next failure, and the loss of the metrics these alerts are built on; the \"SDS Replicated Volume\" dashboard opens with the health of the volumes and a list of the problem ones."
  - "The module ships a `SecurityPolicyException` for every workload that needs more than the `restricted` profile, in both control planes, so its Pods keep starting once DKP 1.79 switches the Pod Security Standards of system namespaces from warning to denial."

new_features:
  - "New alerts of the new control plane: `D8ReplicatedVolumeNotReady` (severity 4) fires when a `ReplicatedVolume` has not been `Ready` for 5 minutes, `D8ReplicatedVolumeNotResilient` (severity 6) when it has not been `Resilient` for 30 minutes while still `Ready`, and `D8SdsReplicatedVolumeCurrentMetricsUnavailable` (severity 6) when the leader controller has not exported current metrics for 5 minutes, so that the alerts built on them cannot fire. Volumes that are still being created are not reported. `D8ReplicatedVolumeNotResilient` also fires while a volume grows to a higher redundancy and the new copy takes longer than 30 minutes to synchronize."
  - "New metrics of the new control plane controller: `sds_rv_condition_count` and `sds_rv_condition_problem_timestamp_seconds` for the conditions of `ReplicatedVolume`s, `sds_rv_created_total`, `sds_rvr_ready_lost_total`, `sds_metrics_collector_up`, the age of the oldest stuck objects (`sds_deleting_oldest_timestamp_seconds`, `sds_rv_deleting_timestamp_seconds`, `sds_rv_datamesh_transition_oldest_timestamp_seconds`, `sds_rvr_not_ready_oldest_timestamp_seconds`) and the `configuration_mode` label (`Auto` or `Manual`) of `sds_rv_count`. The agent exports `sds_drbd_module_info` with the full version of the loaded DRBD kernel module, including its build suffix."

improvements:
  - "The \"SDS Replicated Volume\" Grafana dashboard of the new control plane is reworked. It opens with the Volume Health and Problem Volumes sections, which show the volumes that are not `Ready`, not `Resilient`, under maintenance or being deleted, with the time their condition last changed status and how long ago that was. The Control Plane Throughput, Replicas & Attachments, Lifecycle Latency, Datamesh Transitions, DRBD Runtime State and Debug / Metrics Collection sections are collapsed and run their queries only when expanded. DRBD Runtime State takes over the DRBD panels of the LINSTOR dashboard and adds resources with suspended I/O and devices whose disk is neither `UpToDate` nor `Diskless`."
  - "`D8ReplicatedVolumeLayoutDegraded` no longer fires for a volume under `spec.maintenance`, whose layout convergence is frozen, and no longer resolves and starts its 15-minute wait again on a controller restart or a leader change."
  - "The workloads that need more than the `restricted` profile get a `SecurityPolicyException` that describes each privilege, and their Pods carry the `security.deckhouse.io/security-policy-exception` label pointing to it: `agent`, the `control-plane-migrator` Job and the CSI node in the new control plane, `linstor-node`, `linstor-controller` and the CSI node in the LINSTOR control plane. The objects are rendered only when the `SecurityPolicyException` resource is available in the cluster (the `admission-policy-engine-crd` module is enabled)."

fixes:
  - "In the new control plane, raising a `ReplicatedStorageClass` from `Availability` to `ConsistencyAndAvailability` on exactly three storage nodes never converged: a fourth diskful replica was created, had no node to go to and held the rollout slot of the class forever. A healthy volume with two diskful copies and a tie-breaker now keeps the tie-breaker replica, its node and DRBD node ID, and the replica gets a disk on that node and becomes the third copy; no fourth replica is created. The tie-breaker node must have storage of the class pool; otherwise `MembershipLayoutConverged` reports `CannotConverge`. A volume that already has a third diskful replica on its way still finishes by removing the tie-breaker."
  - "In the new control plane, while a volume grows to three diskful copies, including the repair of a copy lost during the growth, it keeps serving I/O at one `UpToDate` copy until all three are `UpToDate`. Before, the third copy joining raised this minimum to two while only two copies were `UpToDate`, so a single failure during the resynchronization suspended I/O."
  - "In the new control plane, DRBD metrics of a node are scraped while the `agent` Pod is not ready. Before, every agent restart dropped them, and the DRBD alerts of the node resolved exactly when something was wrong on it."
  - "The lifecycle metrics of the new control plane are counted correctly: each `DRBDResource` deletion is observed once (before, about a third of them were), `sds_rvr_backing_volume_duration_seconds` and `sds_drbdr_configured_duration_seconds` no longer record the age of an old object that returns to ready, datamesh transitions and their steps are observed exactly once and cancelled ones are skipped, `sds_rva_ready_duration_seconds` counts only the first attach, and volumes without a `ReplicatedStorageClass` are reported as `storage_class=\"unknown\"` in every metric. The in-memory trackers behind these metrics no longer keep entries of objects removed by someone else until a restart."

security:
  - "Every container of the module drops all capabilities, adding back only what it needs (`CHOWN` and `FOWNER` for the init container of `control-plane-migrator`); for the privileged `agent` and `linstor-satellite` containers this changes only the manifest. The `kube-rbac-proxy` containers of `agent` run as the `deckhouse` user instead of root."
  - "Go dependencies of the module binaries, of the patched LINSTOR components (`linstor-csi`, `linstor-affinity-controller`, `linstor-scheduler-extender`, `k8s-await-election`) and of the hooks, and `urllib3` in the metadata backup image are updated, which clears CVE-2026-78669, CVE-2026-78659, CVE-2026-78660, CVE-2026-78663, CVE-2026-97032, CVE-2026-56851, CVE-2026-63209, CVE-2026-85747, CVE-2026-97687, CVE-2026-97688 and CVE-2026-97689 from scans of the module images."

upgrade_notes:
  - "Nothing has to be done by hand. The Pods of the module restart once to pick up the new security contexts and, where the `SecurityPolicyException` resource is available, the new label."
  - "Grafana dashboards follow the control plane in use: with the LINSTOR control plane only \"SDS-REPLICATED-VOLUME / DRBD\" is installed, with the new control plane only \"SDS Replicated Volume\" and \"SDS Replicated Volume - Controller Runtime\"."
  - "If custom alerts or dashboards use the metrics of the new control plane, update them: `sds_rv_membership_layout_converged`, `sds_rv_datamesh_transitions_completed_total`, `sds_rvr_ready_transition_duration_seconds` and the `sds:rvr_degraded_count` recording rule are removed (use `sds_rv_condition_problem_timestamp_seconds`, the `_count` of `sds_rv_datamesh_transition_duration_seconds` and `sds_rvr_ready_lost_total` instead), and the buckets of the lifecycle histograms now reach one hour."

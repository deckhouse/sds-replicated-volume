date: "2026-11-05"

summary: "Новая управляющая плоскость умеет затирать данные удалённых томов, позволяет менять настройки хранения класса после создания и сообщает о деградировавших классах и пулах алертами, событиями и дашбордом ёмкости, а обе плоскости получают DRBD 9.2.19 и исправление одновременных операций LVM на общих группах томов."

highlights:
  - "В новой управляющей плоскости `ReplicatedStorageClass.spec.volumeCleanup` затирает данные реплик тома перед освобождением места (Enterprise Edition и Certified Security Edition Pro)."
  - "В новой управляющей плоскости настройки хранения `ReplicatedStorageClass` можно менять после создания, а о деградировавших классах и пулах сообщают новая фаза `Degraded`, алерты и события Kubernetes."
  - "Сателлит LINSTOR и агент sds-node-configurator теперь блокируют общие группы томов LVM друг от друга, поэтому одновременные операции с томами sds-local-volume и sds-replicated-volume больше не повреждают общий thin-пул."

new_features:
  - "В DKP 1.78 и новее роли доступа модуля следуют схеме RBAC capability/scope (возможность/область действия): ClusterRole `d8:system-capability:sds-replicated-volume:view` и `d8:system-capability:sds-replicated-volume:edit` дают доступ только на чтение и полный доступ к `ReplicatedStorageClass`, `ReplicatedStoragePool`, `ReplicatedVolume`, `ReplicatedVolumeReplica`, `ReplicatedVolumeAttachment`, `DRBDResource`, `DRBDResourceOperation`, `DRBDNodeOperation` и `DRBDMapper`. В версиях ниже 1.78 модуль сохраняет роли `d8:manage:permission:module:sds-replicated-volume:view` и `:edit`."
  - "Новые алерты новой плоскости управления: `D8ReplicatedStoragePoolNotReady` срабатывает, когда `ReplicatedStoragePool` не в состоянии `Ready` 5 минут (нет LVMVolumeGroup или thin pool, неверный селектор узлов), а `D8ReplicatedStorageClassNotReady` — когда 5 минут не в состоянии `Ready` `ReplicatedStorageClass`. Класс, пул которого не в состоянии `Ready`, сообщается только алертом пула. У обоих severity 4, в описаниях перечислены причины и что проверить. Раньше такие пулы и классы были видны только в их статусе. Для них контроллер экспортирует новые метрики `sds_rsp_condition_problem_timestamp_seconds` и `sds_rsc_condition_problem_timestamp_seconds`."
  - "На дашборде Grafana `SDS Replicated Volume` новой плоскости управления появилась строка `Capacity by ReplicatedStorageClass`. Для каждого выбранного класса она показывает ёмкость и свободное место его пула хранения как без учёта репликации, так и в пересчёте на число реплик класса, заполнение thin-пулов (тонких пулов LVM) относительно `allocationLimit` и таблицу по узлам и LVMVolumeGroup. Thin-пулы считаются по лимиту выделения: свободное место — это размер thin-пула, умноженный на `allocationLimit`, за вычетом уже выделенного места. Для этого контроллер экспортирует новые метрики `sds_rsp_lvg_info` (LVMVolumeGroup и thin-пулы `ReplicatedStoragePool`) и `sds_rsc_replicas` (число реплик и пул хранения `ReplicatedStorageClass`), которые связывают метрики ёмкости sds-node-configurator с классами хранения."
  - "В новой плоскости управления `ReplicatedStorageClass` может очищать данные своих томов перед освобождением их места: поле `spec.volumeCleanup` принимает методы sds-node-configurator — `RandomFillSinglePass`, `RandomFillThreePass` или `Discard` (только для thick-томов, `storage.type: LVM`). Метод фиксируется для тома при его создании (записывается в `spec.volumeCleanup` ресурса `ReplicatedVolume`), действует для логических томов всех его реплик, в том числе созданных позже, и применяется при каждом удалении такого логического тома: при удалении тома, а также когда реплика переезжает или лишается диска. Изменение поля класса пересоздаёт StorageClass и затрагивает только тома, созданные после изменения. Перезапись занимает время, пропорциональное размеру тома, и удалённый том исчезает только после очистки. Доступно в редакциях Enterprise Edition и Certified Security Edition Pro; в остальных редакциях вебхук отклоняет это поле."
  - "В новой плоскости управления `ReplicatedStorageClass` и `ReplicatedStoragePool` теперь создают событие Kubernetes (Event), когда у условия `Ready` меняется статус или причина: `Warning` — когда оно становится `False`, `Normal` — когда снова становится `True`. Причина события совпадает с причиной условия, например `WaitingForStoragePool`, `Degraded` или `LVMVolumeGroupNotFound`, поэтому в `kubectl describe` видно, когда класс или пул сломался и когда восстановился. Если проход согласования ничего не изменил или изменил только сообщение, событие не создаётся. Оба ресурса кластерные, поэтому их события лежат в пространстве имён `default`, и контроллеру выдано право создавать их там."
improvements:
  - "Новый алерт `D8DrbdResourceIOSuspended` срабатывает, когда I/O DRBD-ресурса приостановлен 5 минут по причине, отличной от потери кворума (недоступна ни одна реплика с актуальными данными, fencing или `drbdsetup suspend-io`). I/O к такому тому зависает, а не завершается ошибкой, и раньше алерт был только на потерю кворума. В описании алерта сказано, как узнать причину и что делать."
  - "Удаление thin pool из `spec.thinPools` LVMVolumeGroup теперь отклоняется, пока его использует ReplicatedStoragePool или ReplicatedStorageClass. sds-node-configurator удаляет убранный из spec thin pool, как только он опустел, и реплики размещались бы в thin pool, которого больше нет. Пока вебхук модуля недоступен, проверка не блокирует изменения LVMVolumeGroup."
  - "В симуляциях планирования kube-scheduler Deckhouse (запросы filter и prioritize с `dryRun: true`) `linstor-scheduler-extender` больше не записывает Events `FailedScheduling` на симулируемый под, поэтому проверки descheduler не оставляют ложных ошибок планирования на работающих подах ВМ."
  - "В новой управляющей плоскости `spec.storage`, `spec.nodeLabelSelector`, `spec.zones` и `spec.eligibleNodesPolicy` у `ReplicatedStorageClass` можно менять после создания: изменение переводит класс в новый автоматически созданный пул хранения, и новые тома получают новую конфигурацию. Ограничения остаются только для классов управляющей плоскости LINSTOR."
  - "В новой управляющей плоскости `ReplicatedStorageClass`, у которого после принятия конфигурации деградировали пул хранения или подходящие узлы, показывается в новой фазе `Degraded` с причиной `Degraded` в условии `Ready`: принятая конфигурация продолжает действовать, но реплики можно разместить только на узлах, которые пул ещё предоставляет. Фаза `Terminating` называет число томов, которых она ждёт, а `VolumesSatisfyEligibleNodes` — число конфликтующих томов."
fixes:
  - "В новой плоскости управления контроллер больше не удаляет StorageClass другого провижинера с именем `ReplicatedStorageClass`. Раньше он удалял такой StorageClass и создавал на его месте свой. Теперь он не трогает этот StorageClass, а `ReplicatedStorageClass` переходит в фазу `InvalidConfiguration` с `Ready=False`, причиной `StorageClassConflict` и сообщением, в котором названы StorageClass и его провижинер. Когда имя освободится, класс получит свой StorageClass в течение минуты."
  - "В старой плоскости управления на LINSTOR `ReplicatedStorageClass`, имя которого занято StorageClass другого провижинера, теперь переходит в фазу `InvalidConfiguration` с сообщением, в котором названы StorageClass и его провижинер. Раньше конфликт только записывался в лог контроллера, а статус не менялся."
  - "`DeleteVolume` навсегда отказывал в удалении тома, если ReplicatedVolumeAttachment пережил VolumeAttachment своего узла: финализатор CSI-контроллера на нём снимает только `ControllerUnpublishVolume`, которую external-attacher после исчезновения VolumeAttachment больше не вызывает, и PersistentVolume оставался `Released`. Теперь `DeleteVolume` сначала освобождает такие attachment, если их устройство не используется."
  - "В новой плоскости управления StorageClass `ReplicatedStorageClass` теперь получает аннотацию `storage.deckhouse.io/volumesnapshotclass: sds-replicated-volume`, как в старой плоскости управления на LINSTOR. Без неё storage-foundation не подставлял `volumeSnapshotClassName` в VolumeSnapshot тома этого класса, а VolumeCaptureRequest для такого тома завершался ошибкой об отсутствующей аннотации. Существующие StorageClass получают аннотацию при следующем reconciliation без пересоздания; другое значение, заданное вручную, заменяется."
  - "Сателлит LINSTOR теперь блокирует группы томов LVM через каталог блокировок хоста — тот же, что использует агент sds-node-configurator. Когда sds-local-volume и sds-replicated-volume используют общую группу томов, `lvcreate` и `lvremove` с двух сторон выполнялись без взаимного исключения и могли повредить метаданные thin-пула."
  - "Удаляемые `ReplicatedStorageClass` и `ReplicatedStoragePool` снова могут лишиться финализатора. Вебхук проверял и это обновление, поэтому класс, переставший проходить проверку после создания, например с топологией `Ignored` после появления меток зон на узлах, навсегда зависал в удалении."
  - "Вебхук теперь отклоняет `ReplicatedStorageClass`, если не может прочитать StorageClass с тем же именем; класс пропускается, только если такого StorageClass нет. Раньше любая ошибка чтения пропускала тот самый класс, ради которого проверка существует."
  - "В новой управляющей плоскости классы с разной `eligibleNodesPolicy` больше не делят один пул хранения и не работают молча с политикой другого класса. Существующие классы сохраняют свои пулы после обновления и переходят на новое имя пула при первом изменении спецификации."
  - "При миграции с LINSTOR тома класса хранения в фазе `Degraded` теперь переключаются в `Auto`, а не ждут, пока шаг миграции сдастся."
security:
  - "`golang.org/x/net` v0.62.0 (CVE-2026-78661, CVE-2026-97045), а пакеты ALT Linux в `spaas`, `drbd-reactor`, `metadata-backup` и `linstor-server` взяты из снимка репозитория 2026/10/31 (curl 8.23.0, libbrotli 1.2.1, cups 2.4.20, freetype 2.14.3)."

breaking:
  - "На DKP 1.78 и новее ClusterRole `d8:manage:permission:module:sds-replicated-volume:view` и `:edit` больше не создаются; привязки к ним по имени перестают давать доступ."

dependencies:
  - name: DRBD
    from: "9.2.18-flant.10"
    to: "9.2.19-flant.21"

upgrade_notes:
  - "В DKP 1.78 и новее ClusterRole `d8:manage:permission:module:sds-replicated-volume:view` и `:edit` заменяются на `d8:system-capability:sds-replicated-volume:view` и `:edit`. Привязки, которые ссылаются на старые имена ролей напрямую, нужно перевести на новые."
docs:
  - "В FAQ указано, что overprovisioning в LVMThin-пулах ограничивает LINSTOR, а поле `allocationLimit` у thin pool в LVMVolumeGroup на тома модуля не влияет."
  - "В описании параметра `dataNodes.nodeSelector` и в FAQ указано, что делает параметр: подходящие под него узлы получают лейбл `storage.deckhouse.io/sds-replicated-volume-node` и на них работают компоненты модуля, а заданное значение заменяет значение по умолчанию `kubernetes.io/os: linux`. Изменение селектора позже, в том числе выключение модуля и повторное включение с другим селектором, не снимает лейблы с уже выбранных узлов и не переносит данные; описание ссылается на порядок действий из FAQ, чтобы убрать модуль с такого узла."
  - "В документации описано, как режим репликации влияет на задержку и IOPS, и как отключить модуль."

date: "2026-10-01"

summary: "`ReplicatedStorageClass`, созданный до v0.9.8, больше не переходит в `InvalidConfiguration` после обновления, узлы с уже нужной версией DRBD перестали ставить заголовки ядра при каждом запуске bashible, а справочник API полностью описан на обоих языках."

highlights:
  - "Старый контроллер пересоздаёт StorageClass, который отличается от желаемого только параметром `replicated.csi.storage.deckhouse.io/fsOpts`, поэтому `ReplicatedStorageClass`, созданный предыдущей версией или с изменённой аннотацией `storage.deckhouse.io/ext4-reserved-percent`, больше не оказывается в фазе `InvalidConfiguration`."
  - "NodeGroupConfiguration для DRBD ставит заголовки ядра только перед сборкой DRBD; на ALT Linux она больше не обновляет ядро и не запрашивает перезагрузку узла, где DRBD уже нужной версии."
  - "У каждого поля CRD модуля есть английское описание в справочнике, русский справочник полон, а служебные заметки разработчиков больше не попадают в описания `ReplicatedStorageClass` и `ReplicatedVolume`."

fixes:
  - "Начиная с v0.9.8 старый контроллер всегда записывает `replicated.csi.storage.deckhouse.io/fsOpts` в создаваемый им StorageClass, но не относил этот параметр к тем, которые разрешено менять пересозданием. Поэтому каждый StorageClass, созданный предыдущей версией, считался отличием, которое нельзя устранить пересозданием, и его `ReplicatedStorageClass` после обновления переходил в фазу `InvalidConfiguration`; изменение аннотации `storage.deckhouse.io/ext4-reserved-percent` отклонялось так же. Теперь StorageClass пересоздаётся. `fsOpts` читается только при форматировании тома, поэтому существующие тома не затрагиваются. Относится к старой плоскости управления на LINSTOR."
  - "NodeGroupConfiguration для DRBD (дистрибутивы, подобные Debian, CentOS и ALT Linux) ставила заголовки работающего ядра и удаляла остальные до проверки, загружена ли уже нужная версия DRBD. Каждый запуск bashible на таком узле запрашивал у репозиториев дистрибутива ненужный пакет и завершался ошибкой на узле без доступа к ним; на ALT Linux заголовки новее работающего ядра приводили к обновлению ядра и запросу перезагрузки. Теперь заголовки ставятся только на узле, где предстоит собирать DRBD."

security:
  - "Зависимости Go, отмеченные сканером уязвимостей, обновлены в агенте, контроллере, старом контроллере, вебхуках, `linstor-drbd-wait` и `linstor-migrator`: `golang.org/x/net` v0.56.0 → v0.58.0, `golang.org/x/sys` v0.46.0 → v0.47.0, `golang.org/x/text` v0.39.0 → v0.41.0, а в контроллере и вебхуках также `go.opentelemetry.io/otel` v1.37.0 → v1.41.0 и `github.com/google/cel-go` v0.26.0 → v0.29.0."

docs:
  - "Шестьдесят полей CRD, у которых в справочнике не было английского описания, теперь описаны: верхний уровень `DRBDMapper`, `DRBDNodeOperation`, `DRBDResourceOperation`, `DRBDResource` и `ReplicatedVolume`, большинство полей `DRBDResource`, а также имена узлов и томов, размеры, адреса и условия ресурсов `ReplicatedVolume*`. Исправлено русское описание `status.activeConfiguration.nonVoting` в `DRBDResource`: поле равно `true`, когда диск не участвует в голосовании за кворум."
  - "Русский справочник охватывает все CRD модуля: добавлено 147 описаний, включая `apiVersion`, `kind` и поля условий, а переводы `status.reason` в `ReplicatedStorageClass` и `ReplicatedStoragePool` перенесены в `status.message` — поле, которое на самом деле есть в схеме."
  - "Описание `spec` в `ReplicatedStorageClass` больше не начинается примерно с тридцати строк заметок о правилах проверки CEL, `spec` в `ReplicatedVolume` получил описание «Желаемое состояние реплицируемого тома» вместо меток правил CEL, а `systemNetworkNames` и `lvmVolumeGroups` больше не заканчиваются служебными заметками TODO. Меняются только описания, схема остаётся прежней."

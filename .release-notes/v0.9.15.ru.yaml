date: "2026-11-06"

summary: "Модуль ядра DRBD новой плоскости управления снова собирается, агент на узле больше не перезаписывает метаданные DRBD реплики, которые не смог прочитать, а в плоскости управления LINSTOR снова отфильтровываются лейблы."

highlights:
  - "DRBD новой плоскости управления обновлён до 9.2.19-flant.22: версия 9.2.19-flant.21, которую v0.9.14 ставит по умолчанию, не компилируется."
  - "В новой плоскости управления агент на узле больше не записывает новые метаданные DRBD поверх реплики, состояние которой на узле не смог прочитать, поэтому медленный или перегруженный диск больше не стоит реплике её данных."
  - "В плоскости управления LINSTOR лейблы из `storageClassLabelIgnoredPrefixes` снова не копируются из `ReplicatedStorageClass` в её StorageClass, и Argo CD больше не показывает StorageClass лишним ресурсом приложения."

fixes:
  - "В новой плоскости управления модуль ядра DRBD версии 9.2.19-flant.21, которую v0.9.14 ставит по умолчанию, не компилируется: в нём две функции `node_id_to_mask` с разными аргументами. В версии 9.2.19-flant.22 одна из них переименована, остальные исправления те же. Плоскость управления LINSTOR использует свою версию DRBD, и её это не касается."
  - "В новой плоскости управления агент на узле больше не меняет реплику, состояние DRBD которой на узле не удалось прочитать. Когда `drbdmeta dump-md` завершался ошибкой по причине, отличной от отсутствия метаданных, например был остановлен по 10-секундному тайм-ауту на перегруженном диске, агент считал, что на томе нет метаданных, и выполнял на нём `create-md --force`. При поочерёдной перезагрузке узлов это перезаписывало метаданные реплик с данными. Теперь агент сообщает об ошибке в условии `Configured` объекта `DRBDResource` и повторяет попытку при следующей обработке."
  - "В новой плоскости управления агент на узле больше не применяет параметры диска ресурсов DRBD на thin-пулах снова и снова. Он запрашивал у DRBD `rs-discard-granularity`, равный гранулярности discard (освобождения неиспользуемых блоков) нижележащего устройства, а DRBD ограничивает это значение 1 МиБ и максимальным размером discard устройства. На thin-пулах с чанками больше 1 МиБ агент на каждом проходе видел расхождение и запускал `drbdsetup disk-options` около 200 раз в минуту на узле, и каждый запуск приостанавливал запись. Теперь агент запрашивает то значение, которое DRBD сохраняет."
  - "В плоскости управления LINSTOR лейблы `ReplicatedStorageClass`, ключи которых начинаются с префиксов из `storageClassLabelIgnoredPrefixes` (по умолчанию `argocd.argoproj.io/`, `kustomize.toolkit.fluxcd.io/`, `helm.toolkit.fluxcd.io/`, `fleet.cattle.io/`) или из системного списка (`app.kubernetes.io/managed-by`, `app.kubernetes.io/instance`), снова не копируются в её StorageClass. Начиная с v0.9.5 этот список не доходил до контроллера плоскости управления LINSTOR, и он копировал все лейблы, поэтому StorageClass получал лейбл отслеживания Argo CD и отображался как лишний ресурс приложения. После обновления контроллер снимет такие лейблы с существующих StorageClass без их пересоздания."

docs:
  - "В FAQ описано, что происходит со снапшотами и восстановленными томами, когда один из них удаляют: снапшот тома LVMThin снимается на каждой реплике, удалять можно в любом порядке, восстановленный том не зависит ни от снапшота, ни от исходного тома, а свободное место, которое LINSTOR показывает для пула LVMThin, уже учитывает снапшоты."

dependencies:
  - name: DRBD
    from: "9.2.19-flant.21"
    to: "9.2.19-flant.22"
    notes: "Только для новой плоскости управления. Исправлена сборка модуля ядра."

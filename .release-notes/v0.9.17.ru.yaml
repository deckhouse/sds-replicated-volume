date: "2026-11-20"

summary: "Внутренние ресурсы нового control plane и общий секрет DRBD закрыты от обычных уровней доступа, LINSTOR control plane переходит на DRBD 9.2.21, снимки и клоны томов в thick-пулах отклоняются при создании, а новый control plane эвакуирует реплики с потерянных узлов и умеет реплицировать по выделенной сети SystemNetwork."

highlights:
  - "Роли `user-authz` больше не дают `User` читать, а `ClusterEditor` — изменять внутренние ресурсы нового control plane, а общий секрет DRBD тома помечен как чувствительные данные. Общие секреты DRBD, которые можно было прочитать раньше, считайте раскрытыми."
  - "LINSTOR control plane переходит на DRBD 9.2.21 и drbd-utils 9.36.0. Узлы, где загружен более старый модуль ядра DRBD, собирают новый и перезагружаются по настройкам прерываний (`disruptions`) своей NodeGroup."
  - "`VolumeSnapshot`, восстановление и клон тома в классе с пулом `LVM` (thick) отклоняются при создании, а не повторяются CSI-драйвером бесконечно."

new_features:
  - "Скрипт `srv-node-cleanup.sh` зачищает узел от DRBD и томов модуля, когда кластер недоступен, для обоих control plane. Он останавливает DRBD-ресурсы, выгружает модули ядра `drbd`, удаляет файлы модуля и его правки `lvm.conf`, а с флагами `--delete-volumes` и `--vg` удаляет логические тома модуля только в названных группах томов. По умолчанию это пробный запуск, который печатает, что будет сделано; группы томов, физические тома и thin-пулы скрипт не трогает. Текст скрипта и порядок действий — в разделе FAQ «Как зачистить узел от DRBD и томов модуля, если кластер недоступен?»."
  - "В новом control plane появились четыре алерта о заполнении пула, как `D8LinstorStoragePoolFreeCapacityLessThen*` в LINSTOR control plane: `D8ReplicatedStoragePoolFreeCapacityLessThan20Percent`, `D8ReplicatedStoragePoolFreeCapacityLessThan10Percent`, `D8ReplicatedStoragePoolFreeCapacityLessThan5Percent` и `D8ReplicatedStoragePoolFreeCapacityLessThan1Percent` срабатывают, когда у LVMVolumeGroup из `ReplicatedStoragePool` 5 минут остаётся меньше 20 %, 10 %, 5 % и 1 % свободного места. Для пула `LVMThin` проверяется свободное место в thin-пуле, критичность 6, 4, 3 и 1; для пула `LVM` (thick) — свободное место в группе томов, критичность 7, 6, 5 и 4. Алерты строятся по метрикам `sds_node_configurator_lvg_*` агента sds-node-configurator и несут метки `storage_pool`, `node`, `lvg_name`, а для thin-пула ещё `thin_pool`. Правила `D8LinstorStoragePoolFreeCapacityLessThen*` в новом control plane больше не разворачиваются: метрик LINSTOR для них там нет."
  - "В новом control plane `ReplicatedStorageClass` со стратегией `RollingRepair` в `eligibleNodesConflictResolutionStrategy` (по умолчанию) эвакуирует реплики с потерянных узлов. Diskful-реплика или реплика tie-breaker, чей узел не входит в `eligibleNodes` пула и отсутствует или не готов дольше `eligibleNodesPolicy.notReadyGracePeriod` (по умолчанию 10 минут), удаляется из тома по одной, и контроллер создаёт ей замену на подходящем узле. Реплика не удаляется, пока она подключена к поду, пока живой пир ещё видит её подключённой по DRBD или пока оставшиеся реплики потеряли бы кворум или последнюю diskful-копию в `UpToDate`; такой том сообщает `ConflictResolutionBlocked` в условии `SatisfyEligibleNodes` с причиной ожидания. Объекты эвакуированной реплики уходят из API, не дожидаясь потерянного узла; её LV остаётся на диске, и sds-node-configurator удаляет его, когда узел вернётся. Условие `VolumesSatisfyEligibleNodes` класса считает тома, которые эвакуируются, заблокированы и находятся в других конфликтах. Живые узлы, исключённые только метками, зонами или изменением `LVMVolumeGroup`, не эвакуируются; стратегия `Manual` выключает эвакуацию."
  - "В новом control plane `spec.systemNetworkNames` у `ReplicatedStorageClass` и `ReplicatedStoragePool` может называть `SystemNetwork` модуля `sdn`, и тогда репликация DRBD идёт по выделенной сети, а не по сети узлов (`Internal`, по умолчанию). У сети должен быть `spec.ipam`; вебхук отклоняет класс, который называет несуществующую сеть, сеть без `spec.ipam` или любую `SystemNetwork`, пока модуль `sdn` недоступен. Подходят только узлы с адресом в выбранной сети: пул перечисляет исключённые узлы в сообщении, а если не осталось ни одного — сообщает `NoNodesWithRequiredSystemNetworks`. Заданный `spec.systemNetworkNames` нельзя изменить ни в одном из ресурсов; чтобы новые тома шли по другой сети, создайте другой класс. Существующие тома между сетями не переносятся."

improvements:
  - "В новом control plane `StorageClass`, создаваемый для `ReplicatedStorageClass`, теперь получает метки этого `ReplicatedStorageClass`, как в LINSTOR control plane и в остальных модулях хранения: `ClusterResourceGrantPolicy` может выбирать класс через `allowedSelector` и `deniedSelector`, а метки ставятся на `ReplicatedStorageClass`, потому что вебхук не принимает изменение меток у `StorageClass`. Метки, ключи которых начинаются с префикса из `storageClassLabelIgnoredPrefixes` (системный список и список из `ModuleConfig`), не переносятся, `storage.deckhouse.io/managed-by: sds-replicated-volume` переопределить нельзя, метка, убранная с `ReplicatedStorageClass`, исчезает и со `StorageClass`, а изменение меток обновляет `StorageClass` на месте, без пересоздания."
  - "В LINSTOR control plane алерты `D8LinstorStoragePoolFreeCapacityLessThen*` для пула `LVM` (thick) приходят с меньшей критичностью: 7, 6, 5 и 4 при свободном месте меньше 20 %, 10 %, 5 % и 1 % вместо 6, 4, 3 и 1. Thick-том занимает всё своё место при создании, поэтому заполненный thick-пул мешает созданию новых томов и реплик и расширению томов, но, в отличие от заполненного thin-пула, не останавливает запись в существующие тома. Критичность для пулов `LVMThin`, имена и метки алертов не меняются."
  - "В режиме HA контроллер модуля и CSI-контроллер обоих control plane работают в двух репликах, а не по одной на master-узел, и в одной на кластере с единственным master-узлом; при обновлении поды пересоздаются один раз. В новом control plane вебхуки допуска (admission webhooks) обслуживает сам контроллер, поэтому отдельного Deployment `webhooks` и его подов на master-узлах больше нет; CSI resizer больше не держит в памяти все поды кластера, а контроллер и агент узла не хранят `managedFields` в своих кешах."

fixes:
  - "DRBD теперь собирается на узлах Debian и Rocky Linux, загруженных в ядро, заголовков которого уже нет в репозиториях дистрибутива, например на узле из устаревшего облачного образа. На Debian скрипт `NodeGroupConfiguration` теперь ищет пакет `linux-headers` запущенного ядра на `snapshot.debian.org` и ставит его через временный источник, который `apt` по-прежнему проверяет ключами архива Debian, а на Rocky Linux скачивает пакет `kernel-devel` из архива Rocky Linux (vault) и ставит его с проверкой подписи RPM. Если заголовков нет и там, скрипт завершается ошибкой, в которой назван пакет и сказано, что делать; раньше оставалось только сообщение `apt` или `dnf` о том, что пакет не найден."
  - "`VolumeSnapshot` для `PersistentVolumeClaim` класса с пулом `LVM` (thick, толстые тома), `PersistentVolumeClaim`, восстанавливаемый из `VolumeSnapshot` в такой класс, и клон `PersistentVolumeClaim` из такого класса или в такой класс теперь отклоняются при создании с сообщением, в котором названы `StorageClass`, его пул и требование `LVMThin`. Раньше они принимались, и CSI-драйвер повторял их бесконечно: снапшоты и клоны, которые делаются через снапшот, существуют только в тонких пулах. Тип пула — это `spec.type` ресурса `ReplicatedStoragePool` в LINSTOR control plane и `spec.storage.type` ресурса `ReplicatedStorageClass` в новом control plane. `VolumeSnapshot`, привязанный к существующему `VolumeSnapshotContent`, не проверяется."
  - "У `StorageClass` для `ReplicatedStorageClass` с пулом `LVM` (thick) больше нет аннотации `storage.deckhouse.io/volumesnapshotclass`, поэтому `storage-foundation` больше не подставляет `VolumeSnapshotClass` модуля в снапшоты его томов; у классов с пулом `LVMThin` аннотация остается."
  - "В LINSTOR control plane `ReplicatedStorageClass` с `replication: None` теперь задаёт в `StorageClass` `auto-quorum: disabled` и `auto-add-quorum-tiebreaker: false`, а контроллер выставляет `auto-quorum: disabled` в группе ресурсов LINSTOR у существующих однореплицных классов. Единственная копия не может разойтись сама с собой, но отключившийся diskless-участник включал кворум и останавливал ввод-вывод на исправной реплике. Существующие однореплицные тома теряют кворум, когда LINSTOR в следующий раз пересчитает их определение ресурса."
  - "В новом control plane `ReplicatedStorageClass` с топологией `Ignored` отклоняется, пока в кластере есть узлы с меткой `topology.kubernetes.io/zone`, а с топологией `Zonal` или `TransZonal` — пока таких узлов нет, как в LINSTOR control plane. Класс, который уже содержит такую топологию, остаётся редактируемым, его тома не затрагиваются: контроллер сообщает о несоответствии в условии `Ready` (`InsufficientEligibleNodes`, а если конфигурация уже действует — `Degraded`)."

security:
  - "Вебхук, который разрешает создавать `PersistentVolumeClaim` с `ReadWriteMany` в классе модуля только перечисленным сервисным аккаунтам, теперь определяет класс так же, как Kubernetes: сначала по аннотации `volume.beta.kubernetes.io/storage-class`, затем по `spec.storageClassName`. Раньше можно было указать класс модуля в аннотации, а другой класс — в `spec`, пройти проверку и получить том модуля. `PersistentVolumeClaim` с `storageClassName: \"\"` запрашивает том без класса и больше не сверяется с классом по умолчанию, а из нескольких классов по умолчанию берётся самый новый, как в Kubernetes."
  - "Роли `user-authz` модуля больше не дают `User` читать, а `ClusterEditor` — изменять внутренние ресурсы нового control plane: `ReplicatedVolume`, `ReplicatedVolumeReplica`, `ReplicatedVolumeAttachment`, `DRBDResource`, `DRBDMapper`, `DRBDResourceOperation` и `DRBDNodeOperation`. Их создают и ведут CSI-драйвер, контроллер и агент, а `ReplicatedVolume` и `DRBDResource` хранят общий секрет DRBD каждого тома, который мог прочитать любой `User`. Теперь `ReplicatedVolume` и `DRBDResource` читают уровни от `ClusterAdmin`, остальные пять — от `ClusterEditor`; `ClusterAdmin` создаёт и удаляет операции обслуживания DRBD — `DRBDResourceOperation` и `DRBDNodeOperation`, а остальное изменяет только `SuperAdmin`. В ролевой модели RBACv2 наблюдатель подсистемы хранилища их больше не получает, менеджер только читает пять ресурсов без секрета, а суперадминистратор читает `ReplicatedVolume` и `DRBDResource`, создаёт и удаляет операции обслуживания DRBD."
  - "В новом control plane общий секрет DRBD тома — `status.datamesh.sharedSecret` ресурса `ReplicatedVolume` и `spec.peers[].sharedSecret` ресурса `DRBDResource` — помечен маркером `x-kubernetes-sensitive-data`. В DKP 1.77 и новее API возвращает `<omitted>` вместо секрета тому, кому не разрешено читать подресурс `replicatedvolumes/sensitive` или `drbdresources/sensitive`, в журнале аудита секрет маскируется, а при `apiserver.encryptionEnabled: true` в `control-plane-manager` объекты шифруются в etcd. В DKP ниже 1.77 маркер отбрасывается при установке CRD, и секрет остаётся как раньше. Подресурсы читают контроллер модуля, агент узла и административный kubeconfig master-узлов. Ни уровни доступа, ни роли RBACv2 их не получают: `ClusterAdmin` и роль superadmin подсистемы storage в RBACv2 по-прежнему читают `ReplicatedVolume` и `DRBDResource`, но видят `<omitted>`; кроме этих трёх, секрет видят только субъекты с правилом `*` на все ресурсы, например `SuperAdmin`. Если агент читает `<omitted>` вместо секрета пира, он оставляет соединения DRBD ресурса как есть и выставляет на `DRBDResource` условие `Configured=False` с причиной `SharedSecretMasked`, вместо того чтобы задать `<omitted>` секретом соединений."

docs:
  - "Документация называет модуль `storage-foundation`, а не `snapshot-controller`, модулем, который требуется для снимков томов, и больше не предлагает включать `snapshot-controller`."
  - "Ссылка на раздел о вытеснении DRBD-ресурсов с узла в разделе FAQ об очистке узла при недоступном кластере теперь ведёт на этот раздел."
  - "Описание `dataNodes` в настройках модуля больше не упоминает LINSTOR: в нём указаны агент узла текущего control plane и узловой компонент CSI, а также сказано, что реплики размещаются только на узлах `ReplicatedStoragePool` с лейблом `dataNodes`."
  - "Инструкции алерта `D8DrbdPeerDeviceIsOutOfSync` в обоих control plane, новый раздел FAQ «Как убрать рассинхронизированные данные DRBD-устройства?» и его вариант для нового control plane переподключают соединения по одному: перед каждым переподключением проверяется, что все реплики ресурса в `UpToDate`, подключены, не пересинхронизируются и имеют кворум, а если реплика остаётся в `Outdated` или `Inconsistent` или теряет кворум, процедура останавливается. Переподключение соединений узла одного за другим могло оставить реплику в `Outdated`, а ресурс — без кворума. Также описано, что diskless-реплика может показывать такого пира как `peer-disk:Consistent` и это признак того же `out-of-sync`, а не отдельная авария. Переподключение больше не описывается как исправление данных: если generation UUID обоих концов совпадают, а Primary на одном из концов соединения не писал, пока соединения не было, переподключение сбрасывает биты `out-of-sync`, не проверяя данные. Инструкции нового control plane также говорят, что онлайн-верификация только помечает различающиеся блоки и не пересинхронизирует их, как читать её результат и что при полном перезеркалировании инвалидируется копия, которая не Primary."

upgrade_notes:
  - "При обновлении модуль снимает аннотацию `storage.deckhouse.io/volumesnapshotclass` с существующих `StorageClass` классов с пулом `LVM` (thick), в том числе значение, поставленное вручную; `StorageClass` обновляется на месте, не пересоздается, тома не затрагиваются. `VolumeSnapshot` такого тома без `volumeSnapshotClassName` больше не получает класс модуля."
  - "Меняется доступ `user-authz` к модулю. Уровни от `User` до `Admin` больше не читают `ReplicatedVolume`, `ReplicatedVolumeReplica`, `ReplicatedVolumeAttachment`, `DRBDResource`, `DRBDMapper`, `DRBDResourceOperation` и `DRBDNodeOperation`. `ClusterEditor` читает `ReplicatedVolumeReplica`, `ReplicatedVolumeAttachment`, `DRBDMapper`, `DRBDResourceOperation` и `DRBDNodeOperation`, но больше не изменяет их, а `ReplicatedVolume` и `DRBDResource` больше не читает и не изменяет. `ClusterAdmin` читает все семь, создаёт и удаляет `DRBDResourceOperation` и `DRBDNodeOperation` — операции обслуживания DRBD, например `ForcePrimary`, `Invalidate`, `CreateNewUUID` и `UpdateDRBD`, — но больше не изменяет остальные пять; их изменяет только `SuperAdmin`. В ролевой модели RBACv2 наблюдатель подсистемы хранилища эти ресурсы больше не получает, менеджер читает те же пять, что и `ClusterEditor`, и ничего из них не изменяет, а начиная с DKP 1.78 суперадминистратор читает `ReplicatedVolume` и `DRBDResource`, создаёт и удаляет операции обслуживания DRBD через capability `d8:system-capability:sds-replicated-volume:superadmin`. Уровни `ReplicatedStorageClass` и `ReplicatedStoragePool` не меняются: `User` читает их, `ClusterEditor` изменяет. Страницы этих ресурсов в консоли показываются только субъектам, которые могут их читать: `ClusterEditor` видит реплики и подключения, но не тома."
  - "Общие секреты DRBD, которые раньше можно было прочитать из `ReplicatedVolume` и `DRBDResource`, считайте раскрытыми. Модуль задаёт секрет тома только при его формировании и потом не меняет."
  - "При `apiserver.encryptionEnabled: true` объект `ReplicatedVolume` или `DRBDResource` шифруется в etcd при следующей записи; контроллер и агент записывают их статус при каждом изменении состояния тома. Чтобы зашифровать существующие объекты сразу, перезапишите их: `d8 k get replicatedvolumes -o json | d8 k replace -f -` и так же для `drbdresources`."
  - "`ReplicatedVolume` и `DRBDResource` не входят в `d8 backup cluster-config`: у их CRD нет метки `backup.deckhouse.io/cluster-config`, поэтому резервные копии не меняются."
  - "Не снимайте маркер при включённом шифровании в etcd, например откатом модуля на релиз без маркера: kube-apiserver перестанет читать зашифрованные объекты `ReplicatedVolume` и `DRBDResource`, и тома нового control plane перестанут обслуживаться."
  - "На каждом узле LINSTOR control plane, где загружен модуль ядра DRBD старше 9.2.21, bashible собирает DRBD 9.2.21 и запрашивает перезагрузку; узел освобождается от подов и перезагружается по настройкам `disruptions` своей NodeGroup, а при `approvalMode: Manual` ждёт подтверждения. Новый control plane остаётся на DRBD 9.2.19-flant.22, его узлы не перезагружаются."
  - "В новом control plane вебхуки допуска модуля недоступны, пока после обновления раскатывается контроллер: до готовности новых подов контроллера API-сервер отклоняет запросы, которые проверяют вебхуки, например создание или изменение `ReplicatedStorageClass` и `ReplicatedStoragePool`. Повторите такой запрос после раскатки."
  - "В новом control plane уберите `eligibleNodesConflictResolutionStrategy.rollingRepair` из манифестов `ReplicatedStorageClass`: поля больше нет, и клиент со строгой проверкой полей отклоняет манифест, где оно задано. Из сохранённых объектов API-сервер убирает поле сам, с ними ничего делать не нужно."

breaking:
  - "Уровни доступа `user-authz` от `User` до `Admin` больше не читают внутренние ресурсы нового control plane, `ClusterEditor` больше не изменяет их, а `ReplicatedVolume` и `DRBDResource` читают только уровни от `ClusterAdmin`. Что меняется для каждого уровня — в заметках об обновлении."
  - "В новом control plane из `ReplicatedStorageClass` убрано поле `eligibleNodesConflictResolutionStrategy.rollingRepair`, и стратегия теперь — только `type: RollingRepair` или `type: Manual`. Манифест, где поле ещё задано, клиент со строгой проверкой полей отклоняет."

dependencies:
  - name: "DRBD"
    from: "9.2.16"
    to: "9.2.21"
    notes: "Только LINSTOR control plane. Новый control plane остаётся на 9.2.19-flant.22."
  - name: "drbd-utils"
    from: "9.30.0"
    to: "9.36.0"
    notes: "Только LINSTOR control plane."

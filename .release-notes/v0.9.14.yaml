date: "2026-11-05"

summary: "The new control plane can wipe the data of deleted volumes, lets the storage settings of a class change after creation, reports degraded classes and pools with alerts, Events and a capacity dashboard, and both control planes ship DRBD 9.2.19 and the fix for concurrent LVM operations on shared volume groups."

highlights:
  - "In the new control plane, `ReplicatedStorageClass.spec.volumeCleanup` wipes the data of a volume's replicas before their space is released (Enterprise Edition and Certified Security Edition Pro)."
  - "In the new control plane, the storage settings of a `ReplicatedStorageClass` can be changed after creation, and degraded classes and pools are reported by the new `Degraded` phase, alerts and Kubernetes Events."
  - "The LINSTOR satellite and the sds-node-configurator agent now lock shared LVM volume groups against each other, so concurrent volume operations of sds-local-volume and sds-replicated-volume no longer corrupt a shared thin pool."

new_features:
  - "On DKP 1.78 and later, the module's access roles follow the capability/scope RBAC scheme: the ClusterRoles `d8:system-capability:sds-replicated-volume:view` and `d8:system-capability:sds-replicated-volume:edit` grant read-only and full access to `ReplicatedStorageClass`, `ReplicatedStoragePool`, `ReplicatedVolume`, `ReplicatedVolumeReplica`, `ReplicatedVolumeAttachment`, `DRBDResource`, `DRBDResourceOperation`, `DRBDNodeOperation` and `DRBDMapper`. Below 1.78 the module keeps the `d8:manage:permission:module:sds-replicated-volume:view` and `:edit` roles."
  - "New alerts of the new control plane: `D8ReplicatedStoragePoolNotReady` fires when a `ReplicatedStoragePool` has not been `Ready` for 5 minutes (a missing LVMVolumeGroup or thin pool, an invalid node selector), and `D8ReplicatedStorageClassNotReady` when a `ReplicatedStorageClass` has not been `Ready` for 5 minutes. A class whose storage pool is not `Ready` is reported only by the pool alert. Both have severity 4 and their descriptions name the reasons and what to check. Before, such pools and classes were visible only in their status. The controller exports the new metrics `sds_rsp_condition_problem_timestamp_seconds` and `sds_rsc_condition_problem_timestamp_seconds` for them."
  - "The `SDS Replicated Volume` Grafana dashboard of the new control plane has a new row, `Capacity by ReplicatedStorageClass`. For each selected class it shows the capacity and free space of its storage pool both before replication and divided by the number of replicas of the class, the allocation of thin pools against `allocationLimit`, and a table per node and LVMVolumeGroup. Thin pools are counted by their allocation limit: free space is the thin pool size multiplied by `allocationLimit` minus the space already allocated. For this, the controller exports the new metrics `sds_rsp_lvg_info` (the LVMVolumeGroups and thin pools of a `ReplicatedStoragePool`) and `sds_rsc_replicas` (the number of replicas and the storage pool of a `ReplicatedStorageClass`), which join the capacity metrics of sds-node-configurator to storage classes."
  - "In the new control plane, a `ReplicatedStorageClass` can wipe the data of its volumes before their space is released: `spec.volumeCleanup` takes the methods of sds-node-configurator, `RandomFillSinglePass`, `RandomFillThreePass` or `Discard` (thick volumes only, `storage.type: LVM`). The method is fixed for a volume when it is created (it is recorded in `spec.volumeCleanup` of the `ReplicatedVolume`), covers the logical volumes of all its replicas, including replicas created later, and is applied whenever such a logical volume is removed: when the volume is deleted and when a replica moves or loses its disk. Changing the field of the class recreates the StorageClass and affects only volumes created afterwards. Overwriting takes time proportional to the size of the volume, and a deleted volume is gone only after the wipe. Available in the Enterprise Edition and the Certified Security Edition Pro; in the other editions the webhook rejects the field."
  - "In the new control plane, `ReplicatedStorageClass` and `ReplicatedStoragePool` now record a Kubernetes Event when their `Ready` condition changes status or reason: a `Warning` when it turns `False`, a `Normal` one when it turns `True` again. The reason of the Event is the reason of the condition, for example `WaitingForStoragePool`, `Degraded` or `LVMVolumeGroupNotFound`, so `kubectl describe` shows when a class or a pool broke and when it recovered. A reconcile pass that changes nothing, or changes only the message, records no Event. Both kinds are cluster-scoped, so their Events are in the `default` namespace, and the controller is granted the right to create them there."
improvements:
  - "New alert `D8DrbdResourceIOSuspended` fires when a DRBD resource has had its I/O suspended for 5 minutes for a reason other than a lost quorum (no up-to-date replica reachable, fencing, or `drbdsetup suspend-io`). I/O to such a volume hangs instead of failing, and before only the loss of quorum raised an alert. The alert description shows how to find the reason and what to do."
  - "Removing a thin pool from `spec.thinPools` of an LVMVolumeGroup is now rejected while a ReplicatedStoragePool or a ReplicatedStorageClass uses that thin pool. sds-node-configurator removes a thin pool dropped from the spec once it is empty, and replicas would then be placed in a thin pool that is gone. The check does not block LVMVolumeGroup updates while the module's webhook is unavailable."
  - "During scheduling simulations of the Deckhouse kube-scheduler (filter and prioritize requests with `dryRun: true`), `linstor-scheduler-extender` no longer records `FailedScheduling` Events on the simulated Pod, so descheduler checks no longer leave false scheduling errors on running VM Pods."
  - "In the new control plane, `spec.storage`, `spec.nodeLabelSelector`, `spec.zones` and `spec.eligibleNodesPolicy` of a `ReplicatedStorageClass` can be changed after creation: a change moves the class to a new automatically created storage pool, and new volumes get the new configuration. The restrictions stay only for classes of the LINSTOR control plane."
  - "In the new control plane, a `ReplicatedStorageClass` whose storage pool or eligible nodes degraded after its configuration was accepted is reported in the new `Degraded` phase with the `Degraded` reason of `Ready`: the accepted configuration stays in effect, but replicas can be placed only on the nodes the pool still offers. The `Terminating` phase names the number of volumes it waits for, and `VolumesSatisfyEligibleNodes` names the number of conflicting volumes."
fixes:
  - "In the new control plane, the controller no longer deletes a StorageClass of another provisioner that has the name of a `ReplicatedStorageClass`. It used to remove such a StorageClass and create its own in its place. Now it leaves the StorageClass alone, and the `ReplicatedStorageClass` goes to the `InvalidConfiguration` phase with `Ready=False`, reason `StorageClassConflict`, and a message naming the StorageClass and its provisioner. Once the name is free, the class gets its StorageClass within a minute."
  - "In the LINSTOR control plane, a `ReplicatedStorageClass` whose name is held by a StorageClass of another provisioner now goes to the `InvalidConfiguration` phase with a message naming the StorageClass and its provisioner. Before, the conflict was only written to the controller log and the status did not change."
  - "`DeleteVolume` refused a volume for good when a ReplicatedVolumeAttachment of it outlived the VolumeAttachment of its node: the CSI controller finalizer on the attachment is removed only by `ControllerUnpublishVolume`, which the external-attacher never calls again once the VolumeAttachment is gone, and the PersistentVolume stayed `Released`. `DeleteVolume` now releases such attachments first, unless their device is still in use."
  - "In the new control plane, the StorageClass of a `ReplicatedStorageClass` now has the annotation `storage.deckhouse.io/volumesnapshotclass: sds-replicated-volume`, as in the LINSTOR control plane. Without it, storage-foundation did not fill in `volumeSnapshotClassName` of a VolumeSnapshot of a volume of the class, and a VolumeCaptureRequest of such a volume failed with a message about the missing annotation. Existing StorageClasses get the annotation at the next reconciliation without being recreated; a different value set by hand is replaced."
  - "The LINSTOR satellite now locks LVM volume groups through the host lock directory, the one the sds-node-configurator agent uses. When sds-local-volume and sds-replicated-volume share a volume group, `lvcreate` and `lvremove` from both sides ran without excluding each other and could corrupt the thin pool metadata."
  - "A `ReplicatedStorageClass` or `ReplicatedStoragePool` being deleted can lose its finalizer again. The webhook checked that update too, so a class that stopped passing validation after creation, for example an `Ignored` topology once the nodes got zone labels, hung in deletion for good."
  - "The webhook now rejects a `ReplicatedStorageClass` when it cannot read the StorageClass of the same name; only a missing StorageClass lets the class through. Before, any read error admitted the class the check exists to stop."
  - "In the new control plane, classes with different `eligibleNodesPolicy` no longer share a storage pool and silently run with another class's policy. Existing classes keep their pools after the update and move to the new pool name on their first spec change."
  - "During the migration from LINSTOR, the volumes of a storage class in the `Degraded` phase now switch to `Auto` instead of waiting until the migration step gives up."
security:
  - "`golang.org/x/net` v0.62.0 (CVE-2026-78661, CVE-2026-97045), and the ALT Linux packages of `spaas`, `drbd-reactor`, `metadata-backup` and `linstor-server` are taken from the 2026/10/31 snapshot (curl 8.23.0, libbrotli 1.2.1, cups 2.4.20, freetype 2.14.3)."

breaking:
  - "On DKP 1.78 and later, the `d8:manage:permission:module:sds-replicated-volume:view` and `:edit` ClusterRoles are no longer created; bindings that reference them by name stop granting access."

dependencies:
  - name: DRBD
    from: "9.2.18-flant.10"
    to: "9.2.19-flant.21"

upgrade_notes:
  - "On DKP 1.78 and later, the `d8:manage:permission:module:sds-replicated-volume:view` and `:edit` ClusterRoles are replaced by `d8:system-capability:sds-replicated-volume:view` and `:edit`. Bindings that reference the old role names directly have to be switched to the new ones."
docs:
  - "The FAQ now says that overprovisioning of LVMThin pools is limited by LINSTOR and that `allocationLimit` of the thin pool in LVMVolumeGroup has no effect on the module's volumes."
  - "The description of the `dataNodes.nodeSelector` parameter and the FAQ now say what the parameter does: nodes that match it get the `storage.deckhouse.io/sds-replicated-volume-node` label and module components run on them, and a custom value replaces the default `kubernetes.io/os: linux`. Changing the selector later, including disabling the module and enabling it again with a different one, does not remove the labels from nodes that have already been selected and does not move data; the description links to the FAQ procedure for removing the module from such a node."
  - "The documentation describes how the replication mode affects latency and IOPS and how to disable the module."

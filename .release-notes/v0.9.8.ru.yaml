date: "2026-09-14"

summary: "Сертификаты модуля теперь обновляются и раскатываются сами, ложный алерт об истечении больше не срабатывает, а контроллер отдаёт метрики за kube-rbac-proxy."

highlights:
  - "Сертификаты модуля переподписываются за 45 дней до истечения, а использующие их рабочие нагрузки перезапускаются автоматически. До сих пор сертификаты не обновлялись вовсе: они перевыпускались только когда их Secret пропадал или оказывался пустым."
  - "`D8LinstorCertificateExpiringIn30d` больше не срабатывает на сертификатах, которые модулю не принадлежат. Хук помечал все Secret в неймспейсе модуля, включая сертификаты Let's Encrypt, скопированные туда модулем `secret-copier`."
  - "Контроллер отдаёт метрики за `kube-rbac-proxy`, вместе с `ServiceMonitor` для Prometheus."

new_features:
  - "Контроллер публикует метрики: сам он слушает на `127.0.0.1`, а `kube-rbac-proxy` в том же поде отдаёт их по TLS, поэтому для доступа нужен `get` на `deployments/prometheus-metrics`, и это право выдано только сборщику Prometheus. `ServiceMonitor` создаётся там, где такой вид ресурса есть, а порты настраиваются значениями модуля `oldControllerMetricsPort` и `oldControllerMetricsProxyPort`."

fixes:
  - "Сертификаты обновляются без ручного вмешательства. Каждая группа сертификатов теперь хранит свой CA, сертификат и закрытый ключ в собственном Secret, и сертификат переподписывается тем же CA за 45 дней до истечения; CA живёт десять лет и заменяется только когда уже не может покрыть полный срок жизни сертификата. Обновление вступает в силу после перезапуска, и новый хук перезапускает рабочие нагрузки, которые ссылаются на обновлённый Secret с сертификатом."
  - "Хук пометки истекающих сертификатов теперь смотрит только на Secret самого модуля, снимает свою метку с остальных и больше не паникует на Secret без меток. Раньше он помечал все Secret в неймспейсе модуля, поэтому скопированные туда другими модулями сертификаты раз в несколько недель поднимали `D8LinstorCertificateExpiringIn30d`."
  - "Secret `linstor-scheduler-admission-certs`, оставшийся от ранее удалённого компонента, больше не заставляет перевыпускать группу сертификатов вебхуков при каждом прогоне хуков — что каждый раз заново выпускало CA и переписывало `caBundle` вебхуков. Он убран из группы и из схемы openapi, а отдельный хук удаляет и сам оставшийся Secret."
  - "Том, файловую систему которому CSI-драйвер создаёт сам после неудачного монтирования, форматируется командой `mkfs.ext4 -m0` и больше не отдаёт суперпользователю 5 % своего объёма."

improvements:
  - "Контроллер пишет логи через общий логгер в том же структурированном формате, что и остальные модули, вместо собственной копии прежнего пакета логирования."

upgrade_notes:
  - "Руками делать ничего не нужно, и обновление ничего не ротирует: группы сертификатов, выпущенные прежними версиями, чей ключ CA неизвестен, остаются нетронутыми, пока их сертификаты не устареют."
  - "Рабочие нагрузки, которым нужен обновлённый сертификат, перезапускает хук на следующей после обновления сходимости. Переподпись за 45 дней оставляет прежний сертификат действительным всё это время."
